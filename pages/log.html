<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小店日记</title>
    <style>
        body { background: #fffaf0; padding: 12px 16px; margin: 0; font-family: sans-serif; color: #666; font-size: 14px; }
        .log-title { color: #ff6b81; font-weight: bold; font-size: 15px; margin-bottom: 8px; border-bottom: 1px solid #ffe4e1; padding-bottom: 6px; }
        .log-list { height: calc(100% - 30px); overflow-y: auto; }
    </style>
</head>
<body>
    <div class="log-title">📜 小店日记</div>
    <div class="log-list" id="logList"></div>

    <script>
        function renderLogList() {
            const Cake = window.parent.Cake;
            if (!Cake) return;

            const logList = document.getElementById('logList');
            const logs = (Cake.store && Cake.store.state && Cake.store.state.log) || [];

            if (logs.length === 0) {
                logList.innerHTML = '<div style="text-align:center; color:#aaa; margin-top:20px;">暂无记录，快去创造故事吧～</div>';
            } else {
                logList.innerHTML = logs.slice().reverse().map(l =>
                    `<div style="margin-bottom:8px; line-height:1.5;">📝 第${l.day}天：${Cake.escapeHtml(l.text)}</div>`
                ).join('');
            }
        }

        window.onload = renderLogList;

        // ✨ 跨 iframe 同步：其它窗口保存存档后，本窗口也刷新日志
        window.addEventListener('storage', function (e) {
            if (e.key && e.key !== 'cakeShopSave_v1') return;
            if (e.storageArea && e.storageArea !== window.localStorage) return;
            // 先让 parent 同步（game.html 里 render.js 的 storage 监听会更新 parent state），
            // 用 requestAnimationFrame 等下一次渲染再读取
            requestAnimationFrame(renderLogList);
        });
    </script>
</body>
</html>
