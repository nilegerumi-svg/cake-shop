<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>总地图</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <style>
        body { background: transparent; padding: 16px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .map-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); width: 100%; max-width: 400px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px dashed #ffd1dc; padding-bottom: 12px; }
        .header h2 { color: #ff6b81; margin: 0; font-size: 18px; }
        .back-btn { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; padding: 4px 8px; font-weight: bold; }
        .back-btn:active { color: #ff6b81; }
        .energy-badge { background: #fff9fa; padding: 4px 10px; border-radius: 20px; font-size: 13px; border: 1px solid #ffd1dc; font-weight: bold; }
        .region-title { margin: 20px 0 10px 0; font-size: 15px; color: var(--pink-600); border-left: 4px solid var(--pink-400); padding-left: 8px; }
        .loc-list { display: flex; flex-direction: column; gap: 12px; }
        .loc-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff5f7; border: 1px solid #ffb6c1; border-radius: 12px;
            padding: 15px; cursor: pointer; transition: all 0.2s;
        }
        .loc-item:active { transform: scale(0.98); background: #ffe4e8; }
        .loc-item.disabled { background: #f5f5f5; border-color: #ddd; opacity: 0.6; pointer-events: none; }
        .loc-info { display: flex; align-items: center; gap: 14px; }
        .loc-emoji { font-size: 32px; }
        .loc-text { display: flex; flex-direction: column; text-align: left; }
        .loc-name { font-size: 16px; font-weight: bold; color: #4a3b3f; }
        .loc-desc { font-size: 12px; color: #888; margin-top: 4px; }
        .loc-cost { font-size: 12px; color: var(--pink-600); font-weight: bold; margin-top: 4px; }
        .loc-arrow { font-size: 16px; color: #ffb6c1; }
    </style>
</head>
<body>
    <div class="map-card">
        <div class="header">
            <button class="back-btn" id="btnBack" type="button">◀ 返回</button>
            <h2>🗺️ 城镇地图</h2>
            <div class="energy-badge">⚡<span id="energy">--</span></div>
        </div>

        <div id="mapContent"></div>
    </div>

    <script src="../../boot-safe.js"></script>
    <script type="module">
        let Cake = null;
        const $ = (id) => document.getElementById(id);
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        function getCake() {
            try {
                if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake;
            } catch (_) {}
            return window.Cake || null;
        }

        function renderMap() {
            Cake = getCake();
            if (!Cake || !Cake.store || !Cake.store.state) return;
            const state = Cake.store.state;
            const energy = num(state.energy, 0);
            $('energy').textContent = energy;

            const list = $('mapContent');
            if (!list) return;

            const locations = Array.isArray(Cake.LOCATIONS) ? Cake.LOCATIONS : [];
            const groups = Array.isArray(Cake.REGIONS) ? Cake.REGIONS : [];

            if (locations.length === 0 && groups.length === 0) {
                list.innerHTML = '<div class="muted text-center">地图数据尚未就绪</div>';
                return;
            }

            const html = groups.map((region) => {
                const items = (region.locations || []).map((loc) => {
                    const entry = locations.find((item) => item.id === loc || item.key === loc) || {};
                    const cost = num(entry.cost, 0);
                    const disabled = energy < cost;
                    return `
                        <div class="loc-item ${disabled ? 'disabled' : ''}" data-target="${entry.id || loc}">
                            <div class="loc-info">
                                <div class="loc-emoji">${entry.emoji || '📍'}</div>
                                <div class="loc-text">
                                    <div class="loc-name">${entry.name || loc}</div>
                                    <div class="loc-desc">${entry.desc || '探索这个地方'}</div>
                                    <div class="loc-cost">⚡ ${cost}</div>
                                </div>
                            </div>
                            <div class="loc-arrow">→</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div>
                        <div class="region-title">${region.name || '区域'}</div>
                        <div class="loc-list">${items}</div>
                    </div>
                `;
            }).join('');

            list.innerHTML = html;

            list.querySelectorAll('.loc-item').forEach((item) => {
                item.onclick = () => {
                    const target = item.dataset.target;
                    if (!target) return;
                    const entry = locations.find((loc) => loc.id === target || loc.key === target);
                    if (!entry) return;
                    if (num(state.energy, 0) < num(entry.cost, 0)) {
                        alert('⚡ 精力不足，不能前往这里');
                        return;
                    }
                    const nextUrl = `location.html?id=${encodeURIComponent(target)}`;
                    window.location.href = nextUrl;
                };
            });
        }

        function bindPage() {
            const backBtn = $('btnBack');
            if (backBtn && backBtn.dataset.bound !== 'true') {
                backBtn.dataset.bound = 'true';
                backBtn.addEventListener('click', () => history.back());
            }
            renderMap();
            if (typeof Cake?.initPage === 'function') {
                Cake.initPage('fun', renderMap, false);
            }
        }

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                bindPage();
            }, {
                timeout: 15000,
                required: (game) => !!(game && game.store && game.store.state),
                onTimeout: () => '地图数据加载超时，请刷新页面'
            });
        } else {
            Cake = getCake();
            if (Cake && Cake.store && Cake.store.state) bindPage();
        }
    </script>
</body>
</html>
