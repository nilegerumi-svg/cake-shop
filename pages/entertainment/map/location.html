<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>地点</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <style>
        :root {
            --card-w-mobile: min(92vw, 420px);
            --card-w-pc: min(32vw, 480px);
        }

        body {
            background: transparent;
            font-family: sans-serif;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #4a3b3f;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(255,182,193,0.2);
            width: var(--card-w-mobile);
            max-width: 100%;
            aspect-ratio: 4 / 5;
            box-sizing: border-box;
            /* 地点动作与内嵌商店可能超出固定比例高度，允许滚动；
               矮屏下再受视口高度限制，避免卡片整体被裁掉 */
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed #ffd1dc; padding-bottom: 12px; }
        .header h2 { color: #ff6b81; margin: 0; font-size: 18px; }
        .back-btn { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; padding: 4px 8px; font-weight: bold; }
        .back-btn:active { color: #ff6b81; }
        .energy-badge { background: #fff9fa; padding: 4px 10px; border-radius: 20px; font-size: 13px; border: 1px solid #ffd1dc; font-weight: bold; }
        .loc-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .loc-emoji { font-size: 40px; }
        .loc-meta { display: flex; flex-direction: column; text-align: left; }
        .loc-name { font-size: 20px; font-weight: bold; color: #4a3b3f; }
        .loc-desc { font-size: 13px; color: #888; margin-top: 4px; line-height: 1.5; }
        .section-title { color: #d85c74; font-size: 14px; font-weight: bold; margin: 16px 0 10px; text-align: left; border-left: 4px solid #ffb6c1; padding-left: 8px; }
        .action-list { display: flex; flex-direction: column; gap: 10px; }
        .action-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: #f0faf8;
            color: #4a3b3f;
            border: 1px solid #a8e6cf;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            text-align: left;
            box-sizing: border-box;
        }
        .action-item:active { transform: scale(0.98); background: #e0f5f0; }
        .action-item.rest { background: #fff0f5; border-color: #ffb6c1; }
        .action-item.rest:active { background: #ffe4e8; }
        .action-item.disabled { background: #f5f5f5; border-color: #ddd; color: #aaa; cursor: not-allowed; }
        .action-info { display: flex; align-items: center; gap: 12px; }
        .action-emoji { font-size: 24px; }
        .action-text { display: flex; flex-direction: column; text-align: left; }
        .action-name { font-size: 15px; font-weight: bold; }
        .action-desc { font-size: 12px; color: #888; font-weight: normal; margin-top: 2px; }
        .action-arrow { font-size: 13px; color: #ffb6c1; white-space: nowrap; }

        /* 内嵌商店 */
        .shop-list { display: flex; flex-direction: column; gap: 8px; }
        .shop-row {
            display: flex; align-items: center; gap: 10px;
            background: #fff8fa; border: 1px solid #ffd1dc;
            border-radius: 10px; padding: 10px 12px;
        }
        .shop-emoji { font-size: 20px; flex: 0 0 auto; }
        .shop-name { flex: 1; font-size: 13px; font-weight: bold; color: #4a3b3f; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .shop-price { font-size: 12px; color: #d85c74; font-weight: bold; white-space: nowrap; }
        .buy-btn {
            flex: 0 0 auto; border: none; border-radius: 999px;
            padding: 6px 12px; font-size: 12px; font-weight: bold;
            background: #ff8fa3; color: #fff; cursor: pointer;
        }
        .buy-btn:active { transform: scale(0.96); }
        .buy-btn:disabled { background: #e5e5e5; color: #999; cursor: not-allowed; }
        .shop-hint { font-size: 11px; color: #999; text-align: center; margin-top: 8px; }

        @media (min-width: 768px) {
            .card {
                width: var(--card-w-pc);
                min-height: 640px;
                aspect-ratio: 4 / 5;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <button class="back-btn" id="btnBack" type="button" onclick="history.back()">◀ 返回</button>
            <h2 id="pageTitle">📍 地点</h2>
            <div class="energy-badge">⚡<span id="energy">--</span></div>
        </div>

        <div id="locationContent"></div>
    </div>

    <script src="../../../pages/boot-safe.js"></script>
    <script type="module">
        let Cake = null;
        const $ = (id) => document.getElementById(id);
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        function getCake() {
            try {
                if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake;
            } catch (_) {}
            return window.Cake || null;
        }

        window.handleLocationAction = (actionKey, locKey) => {
            if (!Cake || !Cake.store || !Cake.store.state) return;
            try {
                const res = Cake.performLocationAction && Cake.performLocationAction('town', locKey, actionKey);
                if (res && res.success === false) {
                    alert(res.message);
                    return;
                }
            } catch (err) {
                console.error('[location] 动作执行失败:', err);
                alert('❌ 动作执行失败：' + (err && err.message || err));
                return;
            }
            setTimeout(renderLocation, 200);
        };

        function renderLocation() {
            Cake = getCake();
            if (!Cake || !Cake.store || !Cake.store.state) return;
            const params = new URLSearchParams(window.location.search);
            const key = params.get('id') || 'park';

            // 统一从区域配置取地点数据，并与动作接口保持一致
            let loc = null;
            const locs = (typeof Cake.getRegionLocations === 'function') ? Cake.getRegionLocations('town') : null;
            loc = (locs && (locs[key] || (locs.find && locs.find((x) => x.id === key || x.key === key)))) || null;

            // 兜底：从汇总 LOCATIONS 中查找
            if (!loc) {
                const list = Array.isArray(Cake.LOCATIONS) ? Cake.LOCATIONS : Object.values(Cake.LOCATIONS || {});
                loc = list.find((item) => item.id === key || item.key === key) || null;
            }

            loc = loc || { id: key, name: '未知地点', emoji: '📍', desc: '该地点目前尚未配置。' };
            const state = Cake.store.state;

            $('pageTitle').textContent = `${loc.emoji || '📍'} ${loc.name || '地点'}`;
            $('energy').textContent = num(state.energy, 0);

            // 动作列表：优先引擎接口，兜底 loc.actions
            let actions = [];
            if (typeof Cake.getLocationActions === 'function') {
                try { actions = Cake.getLocationActions('town', key) || []; } catch (_) {}
            }
            if (actions.length === 0 && Array.isArray(loc.actions)) actions = loc.actions;

            // 内嵌商店：该地点配了商店时，就地展示可购商品
            let shopHtml = '';
            try {
                const shopInfo = (typeof Cake.getLocationShop === 'function') ? Cake.getLocationShop('town', key) : null;
                if (shopInfo && Array.isArray(shopInfo.items) && shopInfo.items.length > 0) {
                    const money = num(state.money, 0);
                    const rows = shopInfo.items.map((item) => {
                        const price = num(item.price, 0);
                        const affordable = money >= price;
                        return `
                            <div class="shop-row">
                                <span class="shop-emoji">${item.emoji || '📦'}</span>
                                <span class="shop-name">${item.name || item.id}</span>
                                <span class="shop-price">💰 ${price}</span>
                                <button class="buy-btn" type="button" data-buy="${item.id}" ${affordable ? '' : 'disabled'}>${affordable ? '订购' : '钱不够'}</button>
                            </div>
                        `;
                    }).join('');

                    shopHtml = `
                        <div class="section-title">${shopInfo.shop.emoji || '🏪'} ${shopInfo.shop.name || '商店'}</div>
                        <div class="shop-list">${rows}</div>
                        <div class="shop-hint">下单后约 2 小时送达店铺</div>
                    `;
                }
            } catch (err) {
                // 商店数据缺失时不影响地点探索
                console.warn('[location] 商店渲染跳过:', err);
            }

            const html = `
                <div class="loc-head">
                    <div class="loc-emoji">${loc.emoji || '📍'}</div>
                    <div class="loc-meta">
                        <div class="loc-name">${loc.name || '地点'}</div>
                        <div class="loc-desc">${loc.desc || '探索与互动'}</div>
                    </div>
                </div>
                <div class="section-title">可执行动作</div>
                <div class="action-list">
                    ${actions.map((action) => {
                        const actionKey = action.key || action.id || action.name || 'action';
                        const disabled = num(action.cost, 0) > num(state.energy, 0);
                        return `
                            <button class="action-item ${action.type === 'rest' ? 'rest' : ''} ${disabled ? 'disabled' : ''}" type="button" data-action="${actionKey}" data-loc="${key}" ${disabled ? 'disabled' : ''} onclick="window.handleLocationAction && window.handleLocationAction('${actionKey}', '${key}')">
                                <div class="action-info">
                                    <div class="action-emoji">${action.emoji || '✨'}</div>
                                    <div class="action-text">
                                        <div class="action-name">${action.name || '动作'}</div>
                                        <div class="action-desc">${action.desc || '进行一次活动'}${action.cost ? ` · 消耗 ${action.cost} 精力` : ''}</div>
                                    </div>
                                </div>
                                <div class="action-arrow">${disabled ? '锁定' : '执行'}</div>
                            </button>
                        `;
                    }).join('') || '<div class="muted text-center">暂无可执行动作</div>' }
                </div>
                ${shopHtml}
            `;
            $('locationContent').innerHTML = html;
            bindShopButtons();
        }

        // === 商店订购按钮（事件委托，避免重渲染后失效） ===
        function bindShopButtons() {
            const root = $('locationContent');
            if (!root || root.dataset.shopBound === 'true') return;
            root.dataset.shopBound = 'true';

            root.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-buy]');
                if (!btn || btn.disabled) return;

                const itemId = btn.dataset.buy;
                if (!Cake || !Cake.store || !Cake.store.state) return;

                try {
                    if (typeof Cake.orderItem !== 'function') {
                        alert('❌ 订购功能未加载，请刷新重试');
                        return;
                    }
                    const res = Cake.orderItem(itemId, 1);
                    if (res && res.success === false) {
                        alert(res.message || '订购失败');
                    } else {
                        renderLocation();
                    }
                } catch (err) {
                    console.error('[location] 订购失败:', err);
                    alert('❌ 订购失败：' + (err && err.message || err));
                }
            });
        }

        function bindPage() {
            const backBtn = $('btnBack');
            if (backBtn && backBtn.dataset.bound !== 'true') {
                backBtn.dataset.bound = 'true';
                backBtn.onclick = () => history.back();
            }
            renderLocation();
            if (typeof Cake?.initPage === 'function') {
                Cake.initPage('fun', renderLocation, false);
            }
        }

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                bindPage();
            }, {
                timeout: 15000,
                required: (game) => !!(game && game.store && game.store.state),
                onTimeout: () => '地图地点数据加载超时，请刷新页面'
            });
        } else {
            Cake = getCake();
            if (Cake && Cake.store && Cake.store.state) bindPage();
        }
    </script>
</body>
</html>
