<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏅 成就殿堂</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .ach-card {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 15px; border-radius: 12px;
            background: #fff; border: 1px solid var(--pink-100);
            opacity: 0.7; margin-bottom: 10px; transition: 0.3s;
        }
        .ach-card.earned { background: #fffde7; border-color: #ffd54f; opacity: 1; }
        .ach-icon { font-size: 28px; width: 40px; text-align: center; }
        .ach-name { font-weight: bold; font-size: 15px; color: var(--text-main); }
        .ach-desc { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--pink-600); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <button type="button" class="back-btn" id="backBtn">← 返回个人中心</button>
        <div class="content" id="content"></div>
    </div>

    <!-- 引擎等待器（与配方页/采购页一致） -->
    <script src="../boot-safe.js"></script>
    <script type="module">
        // 引擎由父页面异步注入，不能在此同步取用
        let Cake = null;

        // 返回按钮不依赖引擎，先绑定，避免页面成为死胡同
        document.getElementById('backBtn').addEventListener('click', () => history.back());

        const render = () => {
            const s = Cake.store.state;
            const achievements = Cake.ACHIEVEMENTS || [];
            const contentEl = document.getElementById('content');

            const earnedCount = achievements.filter(a => s.achievements && s.achievements[a.id]).length;
            const pct = achievements.length > 0 ? Math.round((earnedCount / achievements.length) * 100) : 0;

            const cards = achievements.map(a => {
                const earned = Boolean(s.achievements && s.achievements[a.id]);
                return `
                    <div class="ach-card ${earned ? 'earned' : ''}">
                        <div class="ach-icon">${earned ? (a.icon || '🏅') : '🔒'}</div>
                        <div>
                            <div class="ach-name">${a.name || a.id}</div>
                            <div class="ach-desc">${a.desc || '完成特定条件解锁'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <h2 style="margin:0;">🏅 成就殿堂</h2>
                        <span style="font-weight:bold; color:var(--pink-600);">${earnedCount}/${achievements.length} (${pct}%)</span>
                    </div>
                    <div class="aff-bar" style="height:8px; margin-bottom: 15px;">
                        <div class="aff-fill" style="width:${pct}%;"></div>
                    </div>
                    ${cards || '<p class="muted">暂无成就</p>'}
                </div>`;
        };

        const start = () => {
            if (typeof Cake.initPage === 'function') {
                Cake.initPage('profile', render, false);
            } else {
                render();
            }
        };

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                start();
            }, {
                timeout: 15000,
                // 需等成就数据到位，否则会渲染成空的「暂无成就」
                required: (game) => !!(game && game.store && game.store.state && game.ACHIEVEMENTS),
                onTimeout: () => '成就殿堂：游戏引擎或成就数据加载超时，请刷新页面重试。'
            });
        } else {
            Cake = window.parent.Cake || window.Cake;
            if (Cake && Cake.store && Cake.store.state) start();
        }
    </script>
</body>
</html>
