<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 我的 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>

    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;

        const contentEl = document.getElementById('content');
        const esc = Cake.escapeHtml || ((v) => String(v ?? ''));
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        // 渲染成就模块
        const renderAchievements = (s, achievements) => {
            if (!achievements || achievements.length === 0) return '<p class="muted">尚未解锁任何成就。</p>';
            return achievements.map((a) => {
                const earned = Boolean(s.achievements && s.achievements[a.id]);
                return `<div class="achievement ${earned ? 'earned' : ''}">
                    <span class="a-icon">${earned ? '✅' : '🔒'}</span>
                    <div>
                        <div style="font-weight:700;">${a.icon || ''} ${a.name || a.id}</div>
                        <div class="muted">${a.desc || ''}</div>
                    </div>
                </div>`;
            }).join('');
        };

        const renderProfile = () => {
            const s = Cake.store.state;
            const achievements = Cake.ACHIEVEMENTS || [];

            const earnedCount = achievements.filter((a) => s.achievements && s.achievements[a.id]).length;
            const total = achievements.length;
            const pct = total > 0 ? Math.round((earnedCount / total) * 100) : 0;

            // 对齐最新的 schema 结构
            const shopName = s.shop?.name || '甜蜜小屋';
            const day = num(s.time?.day, 1);
            const money = num(s.money, 0);
            const reputation = num(s.shop?.stats?.reputation, 0);
            
            // 这些数据目前 schema 里还没加，先做兜底展示
            const shopLevel = num(s.shopLevel, 1); 
            const decoration = num(s.decoration, 0);
            const totalCakes = num(s.totalCakes, 0);
            const totalEarned = num(s.totalEarned, 0);

            contentEl.innerHTML = `
                <div class="card">
                    <h2>📊 我的档案</h2>
                    <div class="grid-2">
                        <div class="item-card">
                            <span class="item-emoji">${esc(s.avatar || '👩‍🍳')}</span>
                            <span class="item-name">${esc(s.playerName || '店长')}</span>
                            <span class="item-desc">「${esc(shopName)}」的店长</span>
                            <span class="item-meta">经营第 ${day} 天 · Lv.${shopLevel} · 装饰度 ${decoration}</span>
                        </div>
                        <div class="item-card">
                            <span class="item-emoji">📈</span>
                            <span class="item-name">经营数据</span>
                            <span class="item-desc">余额：${money}元<br>累计卖出：${totalCakes}个<br>累计收入：${totalEarned}元<br>当前声望：${reputation}</span>
                        </div>
                    </div>
                    
                    <h3>🏅 成就（${earnedCount}/${total}，${pct}%）</h3>
                    <div class="aff-bar" style="height:8px;margin:0 0 10px;" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
                        <div class="aff-fill" style="width:${pct}%;"></div>
                    </div>
                    <div class="achievement-list">${renderAchievements(s, achievements)}</div>
                    
                    <h3>💾 存档 & 系统</h3>
                    <div class="char-actions" style="gap:10px;margin-top:8px;">
                        <button type="button" class="small" data-action="save">💾 保存游戏</button>
                        <button type="button" class="small secondary" data-action="reset">🔄 重新开始</button>
                    </div>
                </div>`;
        };

        /* ==================== 事件委托 ==================== */
        const bindClick = () => {
            const ACTIONS = {
                save: () => {
                    Cake.saveState();
                    alert('✅ 游戏已保存！');
                },
                reset: () => {
                    if (confirm('⚠️ 确定要重新开始吗？这会清空当前所有进度！')) {
                        localStorage.removeItem(Cake.store.SAVE_KEY || 'cake_shop_save');
                        // 跳到开始页
                        window.parent.location.href = '../index.html';
                    }
                }
            };

            contentEl.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const handler = ACTIONS[btn.dataset.action];
                if (typeof handler === 'function') handler();
            });
        };

        /* ==================== 初始化页面 ==================== */
        if (typeof Cake.initPage === 'function') {
            bindClick();
            Cake.initPage('profile', () => {
                renderProfile();
            }, false);
        }
    </script>
</body>
</html>
