<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>观星台 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .st-head { text-align: left; margin: 4px 0 10px; }
  .st-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .st-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .sub-tabs { display:flex; gap:8px; margin-bottom:10px; }
  .sub-tab { flex:1; padding:8px; background:#fffdf8; border:1px solid #f0dcc0; border-radius:12px; font-size:13px; font-weight:bold; color:#b08a6a; cursor:pointer; font-family:inherit; }
  .sub-tab.active { background:#e04a63; color:#fff; border-color:#e04a63; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .st-card { background:#fffdf8; border:1px solid #f0dcc0; border-radius:14px; padding:10px; display:flex; gap:8px; }
  .st-emoji { font-size:24px; line-height:1; }
  .st-body { flex:1; min-width:0; }
  .st-name { font-weight:bold; color:#4a2c17; font-size:13px; }
  .st-desc { font-size:11px; color:#b08a6a; line-height:1.4; margin-top:2px; }
  .term-card { background:#fffdf8; border:1px solid #f0dcc0; border-radius:12px; padding:8px 10px; display:flex; align-items:center; gap:8px; }
  .term-emoji { font-size:20px; }
  .term-name { font-weight:bold; color:#4a2c17; font-size:13px; }
  .term-date { font-size:11px; color:#b08a6a; margin-left:auto; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载星空...</div></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() { try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {} return window.Cake || null; }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let tab = 'star';
  function render() {
    const Cake = getCake(); const el = document.getElementById('content');
    if (!el || !Cake) return;
    const S = Cake.STARS || {}, T = Cake.SOLAR_TERMS || {};
    const ns = Object.keys(S).length, nt = Object.keys(T).length;
    let html = `<div class="st-head"><h2>🔭 观星台</h2><p class="muted">看天气 · 观星 · 节气</p></div>`;
    html += `<div class="sub-tabs" role="tablist">
      <button type="button" class="sub-tab ${tab==='star'?'active':''}" data-tab="star" role="tab" aria-selected="${tab==='star'}">🌟 星图（${ns}）</button>
      <button type="button" class="sub-tab ${tab==='term'?'active':''}" data-tab="term" role="tab" aria-selected="${tab==='term'}">🌱 二十四节气（${nt}）</button>
    </div>`;
    if (tab === 'star') {
      html += `<div class="grid">`;
      for (const s of Object.values(S)) {
        html += `<div class="st-card"><span class="st-emoji" aria-hidden="true">${s.emoji || '⭐'}</span>
          <span class="st-body"><span class="st-name">${esc(s.name)}</span><span class="st-desc">${esc(s.desc || '')}</span></span></div>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="grid" style="grid-template-columns:1fr;">`;
      for (const t of Object.values(T)) {
        html += `<div class="term-card"><span class="term-emoji" aria-hidden="true">${t.emoji || '🌱'}</span>
          <span class="term-name">${esc(t.name)}</span><span class="term-date">${t.month}月${t.day}日</span></div>`;
      }
      html += `</div>`;
    }
    el.innerHTML = html;
  }
  document.addEventListener('click', (e) => { const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); } });
  if (window.safePageBoot) window.safePageBoot.waitForCake(() => render(), { timeout:15000, required:g=>!!(g&&g.STARS), onTimeout:()=>'星空加载超时' });
  else if (getCake()) render();
})();
</script>
</body>
</html>
