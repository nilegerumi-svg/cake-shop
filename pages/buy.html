<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 采购 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script src="../js/core/store.js"></script>
    <script src="../js/data/ingredients.js"></script>
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/bundles.js"></script>
    <script src="../js/data/characters.js"></script>
    <script src="../js/data/events.js"></script>
    <script src="../js/data/shop-config.js"></script>
    <script src="../js/data/achievements.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/modal.js"></script>
    <script src="../js/core/effects.js"></script>
    <script src="../js/core/render.js"></script>
    <script src="../js/actions/bakery.js"></script>
    <script src="../js/actions/shop.js"></script>
    <script src="../js/actions/social.js"></script>
    <script src="../js/actions/system.js"></script>
    <script src="../js/shared.js"></script>
    <script>
    (() => {
        'use strict';

        const contentEl = document.getElementById('content');

        /* ==================== 购买按钮状态 ==================== */

        const buyLabel = (cost, energyCost) => {
            const { money, energy } = Game.state;
            const lackMoney = money < cost;
            const lackEnergy = energy < energyCost;

            if (!lackMoney && !lackEnergy) return { disabled: false, label: '购买' };
            if (lackMoney && lackEnergy)   return { disabled: true, label: '💸⚡ 钱和精力不足' };
            if (lackMoney)                 return { disabled: true, label: '💸 钱不够' };
            return { disabled: true, label: '⚡ 精力不足' };
        };

        /* ==================== 材料包渲染 ==================== */

        const renderBundles = () => Game.BUNDLES.map((b) => {
            const btn = buyLabel(b.cost, 5);
            return `<div class="item-card">
                <span class="item-emoji">${b.emoji}</span>
                <span class="item-name">${b.name}</span>
                <span class="item-desc">${b.desc}</span>
                <span class="item-meta">${b.cost}元</span>
                <button type="button" class="small"
                    ${btn.disabled ? 'disabled' : ''}
                    data-bundle="${b.id}">${btn.label}</button>
            </div>`;
        }).join('');

        /* ==================== 单个食材渲染 ==================== */

        const renderIngredients = (state) => Object.entries(Game.INGREDIENTS).map(([key, item]) => {
            const btn = buyLabel(item.price, 3);
            const owned = state.ingredients[key] || 0;
            return `<div class="item-card">
                <span class="item-emoji">${item.emoji}</span>
                <span class="item-name">${item.name} <span class="muted">×${owned}</span></span>
                <span class="item-meta">${item.price}元/个</span>
                <button type="button" class="small"
                    ${btn.disabled ? 'disabled' : ''}
                    data-ingredient="${key}">${btn.label}</button>
            </div>`;
        }).join('');

        /* ==================== 采购页渲染 ==================== */

        const renderBuy = () => {
            const state = Game.state;

            contentEl.innerHTML = `
                <div class="card">
                    <h2>🛒 采购食材</h2>
                    <p class="muted">购买单个食材消耗 3 精力，购买材料包消耗 5 精力。</p>
                    <h3>🎁 优惠材料包</h3>
                    <div class="grid-2">${renderBundles()}</div>
                    <h3>🌾 单个食材</h3>
                    <div class="grid-3">${renderIngredients(state)}</div>
                </div>`;
        };

        /* ==================== 事件委托 ==================== */

        contentEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-bundle], button[data-ingredient]');
            if (!btn || btn.disabled) return;

            const { bundle, ingredient } = btn.dataset;
            if (bundle)     Game.buyBundle(bundle);
            if (ingredient) Game.buyIngredient(ingredient);
        });

        /* ==================== 页面初始化 ==================== */

        Game.initPage('buy', renderBuy);
    })();
    </script>
</body>
</html>
