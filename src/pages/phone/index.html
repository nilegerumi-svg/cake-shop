<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>手机 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 16px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .p-head { text-align: center; margin: 8px 0 18px; }
  .p-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 4px; }
  .p-head p { color: #b08a6a; font-size: 12px; margin: 0; }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-family: inherit; padding: 6px 0; }
  .app:active .app-icon { transform: scale(0.94); }
  .app-icon { width: 52px; height: 52px; border-radius: 14px; background: #fffdf8; border: 1px solid #f0dcc0; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 2px 6px rgba(180,120,60,.10); transition: transform .12s; }
  .app-name { font-size: 12px; color: #4a2c17; font-weight: bold; }
  .app-desc { font-size: 10px; color: #b08a6a; }
</style>
</head>
<body>
<div class="p-head"><h2>📱 手机</h2><p class="muted">点应用打开对应功能</p></div>
<div class="apps" id="apps"></div>

<script>
(() => {
  'use strict';
  function getCake() { try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {} return window.Cake || null; }
  function nav(href) {
    try { const f = window.parent.document.getElementById('mainFrame'); if (f) { f.src = href; return; } } catch (_) {}
    window.location.href = href;
  }
  const APPS = [
    { icon: '📦', name: '订购', desc: '食材下单', href: 'pages/market/index.html' },
    { icon: '🌐', name: '上网', desc: '食谱大全', href: 'pages/profile/index.html' },
    { icon: '🕐', name: '时间', desc: '节气日历', href: 'pages/stargazing/index.html' },
    { icon: '📇', name: '通讯录', desc: '小镇伙伴', href: 'pages/fate/index.html' },
    { icon: '🗺️', name: '地图', desc: '小镇地点', href: 'pages/town/index.html' },
    { icon: '🍳', name: '厨房', desc: '烘焙料理', href: 'pages/bake/index.html' },
    { icon: '📖', name: '书房', desc: '读书解锁', href: 'pages/books/index.html' },
    { icon: '🛋️', name: '家具', desc: '布置小楼', href: 'pages/furniture/index.html' },
  ];
  const el = document.getElementById('apps');
  el.innerHTML = APPS.map(a => `<button type="button" class="app" data-href="${a.href}" aria-label="${a.name}：${a.desc}">
    <span class="app-icon" aria-hidden="true">${a.icon}</span><span class="app-name">${a.name}</span><span class="app-desc">${a.desc}</span></button>`).join('');
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-href]');
    if (b) nav(b.dataset.href);
  });
})();
</script>
</body>
</html>
