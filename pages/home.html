<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { background: transparent; padding: 16px; margin: 0; min-height: 100vh; box-sizing: border-box; display: block !important; }
        .render-error { color: #b00; padding: 16px; background: #fff; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
    (() => {
        'use strict';

        const contentEl = document.getElementById('content');

        /* =========================================================
         * 一、与父页面的握手协议
         * 发送：{ type: 'home-ready', bubble: true }
         * 回执：{ type: 'home-ready-ack' }（由 monitor.js 回）
         * ========================================================= */
        const MSG = { type: 'home-ready', bubble: true };
        const ACK_TYPE = 'home-ready-ack';

        const EVT_ACKED  = 'home-ready-acked';
        const EVT_FAILED = 'home-ready-failed';

        const NOTIFY_TOP = false;

        const RETRY_DELAYS = [150, 400, 900, 1800, 3600];
        const ACK_TIMEOUT = 1500;

        let stopped = true;
        let retryIndex = 0;
        let timer = null;
        let generation = 0;

        const targets = new Set();

        const opaque = (
            location.origin === 'null' ||
            location.protocol === 'file:' ||
            location.protocol === 'data:' ||
            location.protocol === 'blob:'
        );

        const isSameOrigin = (win) => {
            try { void win.location.href; return true; }
            catch (_) { return false; }
        };

        const originFor = (win) => {
            if (!opaque && isSameOrigin(win)) return location.origin;
            return '*';
        };

        function resolveTargets() {
            targets.clear();
            if (window.parent && window.parent !== window) targets.add(window.parent);
            if (
                NOTIFY_TOP &&
                window.top &&
                window.top !== window &&
                window.top !== window.parent
            ) {
                targets.add(window.top);
            }
        }

        function clearTimer() {
            if (timer) { clearTimeout(timer); timer = null; }
        }

        function send() {
            if (stopped) return;

            for (const win of Array.from(targets)) {
                try {
                    if (win.closed) { targets.delete(win); continue; }
                } catch (_) {
                    targets.delete(win);
                    continue;
                }

                try {
                    win.postMessage(MSG, originFor(win));
                } catch (e) {
                    console.warn('[home-ready] postMessage failed, drop target', e);
                    targets.delete(win);
                }
            }

            if (targets.size === 0) {
                fail('no-target');
                return;
            }

            clearTimer();
            timer = setTimeout(() => {
                timer = null;
                if (!stopped) scheduleRetry();
            }, ACK_TIMEOUT);
        }

        function scheduleRetry() {
            if (stopped) return;
            if (retryIndex >= RETRY_DELAYS.length) {
                fail('retries-exhausted');
                return;
            }
            const delay = RETRY_DELAYS[retryIndex++];
            clearTimer();
            timer = setTimeout(() => {
                timer = null;
                if (!stopped) send();
            }, delay);
        }

        function isKnownSource(src) {
            if (!src) return false;
            for (const win of targets) if (win === src) return true;
            return false;
        }

        function onMessage(e) {
            if (!e.data || e.data.type !== ACK_TYPE) return;
            if (!isKnownSource(e.source)) return;
            if (!opaque && isSameOrigin(e.source) && e.origin !== location.origin) return;

            stop('acked');
            try {
                window.dispatchEvent(new CustomEvent(EVT_ACKED, { detail: { generation } }));
            } catch (_) {}
        }

        function fail(reason) {
            stop(reason);
            try {
                window.dispatchEvent(new CustomEvent(EVT_FAILED, { detail: { reason, generation } }));
            } catch (_) {}
        }

        function stop(reason) {
            if (stopped) return;
            stopped = true;
            clearTimer();
            window.removeEventListener('message', onMessage);
            try {
                window.dispatchEvent(new CustomEvent('home-ready-stopped', {
                    detail: { reason, generation }
                }));
            } catch (_) {}
        }

        function startHandshake() {
            clearTimer();

            stopped = false;
            retryIndex = 0;
            generation += 1;

            resolveTargets();
            if (targets.size === 0) {
                stopped = true;
                return;
            }

            window.removeEventListener('message', onMessage);
            window.addEventListener('message', onMessage);
            send();
        }

        /* =========================================================
         * 二、渲染
         * ========================================================= */
        const RENDER_POLL_INTERVAL = 100;
        // 与 monitor.js 的 150×100ms=15s 对齐并留余量
        const RENDER_POLL_MAX = 200; // 20s
        const RETRY_INTERVAL = 2000; // 失败后每 2s 静默重试

        let renderTimer = null;
        let retryTimer = null;
        let renderStarted = false;
        let renderFailed = false;
        let delegationBound = false;

        function getEngine() {
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    return window.parent.Game;
                }
            } catch (_) {}
            return window.Game || null;
        }

        function escapeHtml(str) {
            const G = getEngine();
            if (G && typeof G.escapeHtml === 'function') {
                try { return G.escapeHtml(str); } catch (_) {}
            }
            return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function clearRenderTimer() {
            if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
            if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
        }

        function startRetryLoop() {
            if (retryTimer) return;
            retryTimer = setInterval(() => {
                const G = getEngine();
                if (G && G.state) {
                    clearInterval(retryTimer);
                    retryTimer = null;
                    renderFailed = false;
                    renderStarted = false;
                    startRender();
                }
            }, RETRY_INTERVAL);
        }

        function showRenderError(message) {
            renderFailed = true;
            contentEl.innerHTML = `<div class="render-error">❌ ${escapeHtml(message)}</div>`;
            // 不放弃：引擎可能稍后就绪，低频静默重试
            startRetryLoop();
        }

        function startRender() {
            if (renderStarted && !renderFailed) return;
            renderStarted = true;
            renderFailed = false;
            clearRenderTimer();

            let attempts = 0;
            const tick = () => {
                renderTimer = null;
                const G = getEngine();
                if (G && G.state) {
                    renderOnce(G);
                    return;
                }
                if (++attempts >= RENDER_POLL_MAX) {
                    showRenderError('未能连接到游戏引擎（父页面未挂载 Game）');
                    return;
                }
                renderTimer = setTimeout(tick, RENDER_POLL_INTERVAL);
            };
            tick();
        }

        function bindDelegation() {
            if (delegationBound) return;
            delegationBound = true;

            contentEl.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                const G = getEngine();

                try {
                    if (action === 'nap') {
                        const s = G && G.state;
                        if (!s) throw new Error('游戏状态未就绪');
                        if ((s.energy ?? 0) >= 100) return;
                        if (typeof G.rest !== 'function') throw new Error('父页面没挂载 G.rest 方法');
                        G.rest();
                    } else if (action === 'sleep') {
                        if (!G || typeof G.sleep !== 'function') throw new Error('父页面没挂载 G.sleep 方法');
                        G.sleep();
                    } else {
                        return;
                    }
                    const engine = getEngine();
                    if (engine && engine.state) setTimeout(() => renderOnce(engine), 200);
                } catch (err) {
                    alert('❌ 操作报错：' + err.message);
                }
            });
        }

        function renderOnce(G) {
            const s = G.state;
            const cakesObj = s.cakes || {};
            const recipesObj = G.RECIPES || {};
            const cakes = Object.entries(cakesObj)
                .filter(([name, count]) => count > 0 && recipesObj[name]);

            let cakesHtml = '<p class="muted">还没有蛋糕库存，快去「烘焙」页面做几个吧！</p>';
            if (cakes.length > 0) {
                cakesHtml = '<div class="grid-2">' + cakes.map(([name, count]) => {
                    const recipe = recipesObj[name] || { emoji: '🍰', price: 50 };
                    const basePrice = Number(recipe.price);
                    const priceRate = Number(s.priceRate ?? 1);
                    const unitPrice = Number.isFinite(basePrice) ? basePrice : 50;
                    const rate = Number.isFinite(priceRate) ? priceRate : 1;
                    const price = Math.round(unitPrice * rate);

                    return `<div class="item-card">
                        <span class="item-emoji">${recipe.emoji ?? '🍰'}</span>
                        <span class="item-name">${escapeHtml(name)} <span class="muted">×${count}</span></span>
                        <span class="item-meta">售价 <span class="price-tag">${price}元</span></span>
                    </div>`;
                }).join('') + '</div>';
            }

            const money = s.money ?? 500;
            const reputation = s.reputation ?? 0;
            const shopLevel = s.shopLevel ?? 1;
            const decoration = s.decoration ?? 0;
            const energy = s.energy ?? 80;
            const day = s.day ?? 1;

            contentEl.innerHTML = `
                <div class="card">
                    <h2>🏠 欢迎回来，${escapeHtml(s.playerName ?? '店长')}！</h2>
                    <p class="muted">今天是经营的第 <b>${day}</b> 天，你的「${escapeHtml(s.shopName ?? '甜蜜小屋')}」正散发着甜蜜香气～</p>
                    <div class="grid-2" style="margin-top:12px;">
                        <div class="item-card"><span class="item-emoji">💰</span><span class="item-name">${money} 元</span><span class="item-desc">当前余额</span></div>
                        <div class="item-card"><span class="item-emoji">⭐</span><span class="item-name">${reputation} 声望</span><span class="item-desc">店铺名气</span></div>
                        <div class="item-card"><span class="item-emoji">🏪</span><span class="item-name">Lv.${shopLevel} · 装饰${decoration}</span><span class="item-desc">店铺等级与装饰度</span></div>
                        <div class="item-card"><span class="item-emoji">⚡</span><span class="item-name">${energy}/100</span><span class="item-desc">今日剩余精力</span></div>
                    </div>
                    <h3>⚡ 快速行动</h3>
                    <div class="char-actions">
                       <button type="button" class="small" data-action="nap" ${energy >= 100 ? 'disabled' : ''}>😴 家里小憩</button>
                       <button type="button" class="small" data-action="sleep">🛌 睡觉</button>
                       <a href="entertainment/map.html" class="small secondary" style="text-decoration:none; text-align:center;">🚶‍♀️ 散步</a>
                    </div>
                    <h3>🧁 库存蛋糕</h3>
                    ${cakesHtml}
                </div>
            `;

            bindDelegation();
        }

        /* =========================================================
         * 三、生命周期
         * ========================================================= */
        window.addEventListener('pagehide', () => {
            stop('pagehide');
            clearRenderTimer();
        });

        window.addEventListener('pageshow', (e) => {
            if (!e.persisted) return;
            startHandshake();
            renderStarted = false;
            renderFailed = false;
            startRender();
        });

        startRender();
        startHandshake();

        window.HomePage = {
            startHandshake,
            startRender: () => {
                renderStarted = false;
                renderFailed = false;
                startRender();
            }
        };
    })();
    </script>
</body>
</html>
