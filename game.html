<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        header, nav { flex: 0 0 auto; z-index: 10; }
        .split-container {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            padding-bottom: calc(var(--footer-h, 70px) + env(safe-area-inset-bottom));
        }
        .main-frame { flex: 1; width: 100%; border: none; background: transparent; min-height: 240px; }
        .log-frame {
            flex: 0 0 clamp(110px, 22vh, 180px);
            width: 100%; border: none; background: #fff;
            border-top: 2px dashed #ffd1dc;
            box-shadow: 0 -4px 10px rgba(255, 143, 163, 0.1);
        }
        iframe { display: block; width: 100%; height: 100%; }
        .action-footer {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px;
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            background: linear-gradient(to top, #fff0f5 80%, transparent);
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; z-index: 100;
        }
        #error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;
            background: rgba(220, 38, 38, 0.95); color: white;
            padding: 10px; font-size: 13px; line-height: 1.4;
            word-break: break-all; pointer-events: none;
            max-height: 40vh; overflow-y: auto; display: none;
        }
    </style>
</head>
<body>

<div id="error-overlay"></div>

<div class="app-wrapper">
    <header id="header"></header>
    <nav id="navBar"></nav>
    <div class="split-container">
        <iframe id="mainFrame" src="pages/home.html" class="main-frame"></iframe>
        <iframe id="logFrame" src="pages/log.html" class="log-frame"></iframe>
    </div>
    <div class="action-footer" id="footer"></div>
</div>

<!-- 加载顺序：store → bridge → data → core → actions → shared（最后） -->
<script src="js/core/store.js"></script>
<script src="js/core/bridge.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>
<script src="js/actions/entertainment.js"></script>
<script src="js/shared.js"></script>

<script>
(function () {
    'use strict';

    /* ====== 报错捕获（带上限，避免刷屏） ====== */
    var errorOverlay = document.getElementById('error-overlay');
    var errorCount = 0;
    var MAX_ERRORS = 20;

    function showError(msg) {
        if (errorCount >= MAX_ERRORS) return;
        errorCount++;
        errorOverlay.style.display = 'block';
        var line = document.createElement('div');
        line.textContent = '🚨 ' + msg;
        errorOverlay.appendChild(line);
        if (errorCount === MAX_ERRORS) {
            var more = document.createElement('div');
            more.textContent = '（错误过多，已停止显示）';
            errorOverlay.appendChild(more);
        }
    }

    window.addEventListener('error', function (e) {
        showError('主页面: ' + e.message + ' (' +
            (e.filename || '').split('/').pop() + ':' + e.lineno + ')');
    });

    var mainFrame = document.getElementById('mainFrame');
    var logFrame  = document.getElementById('logFrame');
    var footer    = document.getElementById('footer');

    function bindErrorCatcher(iframe, name) {
        function attach() {
            try {
                var win = iframe.contentWindow;
                if (!win || win.__errorBound) return;
                win.__errorBound = true;
                win.addEventListener('error', function (e) {
                    showError(name + ': ' + e.message + ' (' +
                        (e.filename || '').split('/').pop() + ':' + e.lineno + ')');
                });
            } catch (_) { /* 跨域时忽略 */ }
        }
        iframe.addEventListener('load', attach);
        attach();
    }

    bindErrorCatcher(mainFrame, '主页');
    bindErrorCatcher(logFrame, '日志');

    /* ====== 导航拦截 ====== */
    function normalizePage(href) {
        var t = (href || '').trim().replace(/^\.\//, '');
        if (!t) return null;
        if (/^(https?:)?\/\//.test(t) || /^javascript:/i.test(t)) return null;
        if (t === 'game.html' || t === 'index.html') return 'pages/home.html';
        if (t.indexOf('pages/') === 0) return t;
        return 'pages/' + t;
    }
    function navigateTo(href) {
        var target = normalizePage(href);
        if (!target) return false;
        if (mainFrame.getAttribute('src') !== target) mainFrame.src = target;
        return true;
    }
    function bindLinkInterceptor(doc) {
        if (!doc || doc.__navBound) return;
        doc.__navBound = true;
        doc.addEventListener('click', function (e) {
            var link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            if (!link || link.target === '_blank') return;
            var href = link.getAttribute('href');
            if (!href || href === '#' || /^javascript:/i.test(href)) return;
            if (!/^[\w./-]+\.html(#.*)?$/.test(href)) return;
            if (navigateTo(href)) e.preventDefault();
        });
    }
    bindLinkInterceptor(document);
    [mainFrame, logFrame].forEach(function (f) {
        f.addEventListener('load', function () {
            try { bindLinkInterceptor(f.contentDocument); } catch (_) {}
        });
    });

    /* ====== 跨 iframe 广播 ====== */
    function handleStateChanged(sourceId) {
        var Cake = window.Cake;
        if (!Cake || !Cake.store) return;

        // 只有拿到有效状态才覆盖，避免把 state 写成 undefined
        try {
            if (typeof Cake.loadStateFromStorage === 'function') {
                var loaded = Cake.loadStateFromStorage();
                if (loaded) Cake.store.state = loaded;
            }
        } catch (err) {
            console.warn('[host] load state failed', err);
        }

        // 直接用 Cake.xxx，不依赖全局 Game 别名是否就绪
        try {
            if (typeof Cake.renderHeader === 'function') Cake.renderHeader();
            if (typeof Cake.renderNav === 'function') Cake.renderNav();
            if (typeof Cake.renderFooter === 'function') Cake.renderFooter();
        } catch (err) {
            console.warn('[host] render failed', err);
        }

        var msg = { type: 'state-sync', sourceId: sourceId };
        [mainFrame, logFrame].forEach(function (f) {
            try { f.contentWindow.postMessage(msg, '*'); } catch (_) {}
        });
    }

    if (window.Cake && window.Cake.bridge &&
        typeof window.Cake.bridge.setHostBroadcaster === 'function') {
        window.Cake.bridge.setHostBroadcaster(handleStateChanged);
    } else {
        // bridge.js 未就绪时，等 DOM 就绪再绑定一次
        document.addEventListener('DOMContentLoaded', function () {
            if (window.Cake && window.Cake.bridge &&
                typeof window.Cake.bridge.setHostBroadcaster === 'function') {
                window.Cake.bridge.setHostBroadcaster(handleStateChanged);
            }
        });
    }

    /* ====== Footer 高度自适应 ====== */
    if (footer && window.ResizeObserver) {
        var ro = new ResizeObserver(function () {
            document.documentElement.style.setProperty(
                '--footer-h', footer.offsetHeight + 'px');
        });
        ro.observe(footer);
    }

    /* ====== 首屏渲染 ====== */
    try {
        // 注意：第三个参数原为 true，若 render.js 的 initPage 签名是
        // (page, cb, isInIframe)，主页面必须传 false，否则 header/nav/footer
        // 会被 render.js 里的 "if (isInIframe) return" 跳过。
        // 请核对 render.js 后决定：false 或不传。
        if (window.Game && typeof window.Game.initPage === 'function') {
            window.Game.initPage('home', function () {}, false);
        }
    } catch (err) {
        showError('首屏渲染失败: ' + err.message);
    }
})();
</script>
</body>
</html>
