<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娱乐 - 甜蜜物语</title>
    <!-- 只需要引入全局 CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- 使用 game-body 控制居中宽度 -->
    <div class="game-body" style="margin-top: 20px;">
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <a href="game.html" style="text-decoration: none; color: #888; font-size: 14px;">⬅ 返回</a>
                <h2 style="margin: 0;">🎮 娱乐</h2>
                <div style="width: 40px;"></div>
            </div>

            <!-- 复用 char-actions 的按钮样式 -->
            <div class="char-actions" style="flex-direction: column;">
                <button class="small" style="padding: 15px; font-size: 16px; border-radius: 12px; background: #a1c4fd; color: #333;" onclick="doWalk()">🚶 出门散步</button>
                <button class="small" style="padding: 15px; font-size: 16px; border-radius: 12px; margin-top: 10px;" onclick="doRest()">😴 休息一下</button>
            </div>

            <p class="muted" id="status-msg" style="text-align: center; margin-top: 20px;">
                放松一下，劳逸结合~
            </p>
        </div>
    </div>

    <!-- 引入脚本 -->
    <script src="js/core/store.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/actions/system.js"></script>
    <script src="js/shared.js"></script>
    <script>
        function doWalk() {
            if (typeof Game !== 'undefined' && typeof Game.walk === 'function') {
                Game.walk();
                document.getElementById('status-msg').innerText = "散步完成，体力恢复啦！";
            } else {
                alert("找不到散步功能，请检查代码！");
            }
        }
        function doRest() {
            if (typeof Game !== 'undefined' && typeof Game.rest === 'function') {
                Game.rest();
                document.getElementById('status-msg').innerText = "美美地睡了一觉，体力满满！";
            } else {
                alert("找不到休息功能，请检查代码！");
            }
        }
    </script>
</body>
</html>
