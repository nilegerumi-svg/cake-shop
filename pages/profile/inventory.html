<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎒 食材仓库</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--pink-600); cursor: pointer; font-weight: bold; }
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

        /* 分级变质徽标 */
        .spoil-badge {
            display: inline-block; margin-top: 6px;
            padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: bold; line-height: 1.6;
        }
        .spoil-badge.warning { background: #fff8e1; color: #a06a00; border: 1px solid #ffe082; }
        .spoil-badge.spoiled { background: #fff0f0; color: #c62828; border: 1px solid #ffcdd2; }
        .spoil-badge.rotten  { background: #f5f5f5; color: #616161; border: 1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <button type="button" class="back-btn" id="backBtn">← 返回个人中心</button>
        <div class="content" id="content"></div>
    </div>

    <!-- 引擎等待器（与配方页/采购页一致） -->
    <script src="../boot-safe.js"></script>
    <script type="module">
        // 引擎由父页面异步注入，不能在此同步取用
        let Cake = null;

        // 返回按钮不依赖引擎，先绑定，避免页面成为死胡同
        document.getElementById('backBtn').addEventListener('click', () => history.back());

        const render = () => {
            const state = Cake.store.state;
            const contentEl = document.getElementById('content');

            if (!state.inventory || state.inventory.length === 0) {
                contentEl.innerHTML = '<div class="card text-center muted">仓库空空如也，快去采购吧！</div>';
                return;
            }

            const summary = {};
            state.inventory.forEach(item => {
                if (!summary[item.id]) {
                    summary[item.id] = {
                        count: 0, rotten: 0, spoiled: 0, warning: 0,
                        minRemain: Infinity, minQuality: Infinity,
                        data: Cake.INGREDIENTS[item.id] || { name: item.id, emoji: '❓' }
                    };
                }
                const g = summary[item.id];
                g.count++;
                if (item.isRotten) g.rotten++;

                // 分级变质状态（保质期系统）
                const spoil = (typeof Cake.getItemSpoilage === 'function') ? Cake.getItemSpoilage(item) : null;
                if (spoil) {
                    if (spoil === Cake.SPOILAGE_STATES.spoiled) g.spoiled++;
                    else if (spoil === Cake.SPOILAGE_STATES.warning) g.warning++;
                }

                const remain = Number(item.expireDay) - Number(state.time.day);
                if (remain < g.minRemain) g.minRemain = remain;
                const q = Number(item.quality) || 0;
                if (q < g.minQuality) g.minQuality = q;
            });

            const cards = Object.values(summary).map(item => {
                const isRotten = item.rotten > 0;

                // 变质徽标：优先展示最严重的状态
                let badge = '';
                if (isRotten) {
                    badge = `<span class="spoil-badge rotten">☠️ 腐烂 ${item.rotten}</span>`;
                } else if (item.spoiled > 0) {
                    badge = `<span class="spoil-badge spoiled">🤢 变质 ${item.spoiled}</span>`;
                } else if (item.warning > 0) {
                    badge = `<span class="spoil-badge warning">⚠️ 临期 ${item.warning}</span>`;
                }

                const remain = item.minRemain === Infinity ? '-' : Math.max(0, item.minRemain);

                return `
                    <div class="item-card" style="${isRotten ? 'border-color: var(--red-line); background: #fff0f0;' : ''}">
                        <span class="item-emoji">${item.data.emoji}</span>
                        <span class="item-name">${item.data.name}</span>
                        <span class="item-meta">数量：${item.count}</span>
                        <span class="item-meta">最短剩余：${remain} 天</span>
                        <span class="item-meta">最低品质：${item.minQuality === Infinity ? '-' : item.minQuality}</span>
                        ${badge}
                    </div>
                `;
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <h2>🎒 食材仓库</h2>
                    <p class="muted" style="margin-bottom: 15px;">食材会随时间逐级变质：临期 → 变质 → 腐烂，品质越低做出的成品越差，请尽快使用。</p>
                    <div class="inv-grid">${cards}</div>
                </div>
            `;
        };

        const start = () => {
            if (typeof Cake.initPage === 'function') {
                Cake.initPage('profile', render, false);
            } else {
                render();
            }
        };

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                start();
            }, {
                timeout: 15000,
                // 需等食材数据到位，否则食材名会显示成原始 id
                required: (game) => !!(game && game.store && game.store.state && game.INGREDIENTS),
                onTimeout: () => '食材仓库：游戏引擎或食材数据加载超时，请刷新页面重试。'
            });
        } else {
            Cake = window.parent.Cake || window.Cake;
            if (Cake && Cake.store && Cake.store.state) start();
        }
    </script>
</body>
</html>
