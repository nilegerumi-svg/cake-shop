<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 缘分 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script src="../js/core/store.js"></script>
    <script src="../js/data/ingredients.js"></script>
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/bundles.js"></script>
    <script src="../js/data/characters.js"></script>
    <script src="../js/data/events.js"></script>
    <script src="../js/data/shop-config.js"></script>
    <script src="../js/data/achievements.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/modal.js"></script>
    <script src="../js/core/effects.js"></script>
    <script src="../js/core/render.js"></script>
    <script src="../js/actions/bakery.js"></script>
    <script src="../js/actions/shop.js"></script>
    <script src="../js/actions/social.js"></script>
    <script src="../js/actions/system.js"></script>
    <script src="../js/shared.js"></script>
    <script>
    (() => {
        'use strict';

        const contentEl = document.getElementById('content');

        let Game = null;
        let tries = 0;
        const MAX_TRIES = 100;

        const safeLikes = (character) => Array.isArray(character && character.likes) ? character.likes : [];

        /* ==================== 渲染：未相遇角色 ==================== */

        const renderUnmetCard = (character) => `
            <div class="char-card" style="border-color:${character.color || '#ffe4e1'}33;opacity:0.82;">
                <div class="char-head">
                    <span class="char-emoji">${character.emoji || '❓'}</span>
                    <div>
                        <div class="char-name">${character.name || '???'}</div>
                        <div class="aff-text">🔒 尚未相遇</div>
                    </div>
                </div>
                <span class="char-desc">${character.desc || ''}</span>
                <p class="muted">继续经营蛋糕店，也许某天会在这里遇到对方……</p>
            </div>`;

        /* ==================== 渲染：邀约条件提示 ==================== */

        const buildDateHint = (characterState, state) => {
            const lacks = [];
            const aff = Number(characterState.affection) || 0;
            const money = Number(state.money) || 0;
            const energy = Number(state.energy) || 0;
            if (aff < 40)      lacks.push('💭 好感 40');
            if (money < 50)    lacks.push('💸 50 元');
            if (energy < 12)   lacks.push('⚡ 12 精力');
            return lacks.length === 0 ? '' : `邀约需 ${lacks.join(' · ')}`;
        };

        /* ==================== 渲染：送礼面板 ==================== */

        const renderGiftPanel = (cid, character, cakes) => {
            if (cakes.length === 0) {
                return '<div class="gift-panel"><span class="muted">没有蛋糕可送，先去烘焙吧～</span></div>';
            }

            const likes = safeLikes(character);

            const buttons = cakes.map(([cakeName, count]) => {
                const recipe = Game.RECIPES[cakeName] || { emoji: '🍰' };
                const liked = likes.includes(cakeName) ? '💕' : '';
                return `<button type="button" class="small" data-cid="${cid}" data-cake="${cakeName}" data-action="gift">${recipe.emoji}${cakeName} ×${count} ${liked}</button>`;
            }).join('');

            return `<div class="gift-panel">${buttons}</div>`;
        };

        /* ==================== 渲染：已相遇角色 ==================== */

        const renderMetCard = (cid, character, characterState, state, cakes) => {
            const affection = Math.max(0, Math.min(100, Number(characterState.affection) || 0));
            const giftOpen = state.giftPanelFor === cid;
            const dateHint = buildDateHint(characterState, state);
            const giftPanelHtml = giftOpen ? renderGiftPanel(cid, character, cakes) : '';
            const likes = safeLikes(character);

            return `
                <div class="char-card" style="border-color:${character.color || '#ffe4e1'}66;">
                    <div class="char-head">
                        <span class="char-emoji">${character.emoji || '❓'}</span>
                        <div>
                            <div class="char-name">${character.name || '???'}</div>
                            <div class="aff-text">${Game.affLevel(affection)} ${affection}/100</div>
                        </div>
                    </div>
                    <div class="aff-bar"><div class="aff-fill" style="width:${affection}%;"></div></div>
                    <span class="char-desc">${character.desc || ''}</span>
                    <span class="char-desc">💝 喜欢的蛋糕：${likes.length ? likes.join('、') : '暂未发现'}</span>
                    <div class="char-actions">
                        <button type="button" class="small" data-cid="${cid}" data-action="chat">💬 聊天</button>
                        <button type="button" class="small" data-cid="${cid}" data-action="date">🌹 邀约</button>
                        <button type="button" class="small ${giftOpen ? 'gold' : 'secondary'}" data-cid="${cid}" data-action="toggleGift">🎁 送蛋糕</button>
                    </div>
                    ${dateHint ? `<p class="muted" style="margin-top:2px;">${dateHint}</p>` : ''}
                    ${giftPanelHtml}
                </div>`;
        };

        /* ==================== 渲染主逻辑 ==================== */

        const renderLove = () => {
            const state = Game.state || {};
            const characters = Game.CHARACTERS || {};
            const recipes = Game.RECIPES || {};
            const cakesObj = state.cakes || {};

            const cakes = Object.entries(cakesObj)
                .filter(([name, count]) => count > 0 && recipes[name]);

            const cards = Object.entries(characters).map(([cid, character]) => {
                const characterState = (state.characters && state.characters[cid]) || { met: false, affection: 0 };
                if (!characterState.met) return renderUnmetCard(character);
                return renderMetCard(cid, character, characterState, state, cakes);
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <h2>💕 缘分相遇</h2>
                    <p class="muted">通过经营、散步与开店，你会邂逅不同的人。聊天、送礼、邀约可以提升好感度。</p>
                    <div class="grid-2" style="margin-top:12px;">${cards}</div>
                </div>`;
        };

        /* ==================== 事件委托 ==================== */

        const bindClick = () => {
            const ACTIONS = {
                chat:       (btn) => Game.social(btn.dataset.cid, 'chat'),
                date:       (btn) => Game.social(btn.dataset.cid, 'date'),
                toggleGift: (btn) => Game.toggleGiftPanel(btn.dataset.cid),
                gift:       (btn) => Game.giveGift(btn.dataset.cid, btn.dataset.cake),
            };

            contentEl.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const handler = ACTIONS[btn.dataset.action];
                if (typeof handler === 'function') handler(btn);
            });
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            let G = null;
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    G = window.parent.Game;
                }
            } catch (_) {}
            if (!G) G = window.Game || null;

            if (G && G.state && typeof G.initPage === 'function') {
                Game = G;
                window.Game = G;
                bindClick();
                G.initPage('love', renderLove);
                return;
            }

            if (++tries >= MAX_TRIES) {
                contentEl.innerHTML = '<div style="color:red;padding:20px;text-align:center;">❌ 游戏引擎加载超时，请刷新重试</div>';
                return;
            }
            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
