<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>缝纫 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .s-head { text-align: left; margin: 4px 0 10px; }
  .s-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .s-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .search { width:100%; box-sizing:border-box; padding:10px 14px; border:2px solid #f0dcc0; border-radius:12px; font-size:14px; background:#fffdf8; color:#4a2c17; margin-bottom:10px; }
  .cat-title { color:#8a5a44; font-size:14px; font-weight:bold; margin:12px 0 8px; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; }
  .s-card { background:#fffdf8; border:1px solid #f0dcc0; border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .s-emoji { font-size:26px; line-height:1; }
  .s-body { flex:1; min-width:0; }
  .s-name { font-weight:bold; color:#4a2c17; font-size:14px; }
  .s-desc { font-size:11px; color:#b08a6a; margin-top:2px; }
  .s-meta { font-size:11px; color:#e04a63; font-weight:bold; margin-top:2px; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载缝纫配方...</div></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() { try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {} return window.Cake || null; }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const CAT = { under:'🩲 内衣', top:'👕 上衣', bottom:'👖 下装', dress:'👗 连衣裙', coat:'🧥 外套', socks:'🧦 袜子', head:'👒 头饰', bag:'👜 包袋', rain:'☔ 雨具', accessory:'💍 配饰' };
  let q = '';
  function render() {
    const Cake = getCake(); const el = document.getElementById('content');
    if (!el || !Cake) return;
    const S = Cake.SEWING; if (!S) return;
    const kw = q.trim().toLowerCase();
    const groups = {};
    for (const [id, s] of Object.entries(S)) {
      if (kw && !String(s.name || '').toLowerCase().includes(kw)) continue;
      const c = s.category || 'top'; (groups[c] = groups[c] || []).push(s);
    }
    let html = `<div class="s-head"><h2>🧵 缝纫</h2><p class="muted">共 ${Object.keys(S).length} 个服装配方</p></div>`;
    html += `<input type="search" class="search" id="search" placeholder="搜索服装…" aria-label="搜索服装" value="${esc(q)}">`;
    for (const c of Object.keys(CAT).concat(Object.keys(groups).filter(k => !CAT[k]))) {
      const items = groups[c]; if (!items || !items.length) continue;
      items.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh'));
      html += `<div class="cat-title">${CAT[c] || c} <span class="muted">(${items.length})</span></div><div class="grid">`;
      for (const s of items) {
        html += `<div class="s-card"><span class="s-emoji" aria-hidden="true">${s.emoji || '👗'}</span>
          <span class="s-body"><span class="s-name">${esc(s.name)}</span><span class="s-desc">${esc(s.desc || '')}</span>
          <span class="s-meta">难度 ${s.difficulty ?? 1} · 🧵${s.thread ?? 1}</span></span></div>`;
      }
      html += `</div>`;
    }
    el.innerHTML = html;
  }
  document.addEventListener('input', (e) => { if (e.target && e.target.id === 'search') { q = e.target.value; render(); const s = document.getElementById('search'); if (s) s.focus(); } });
  if (window.safePageBoot) window.safePageBoot.waitForCake(() => render(), { timeout:15000, required:g=>!!(g&&g.SEWING), onTimeout:()=>'缝纫加载超时' });
  else if (getCake()) render();
})();
</script>
</body>
</html>
