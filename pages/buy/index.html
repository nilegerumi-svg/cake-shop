<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 采购中心 · 甜蜜物语</title>
    <!-- 引入独立的样式 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入全局样式 -->
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="card" style="padding: 10px 15px; margin-bottom: 10px;">
            <h2 style="margin: 0; font-size: 18px;">🛒 供应商直达</h2>
            <p class="muted" style="margin: 5px 0 0 0; font-size: 12px;">下单后需等待 2 小时配送。</p>
        </div>

        <div class="cat-tabs" id="categoryTabs">
            <button class="cat-btn active" data-cat="ingredients">🥩 基础食材</button>
            <button class="cat-btn" data-cat="tools">🛠️ 厨房工具</button>
            <button class="cat-btn" data-cat="materials">🪵 建造材料</button>
        </div>

        <div class="shop-grid" id="shopGrid">
            <!-- 商品渲染区 -->
        </div>
    </div>

    <!-- 引入独立的逻辑模块 -->
    <script type="module" src="index.js"></script>
</body>
</html>
