<!-- log.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小店日记</title>
    <style>
        body { background: #fffaf0; padding: 12px 16px; margin: 0; font-family: sans-serif; color: #666; font-size: 14px; }
        .log-title { color: #ff6b81; font-weight: bold; font-size: 15px; margin-bottom: 8px; border-bottom: 1px solid #ffe4e1; padding-bottom: 6px; }
        .log-list { height: calc(100% - 30px); overflow-y: auto; }
    </style>
</head>
<body>
    <div class="log-title">📜 小店日记</div>
    <div class="log-list" id="logList"></div>

    <script>
    (() => {
        'use strict';

        const SAVE_KEY = 'cakeShopSave_v1';
        const logList = document.getElementById('logList');

        // ⭐ 提到最外层，确保 renderLogs 和 renderLogList 都能访问到
        const getCake = () => window.parent.Cake || null;

        /* ==================== 渲染日志 ==================== */

        const renderEmpty = () => {
            logList.innerHTML = '<div style="text-align:center; color:#aaa; margin-top:20px;">暂无记录，快去创造故事吧～</div>';
        };

        const renderLogs = (logs) => {
            const Cake = getCake();
            const escapeHtml = Cake?.escapeHtml ?? ((s) => String(s ?? ''));

            logList.innerHTML = logs
                .slice()
                .reverse()
                .map((l) => `<div style="margin-bottom:8px; line-height:1.5;">📝 第${l.day}天：${escapeHtml(l.text)}</div>`)
                .join('');
        };

        const renderLogList = () => {
            const Cake = getCake();
            if (!Cake) return;

            const logs = Cake.store?.state?.log ?? [];
            logs.length === 0 ? renderEmpty() : renderLogs(logs);
        };

        /* ==================== 生命周期 ==================== */

        window.addEventListener('load', renderLogList);

        window.addEventListener('storage', (e) => {
            if (e.key && e.key !== SAVE_KEY) return;
            if (e.storageArea && e.storageArea !== window.localStorage) return;
            requestAnimationFrame(renderLogList);
        });
    })();
    </script>
</body>
</html>
