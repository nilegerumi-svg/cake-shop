<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 配方图鉴 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .tab-btn {
            background: #fff; border: 1px solid var(--pink-200); color: var(--pink-600);
            padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--pink-400); color: #fff; border-color: var(--pink-400); }
        
        .group-title {
            margin: 20px 0 10px 0; font-size: 15px; color: var(--pink-600); 
            border-left: 4px solid var(--pink-400); padding-left: 8px;
            display: flex; align-items: center; gap: 6px;
        }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <!-- 一级分类：烘焙 vs 料理 -->
        <div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
            <button class="tab-btn active" id="tab-bakery" onclick="switchTab('bakery')">🍰 烘焙体系</button>
            <button class="tab-btn" id="tab-cook" onclick="switchTab('cook')">🥢 料理体系</button>
        </div>

        <!-- 内容渲染区 -->
        <div class="content" id="content"></div>
    </div>

    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;

        let currentTab = 'bakery'; 

        // 定义分类映射（用于给二级分类起个好听的中文名）
        const SIZE_NAMES = { small: '小尺寸 / 单客', medium: '中尺寸 / 分享', large: '大尺寸 / 庆典' };
        const CUISINE_NAMES = { home: '家常菜', sichuan: '川菜', cantonese: '粤菜', shandong: '鲁菜' };

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('tab-bakery').classList.toggle('active', tab === 'bakery');
            document.getElementById('tab-cook').classList.toggle('active', tab === 'cook');
            renderRecipes();
        };

        const renderRecipes = () => {
            const state = Cake.store.state;
            const contentEl = document.getElementById('content');

            // 1. 过滤出当前体系（烘焙/料理）的所有配方
            const allRecipes = Object.entries(Cake.RECIPES);
            const filtered = allRecipes.filter(([key, r]) => r.skill === currentTab);

            if (filtered.length === 0) {
                contentEl.innerHTML = `<div class="muted text-center" style="margin-top: 30px;">暂时没有该类别的配方哦</div>`;
                return;
            }

            // 2. 按尺寸或菜系进行二级分类 (拟态框架)
            const grouped = {};
            filtered.forEach(([key, r]) => {
                // 烘焙用 size，料理用 cuisine
                const groupKey = currentTab === 'bakery' ? (r.size || 'other') : (r.cuisine || 'other');
                if (!grouped[groupKey]) grouped[groupKey] = [];
                grouped[groupKey].push([key, r]);
            });

            // 3. 渲染 HTML
            let html = '';

            // 按照预设的顺序遍历分类（比如先渲染 small，再 medium）
            const order = currentTab === 'bakery' ? ['small', 'medium', 'large'] : Object.keys(CUISINE_NAMES);

            order.forEach(groupKey => {
                const groupItems = grouped[groupKey];
                if (!groupItems || groupItems.length === 0) return; // 如果没有这个分类的配方就跳过

                const groupName = currentTab === 'bakery' ? (SIZE_NAMES[groupKey] || groupKey) : (CUISINE_NAMES[groupKey] || groupKey);
                html += `<div class="group-title">📌 ${groupName}</div>`;
                html += `<div class="grid-2">`;

                // 渲染这个分类下的配方
                groupItems.forEach(([recipeKey, recipe]) => {
                    const isUnlocked = !!state.unlockedRecipes[recipeKey];
                    const ingHtml = Cake.ingredientTags ? Cake.ingredientTags(recipe.ing) : '';
                    const costMoney = 50;
                    const canResearch = !isUnlocked && state.money >= costMoney && state.energy >= 15;

                    html += `
                        <div class="item-card" style="${isUnlocked ? 'border-color: var(--pink-300); background: #fffafb;' : ''}">
                            <span class="item-emoji">${recipe.emoji || (currentTab === 'bakery' ? '🍰' : '🍲')}</span>
                            <span class="item-name">${recipe.name || recipeKey}</span>
                            <span class="item-desc" style="color:var(--text-muted); font-size:12px; margin: 4px 0;">
                                ⚡ ${recipe.energy}
                            </span>
                            
                            <div class="ing-row">
                                ${ingHtml}
                            </div>

                            <div style="margin-top: 15px; width: 100%;">
                                ${isUnlocked 
                                    ? `<span class="ing-tag ok" style="width: 100%; justify-content: center;">✅ 已掌握</span>` 
                                    : `<button type="button" class="small gold" style="width: 100%;" 
                                            ${canResearch ? `onclick="doResearch('${recipeKey}')"` : 'disabled'}
                                       >
                                            ${canResearch ? `🔬 研发 (💰${costMoney} ⚡15)` : '❌ 资源不足'}
                                       </button>`
                                }
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });

            contentEl.innerHTML = html;
        };

        window.doResearch = (recipeKey) => {
            const res = Cake.researchRecipe(recipeKey);
            if (res && res.success === false) {
                alert(res.message);
            } else {
                renderRecipes();
            }
        };

        if (typeof Cake.initPage === 'function') {
            Cake.initPage('recipe', () => {
                renderRecipes();
            }, false);
        }
    </script>
</body>
</html>
