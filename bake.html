<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 烘焙 · 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="header"></header>
    <nav id="navBar"></nav>
    <div class="game-body">
        <div class="content" id="content"></div>
    </div>
    <div class="action-footer" id="footer"></div>

    <script src="js/core/store.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>
<script src="js/shared.js"></script>
    <script>
        Game.initPage('bake', renderBake);

        function renderBake() {
            const s = Game.state;
            const unlocked = Object.keys(s.recipes).filter(n => Game.RECIPES[n]);
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>🎂 烘焙蛋糕</h2>
                    <p class="muted">每次烘焙消耗 <b>20</b> 精力。点击烘焙制作 1 个蛋糕用于售卖或送礼。</p>
                    <div class="grid-2" style="margin-top:12px;">
                        ${unlocked.length === 0
                            ? '<p class="muted">还没有解锁任何配方，先去「配方」页研发吧！</p>'
                            : unlocked.map(name => {
                                const r = Game.RECIPES[name];
                                const lackIng = !Object.keys(r.ing).every(k => (s.ingredients[k] || 0) >= r.ing[k]);
                                const lackEnergy = s.energy < 20;
                                const canBake = !lackIng && !lackEnergy;

                                const maxByEnergy = Math.floor(s.energy / 20);
                                const maxByIng = Math.min(
                                    ...Object.keys(r.ing).map(k => Math.floor((s.ingredients[k] || 0) / r.ing[k]))
                                );
                                const batchCount = Math.min(5, maxByEnergy, maxByIng);
                                const canBatch = batchCount >= 2;

                                let label;
                                if (canBake) label = '🔥 烘焙';
                                else if (lackEnergy && lackIng) label = '⚡🌾 精力与食材不足';
                                else if (lackEnergy) label = '⚡ 精力不足';
                                else label = '🌾 食材不足';

                                const stock = s.cakes[name] || 0;
                                return `
                                <div class="item-card">
                                    <span class="item-emoji">${r.emoji}</span>
                                    <span class="item-name">${name} <span class="muted">（库存 ${stock}）</span></span>
                                    <span class="item-desc">${r.desc}</span>
                                    <div class="ing-row">${Game.ingredientTags(r.ing)}</div>
                                    <span class="item-meta">基础价 ${r.price}元 · 声望+${r.rep}</span>
                                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                        <button type="button" class="small" ${canBake ? '' : 'disabled'} onclick="Game.bakeCake('${name}')">${label}</button>
                                        ${canBatch ? `<button type="button" class="small secondary" onclick="Game.bakeCake('${name}', ${batchCount})">🔥 批量×${batchCount}</button>` : ''}
                                    </div>
                                </div>`;
                            }).join('')}
                    </div>

                    <h3>📦 当前食材</h3>
                    <div class="ing-row">
                        ${Object.entries(Game.INGREDIENTS).map(([k, v]) => {
                            const cnt = s.ingredients[k] || 0;
                            return `<span class="ing-tag ${cnt > 0 ? 'ok' : 'lack'}">${v.emoji}${v.name} ×${cnt}</span>`;
                        }).join('')}
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
