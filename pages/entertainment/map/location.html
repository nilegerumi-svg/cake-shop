<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>地点</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <style>
        body { background: transparent; font-family: sans-serif; padding: 16px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); width: 100%; max-width: 400px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed #ffd1dc; padding-bottom: 12px; }
        .header h2 { color: #ff6b81; margin: 0; font-size: 18px; }
        .back-btn { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; padding: 4px 8px; font-weight: bold; }
        .back-btn:active { color: #ff6b81; }

        .energy-badge { background: #fff9fa; padding: 4px 10px; border-radius: 20px; font-size: 13px; border: 1px solid #ffd1dc; font-weight: bold; }

        .loc-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .loc-emoji { font-size: 40px; }
        .loc-meta { display: flex; flex-direction: column; text-align: left; }
        .loc-name { font-size: 20px; font-weight: bold; color: #4a3b3f; }
        .loc-desc { font-size: 13px; color: #888; margin-top: 4px; line-height: 1.5; }

        .section-title { color: #d85c74; font-size: 14px; font-weight: bold; margin: 16px 0 10px; text-align: left; border-left: 4px solid #ffb6c1; padding-left: 8px; }

        .action-list { display: flex; flex-direction: column; gap: 10px; }
        .action-item {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: #f0faf8; color: #4a3b3f; border: 1px solid #a8e6cf;
            padding: 14px 16px; border-radius: 12px; font-size: 15px; font-weight: bold;
            cursor: pointer; transition: transform 0.1s; text-align: left; box-sizing: border-box;
        }
        .action-item:active { transform: scale(0.98); background: #e0f5f0; }
        .action-item.rest { background: #fff0f5; border-color: #ffb6c1; }
        .action-item.rest:active { background: #ffe4e8; }
        .action-item.disabled { background: #f5f5f5; border-color: #ddd; color: #aaa; cursor: not-allowed; }

        .action-info { display: flex; align-items: center; gap: 12px; }
        .action-emoji { font-size: 24px; }
        .action-text { display: flex; flex-direction: column; text-align: left; }
        .action-name { font-size: 15px; font-weight: bold; }
        .action-desc { font-size: 12px; color: #888; font-weight: normal; margin-top: 2px; }
        .action-arrow { font-size: 13px; color: #ffb6c1; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <button class="back-btn" id="btnBack" type="button">◀ 返回</button>
            <h2 id="locTitle">📍 地点</h2>
            <div class="energy-badge">⚡<span id="energy">--</span></div>
        </div>

        <div class="loc-head" id="locHead"></div>
        <div class="section-title">🎬 可进行的活动</div>
        <div class="action-list" id="actionList">
            <!-- 动态生成的动作按钮 -->
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        const params = new URLSearchParams(location.search);
        const REGION_ID = params.get('region') || 'town';
        const LOC_KEY   = params.get('loc') || 'home';

        const $ = (id) => document.getElementById(id);
        const locTitleEl   = $('locTitle');
        const locHeadEl    = $('locHead');
        const actionListEl = $('actionList');
        const energyEl     = $('energy');

        let Cake = null;
        let tries = 0;
        const MAX_TRIES = 100;      // 100 × 100ms = 10s
        const REFRESH_DELAY = 200;

        const num = (v, fallback = 0) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        const getCake = () => {
            try {
                if (window.parent && window.parent !== window && window.parent.Cake) {
                    return window.parent.Cake;
                }
            } catch (_) { /* 跨域 */ }
            return window.Cake || null;
        };

        const navigateTo = (fullPath, relativeFallback) => {
            try {
                if (window.parent && window.parent !== window &&
                    window.parent.HostRouter &&
                    typeof window.parent.HostRouter.navigateTo === 'function') {
                    window.parent.HostRouter.navigateTo(fullPath);
                    return;
                }
            } catch (_) { /* 跨域或未定义 */ }
            window.location.href = relativeFallback || fullPath;
        };

        /* ==================== 返回城镇 ==================== */

        const goBack = () => {
            navigateTo(
                `pages/entertainment/map/${REGION_ID}.html`,
                `${REGION_ID}.html`
            );
        };

        /* ==================== 渲染 ==================== */

        const renderAll = () => {
            try {
                const state = Cake && Cake.store && Cake.store.state;
                if (!state) throw new Error('无法读取当前游戏状态');

                const energy = Math.max(0, Math.min(100, num(state.energy, 0)));
                if (energyEl) energyEl.innerText = energy;

                // 地点基础信息
                const regionLocs = (typeof Cake.getRegionLocations === 'function')
                    ? Cake.getRegionLocations(REGION_ID)
                    : null;
                const locCfg = (regionLocs && regionLocs[LOC_KEY])
                    || (Cake.LOCATIONS && Cake.LOCATIONS[LOC_KEY]);

                if (!locCfg) throw new Error(`未知地点：${LOC_KEY}`);

                if (locTitleEl) locTitleEl.textContent = `${locCfg.emoji || '📍'} ${locCfg.name || LOC_KEY}`;
                if (locHeadEl) {
                    locHeadEl.innerHTML = `
                        <span class="loc-emoji">${locCfg.emoji || '📍'}</span>
                        <div class="loc-meta">
                            <span class="loc-name">${locCfg.name || LOC_KEY}</span>
                            <span class="loc-desc">${locCfg.desc || '未知的区域'}</span>
                        </div>
                    `;
                }

                // 动作列表
                const actions = (typeof Cake.getLocationActions === 'function')
                    ? Cake.getLocationActions(REGION_ID, LOC_KEY)
                    : [];

                let html = '';
                for (const a of actions) {
                    let disabled = false;
                    let arrow = '▶';

                    if (a.key === 'walk') {
                        disabled = energy < num(a.energyCost, 0);
                        arrow = disabled ? '精力不足' : '▶';
                    } else if (a.key === 'nap') {
                        disabled = energy >= 100;
                        arrow = disabled ? '精力已满' : '▶';
                    }
                    // sleep 无限制

                    const restCls = (a.key === 'nap' || a.key === 'sleep') ? 'rest' : '';
                    html += `
                        <button class="action-item ${restCls} ${disabled ? 'disabled' : ''}"
                                data-action="${a.key}" ${disabled ? 'disabled' : ''}>
                            <div class="action-info">
                                <span class="action-emoji">${a.emoji}</span>
                                <div class="action-text">
                                    <span class="action-name">${a.name}</span>
                                    <span class="action-desc">${a.desc}</span>
                                </div>
                            </div>
                            <span class="action-arrow">${arrow}</span>
                        </button>
                    `;
                }

                if (html === '') {
                    html = '<div style="color:#888; text-align:center;">这里暂时没有可进行的活动...</div>';
                }
                actionListEl.innerHTML = html;

            } catch (err) {
                actionListEl.innerHTML = `
                    <div style="color: red; padding: 15px; background: #ffe4e1; border-radius: 10px;">
                        <strong>⚠️ 渲染失败：</strong><br>${err.message || err}
                    </div>`;
            }
        };

        /* ==================== 事件绑定 ==================== */

        const bindClick = () => {
            const btnBack = $('btnBack');
            if (btnBack && !btnBack.dataset.bound) {
                btnBack.dataset.bound = 'true';
                btnBack.addEventListener('click', goBack);
            }

            if (actionListEl && !actionListEl.dataset.bound) {
                actionListEl.dataset.bound = 'true';
                actionListEl.addEventListener('click', (e) => {
                    const btn = e.target.closest('.action-item');
                    if (!btn || btn.disabled) return;

                    const engine = Cake || getCake();
                    if (!engine || !engine.store || !engine.store.state) return;

                    const actionKey = btn.dataset.action;

                    try {
                        if (typeof engine.performLocationAction === 'function') {
                            engine.performLocationAction(REGION_ID, LOC_KEY, actionKey);
                        } else {
                            alert('❌ 动作系统未就绪（performLocationAction）');
                            return;
                        }
                    } catch (err) {
                        console.error('[location] 动作执行失败:', err);
                        alert('❌ 动作执行失败：' + (err && err.message || err));
                        return;
                    }

                    // 动作会改变精力/时间，稍后重绘本页
                    setTimeout(renderAll, REFRESH_DELAY);
                });
            }
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            const engine = getCake();

            if (engine && engine.store && engine.store.state) {
                Cake = engine;
                window.Cake = engine;
                bindClick();
                renderAll();
                return;
            }

            if (++tries >= MAX_TRIES) {
                if (actionListEl) {
                    actionListEl.innerHTML = `
                        <div style="color: red; padding: 15px; background: #ffe4e1; border-radius: 10px;">
                            <strong>⚠️ 无法连接游戏引擎：</strong><br>父页面 Cake 未就绪，请刷新重试。
                        </div>`;
                }
                return;
            }

            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
