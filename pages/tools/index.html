<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ 工具库 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .tool-card {
            display: flex; align-items: center; gap: 15px;
            background: #fff; padding: 15px; border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 10px;
        }
        .tool-icon { font-size: 36px; }
        .tool-info { flex: 1; }
        .tool-name { font-weight: bold; font-size: 16px; color: var(--pink-600); }
        .tool-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .prof-bar { width: 100%; height: 6px; background: #ffe4e1; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .prof-fill { height: 100%; background: var(--pink-400); border-radius: 4px; transition: width 0.3s; }
        .tech-tag {
            display: inline-block; font-size: 11px; padding: 2px 8px; 
            background: #f0f0f0; border-radius: 10px; margin-left: 6px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="card" style="padding: 15px; margin-bottom: 15px;">
            <h2 style="margin: 0;">🛠️ 我的工具库</h2>
            <p class="muted" style="margin-top: 5px; font-size: 12px;">工具熟练度越高，制作高难度食物时成功率与品质越高。</p>
        </div>

        <div id="tools-container">
            <!-- 工具卡片渲染区 -->
        </div>
    </div>

    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;

        const renderTools = () => {
            const state = Cake.store.state;
            const container = document.getElementById('tools-container');
            const ownedTools = Object.keys(state.tools).filter(id => state.tools[id].owned);

            if (ownedTools.length === 0) {
                container.innerHTML = '<div class="muted text-center" style="margin-top:50px;">你还没有任何工具，去采购中心或地图商店看看吧！</div>';
                return;
            }

            container.innerHTML = ownedTools.map(id => {
                const t = state.tools[id];
                const data = Cake.TOOLS[id] || { name: id, emoji: '❓', tech: null, cat: 'unknown' };
                
                // 计算熟练度进度条（假设满级 10 级）
                const profPct = Math.min(100, Math.round(((t.lv || 1) / 10) * 100));
                
                // 技法标签
                const techTag = data.tech ? `<span class="tech-tag">技法: ${data.tech}</span>` : '';

                return `
                    <div class="tool-card">
                        <div class="tool-icon">${data.emoji}</div>
                        <div class="tool-info">
                            <div class="tool-name">
                                ${data.name} ${techTag}
                            </div>
                            <div class="tool-meta">
                                熟练度 Lv.${t.lv || 1} · 经验 ${t.exp || 0}
                            </div>
                            <div class="prof-bar">
                                <div class="prof-fill" style="width: ${profPct}%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        if (typeof Cake.initPage === 'function') {
            // 挂载在 profile 标签下
            Cake.initPage('profile', renderTools, false);
        }
    </script>
</body>
</html>
