<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { background: transparent; padding: 16px; margin: 0; min-height: 100vh; box-sizing: border-box; display: block !important; }
        .loading-text { text-align: center; color: #888; margin-top: 50px; }
        .error-text { text-align: center; color: red; margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="content">
        <h2 class="loading-text">⏳ 正在连接引擎...</h2>
    </div>

    <script>
    (() => {
        'use strict';
        
        let retryCount = 0;

        const render = () => {
            // 实时去父页面找 Game
            const G = window.parent.Game || window.Game;
            const contentEl = document.getElementById('content');

            // 🚨 如果父页面没准备好，等 100 毫秒重试，最多等 3 秒（30次）
            if (!G || !G.state) {
                retryCount++;
                if (retryCount > 30) {
                    contentEl.innerHTML = '<h2 class="error-text">❌ 引擎加载超时！<br>请检查 main.js 或 host 目录是否报错。</h2>';
                    return;
                }
                setTimeout(render, 100);
                return;
            }

            // ✅ 引擎准备好了，直接开始画界面
            try {
                const s = G.state;
                const cakesObj = s.cakes || {};
                const recipesObj = G.RECIPES || {};
                const cakes = Object.entries(cakesObj).filter(([name, count]) => count > 0 && recipesObj[name]);

                let cakesHtml = '<p class="muted">还没有蛋糕库存，快去「烘焙」页面做几个吧！</p>';
                if (cakes.length > 0) {
                    cakesHtml = '<div class="grid-2">' + cakes.map(([name, count]) => {
                        const recipe = recipesObj[name] || { emoji: '🍰', price: 50 };
                        const price = Math.round(recipe.price * (s.priceRate || 1));
                        return `<div class="item-card">
                            <span class="item-emoji">${recipe.emoji}</span>
                            <span class="item-name">${name} <span class="muted">×${count}</span></span>
                            <span class="item-meta">售价 <span class="price-tag">${price}元</span></span>
                        </div>`;
                    }).join('') + '</div>';
                }

                contentEl.innerHTML = `
                    <div class="card">
                        <h2>🏠 欢迎回来，${G.escapeHtml(s.playerName || '店长')}！</h2>
                        <p class="muted">今天是经营的第 <b>${s.day || 1}</b> 天，你的「${G.escapeHtml(s.shopName || '甜蜜小屋')}」正散发着甜蜜香气～</p>
                        <div class="grid-2" style="margin-top:12px;">
                            <div class="item-card"><span class="item-emoji">💰</span><span class="item-name">${s.money || 500} 元</span><span class="item-desc">当前余额</span></div>
                            <div class="item-card"><span class="item-emoji">⭐</span><span class="item-name">${s.reputation || 0} 声望</span><span class="item-desc">店铺名气</span></div>
                            <div class="item-card"><span class="item-emoji">🏪</span><span class="item-name">Lv.${s.shopLevel || 1} · 装饰${s.decoration || 0}</span><span class="item-desc">店铺等级与装饰度</span></div>
                            <div class="item-card"><span class="item-emoji">⚡</span><span class="item-name">${s.energy || 80}/100</span><span class="item-desc">今日剩余精力</span></div>
                        </div>
                        <h3>⚡ 快速行动</h3>
                        <div class="char-actions">
                           <button type="button" class="small" data-action="nap" ${s.energy >= 100 ? 'disabled' : ''}>😴 家里小憩</button>
                           <button type="button" class="small" data-action="sleep">🛌 睡觉</button>
                           <a href="pages/entertainment/map.html" class="small secondary" style="text-decoration:none; text-align:center;">🚶‍♀️ 散步</a>
                        </div>
                        <h3>🧁 库存蛋糕</h3>
                        ${cakesHtml}
                    </div>
                `;

                // 绑定按钮事件
                contentEl.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-action]');
                    if (!btn) return;
                    
                    const action = btn.dataset.action;
                    if (action === 'nap') {
                        if (s.energy >= 100) return; 
                        G.rest(); 
                    }
                    if (action === 'sleep') {
                        G.sleep();
                    }
                }, { once: true }); // 只绑定一次

            } catch (err) {
                contentEl.innerHTML = `<h2 class="error-text">❌ 渲染异常：${err.message}</h2>`;
            }
        };

        // 启动渲染
        render();
    })();
    </script>
</body>
</html>
