<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 食材图鉴 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--pink-600); cursor: pointer; font-weight: bold; }

        /* 食材图鉴：多列卡片网格（2 列 / 3 列自适应），展示已持有的食材 */
        .atlas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        @media (min-width: 420px) {
            .atlas-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }

        .atlas-card {
            background: #fff;
            border: 1px solid var(--pink-100);
            border-radius: var(--radius-item, 12px);
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 4px;
        }
        .atlas-card .atlas-emoji { font-size: 26px; }
        .atlas-card .atlas-name { font-weight: bold; font-size: 13px; color: var(--text-main); }
        .atlas-card .atlas-meta { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
        .atlas-card .atlas-meta strong { color: var(--pink-600); }

        /* 变质徽标（色弱友好：带文字+图标，不单靠颜色） */
        .spoil-badge {
            display: inline-block; margin-top: 6px;
            padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: bold; line-height: 1.6;
        }
        .spoil-badge.warning { background: #fff8e1; color: #a06a00; border: 1px solid #ffe082; }
        .spoil-badge.spoiled { background: #fff0f0; color: #c62828; border: 1px solid #ffcdd2; }
        .spoil-badge.rotten  { background: #f5f5f5; color: #616161; border: 1px solid #e0e0e0; }

        .empty-atlas { text-align: center; color: var(--text-muted); padding: 30px 12px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <button type="button" class="back-btn" id="backBtn">← 返回个人中心</button>
        <div class="content" id="content"></div>
    </div>

    <!-- 引擎等待器（与配方页/采购页一致） -->
    <script src="../boot-safe.js"></script>
    <script type="module">
        // 引擎由父页面异步注入，不能在此同步取用
        let Cake = null;

        // 返回按钮不依赖引擎，先绑定，避免页面成为死胡同
        document.getElementById('backBtn').addEventListener('click', () => history.back());

        const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        const render = () => {
            const state = Cake.store.state;
            const contentEl = document.getElementById('content');

            // 只统计已持有的食材（去重汇总）
            const inv = state.inventory || [];
            if (inv.length === 0) {
                contentEl.innerHTML = '<div class="card"><h2>📖 食材图鉴</h2><div class="empty-atlas">图鉴空空如也，先去采购中心或商店添置食材吧！</div></div>';
                return;
            }

            // 按 id 汇总：数量、变质数量、最短剩余、最低品质
            const summary = {};
            inv.forEach(item => {
                if (!summary[item.id]) {
                    summary[item.id] = {
                        count: 0, rotten: 0, spoiled: 0, warning: 0,
                        minRemain: Infinity, minQuality: Infinity,
                        data: Cake.INGREDIENTS[item.id] || { name: item.id, emoji: '❓', price: 0 }
                    };
                }
                const g = summary[item.id];
                g.count++;
                if (item.isRotten) g.rotten++;

                const spoil = (typeof Cake.getItemSpoilage === 'function') ? Cake.getItemSpoilage(item) : null;
                if (spoil) {
                    if (spoil === Cake.SPOILAGE_STATES.spoiled) g.spoiled++;
                    else if (spoil === Cake.SPOILAGE_STATES.warning) g.warning++;
                }

                const remain = Number(item.expireDay) - Number(state.time.day);
                if (remain < g.minRemain) g.minRemain = remain;
                const q = Number(item.quality) || 0;
                if (q < g.minQuality) g.minQuality = q;
            });

            const cards = Object.values(summary).map(item => {
                const isRotten = item.rotten > 0;

                // 变质徽标：优先展示最严重的状态（文字 + 图标，色弱可辨）
                let badge = '';
                if (isRotten) badge = `<span class="spoil-badge rotten">☠️ 腐烂 ${item.rotten}</span>`;
                else if (item.spoiled > 0) badge = `<span class="spoil-badge spoiled">🤢 变质 ${item.spoiled}</span>`;
                else if (item.warning > 0) badge = `<span class="spoil-badge warning">⚠️ 临期 ${item.warning}</span>`;

                const remain = item.minRemain === Infinity ? '—' : Math.max(0, item.minRemain);
                const quality = item.minQuality === Infinity ? '—' : item.minQuality;

                return `
                    <div class="atlas-card" style="${isRotten ? 'border-color: var(--red-line); background: #fff0f0;' : ''}">
                        <span class="atlas-emoji">${item.data.emoji || '📦'}</span>
                        <span class="atlas-name">${esc(item.data.name || item.id)}</span>
                        <span class="atlas-meta">库存 <strong>${item.count}</strong> 份</span>
                        <span class="atlas-meta">剩余 <strong>${remain}</strong> 天</span>
                        <span class="atlas-meta">品质 <strong>${quality}</strong></span>
                        ${badge}
                    </div>
                `;
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <h2>📖 食材图鉴</h2>
                    <p class="muted" style="margin-bottom: 15px;">仅收录当前已持有的食材。食材会随时间逐级变质：临期 → 变质 → 腐烂，请尽快使用。</p>
                    <div class="atlas-grid">${cards}</div>
                </div>
            `;
        };

        const start = () => {
            if (typeof Cake.initPage === 'function') {
                Cake.initPage('profile', render, false);
            } else {
                render();
            }
        };

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                start();
            }, {
                timeout: 15000,
                // 需等食材数据到位，否则食材名会显示成原始 id
                required: (game) => !!(game && game.store && game.store.state && game.INGREDIENTS),
                onTimeout: () => '食材图鉴：游戏引擎或食材数据加载超时，请刷新页面重试。'
            });
        } else {
            Cake = window.parent.Cake || window.Cake;
            if (Cake && Cake.store && Cake.store.state) start();
        }
    </script>
</body>
</html>
