<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏅 成就殿堂 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .achievement-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .ach-card {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 15px; border-radius: 12px;
            background: #fff; border: 1px solid var(--pink-100);
            opacity: 0.7; transition: all 0.3s ease;
        }
        .ach-card.earned {
            background: #fffde7; border-color: #ffd54f; opacity: 1;
            box-shadow: 0 4px 10px rgba(255, 213, 79, 0.2);
        }
        .ach-icon { font-size: 28px; width: 40px; text-align: center; }
        .ach-info { flex: 1; }
        .ach-name { font-weight: bold; font-size: 15px; color: var(--text-main); }
        .ach-desc { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>

    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;

        const renderAchievements = () => {
            const state = Cake.store.state;
            const allAchs = Cake.ACHIEVEMENTS || [];
            const contentEl = document.getElementById('content');

            if (allAchs.length === 0) {
                contentEl.innerHTML = '<div class="muted text-center">暂无成就数据...</div>';
                return;
            }

            // 计算总进度
            const earnedCount = allAchs.filter(a => state.achievements && state.achievements[a.id]).length;
            const pct = Math.round((earnedCount / allAchs.length) * 100);

            // 渲染卡片
            const cards = allAchs.map(a => {
                const earned = Boolean(state.achievements && state.achievements[a.id]);
                return `
                    <div class="ach-card ${earned ? 'earned' : ''}">
                        <div class="ach-icon">${earned ? (a.icon || '🏅') : '🔒'}</div>
                        <div class="ach-info">
                            <div class="ach-name">${a.name || a.id}</div>
                            <div class="ach-desc">${a.desc || '完成特定条件解锁'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <h2 style="margin:0;">🏅 成就殿堂</h2>
                        <span style="font-weight:bold; color:var(--pink-600);">${earnedCount}/${allAchs.length} (${pct}%)</span>
                    </div>
                    <div class="aff-bar" style="height:8px;">
                        <div class="aff-fill" style="width:${pct}%;"></div>
                    </div>
                    <div class="achievement-grid">
                        ${cards}
                    </div>
                </div>
            `;
        };

        if (typeof Cake.initPage === 'function') {
            // 如果有自己的专属 Tab key 可以传，没有就传个空
            Cake.initPage('achievements', renderAchievements, false);
        }
    </script>
</body>
</html>
