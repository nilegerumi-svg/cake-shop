<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 店铺 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div id="shop-error" style="display:none; background:#dc2626; color:#fff; padding:10px; font-size:12px; margin-bottom:10px; word-break:break-all;"></div>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script src="../js/core/store.js"></script>
    <script src="../js/data/ingredients.js"></script>
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/bundles.js"></script>
    <script src="../js/data/characters.js"></script>
    <script src="../js/data/events.js"></script>
    <script src="../js/data/shop-config.js"></script>
    <script src="../js/data/achievements.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/modal.js"></script>
    <script src="../js/core/effects.js"></script>
    <script src="../js/core/render.js"></script>
    <script src="../js/actions/bakery.js"></script>
    <script src="../js/actions/shop.js"></script>
    <script src="../js/actions/social.js"></script>
    <script src="../js/actions/system.js"></script>
    <script src="../js/shared.js"></script>
    <script>
    (() => {
        'use strict';

        const PRICE_OPTIONS = Object.freeze([
            { rate: 0.8, name: '亲民价' },
            { rate: 0.9, name: '实惠价' },
            { rate: 1.0, name: '标准价' },
            { rate: 1.2, name: '精品价' },
            { rate: 1.5, name: '奢华价' },
        ]);

        const contentEl = document.getElementById('content');
        const shopErrorEl = document.getElementById('shop-error');

        let Game = null;
        let tries = 0;
        const MAX_TRIES = 100;

        const num = (v, fallback = 0) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        const showError = (msg) => {
            if (!shopErrorEl) return;
            shopErrorEl.style.display = 'block';
            shopErrorEl.insertAdjacentHTML('beforeend', `<div>❌ ${msg}</div>`);
        };

        window.addEventListener('error', (e) => {
            showError(`店铺页报错: ${e.message || '未知错误'}`);
        });

        /* ==================== 标签 ==================== */

        const buildUpgradeLabel = (s, atMaxLevel, canUpgrade, upgradeCost) => {
            if (atMaxLevel) return '🌟 已达到最高等级！';
            if (canUpgrade) return `⬆️ 升级店铺（${upgradeCost}元）`;
            return num(s.money, 0) < upgradeCost ? `💸 需${upgradeCost}元` : '⚡ 精力不足';
        };

        const buildDecorateLabel = (s, canDecorate) => {
            if (canDecorate) return '🌸 装饰店铺（100元）';
            return num(s.money, 0) < 100 ? '💸 需100元' : '⚡ 精力不足';
        };

        /* ==================== 渲染 ==================== */

        const renderCakes = (cakes, priceRate) => {
            if (cakes.length === 0) {
                return '<p class="muted">还没有蛋糕库存，快去烘焙吧！</p>';
            }
            const items = cakes.map(([name, count]) => {
                const recipe = Game.RECIPES[name] || { emoji: '🍰', price: 50 };
                const price = Math.round(num(recipe.price, 50) * priceRate);
                return `<div class="item-card">
                    <span class="item-emoji">${recipe.emoji}</span>
                    <span class="item-name">${name} <span class="muted">×${count}</span></span>
                    <span class="item-meta">售价 <span class="price-tag">${price}元</span></span>
                </div>`;
            }).join('');

            return `<div class="grid-2">${items}</div>`;
        };

        const renderShop = () => {
            const s = Game.state || {};
            const cakesObj = s.cakes || {};
            const recipes = Game.RECIPES || {};
            const priceRate = num(s.priceRate, 1) || 1;

            const cakes = Object.entries(cakesObj)
                .filter(([name, count]) => count > 0 && recipes[name]);

            const shopLevel = num(s.shopLevel, 1);
            const money = num(s.money, 0);
            const energy = num(s.energy, 0);

            const atMaxLevel = shopLevel >= 5;
            const upgradeCosts = Game.SHOP_UPGRADE_COSTS || {};
            const upgradeCost = atMaxLevel ? 0 : num(upgradeCosts[shopLevel], 0);
            const canUpgrade = !atMaxLevel && money >= upgradeCost && energy >= 5;
            const canDecorate = money >= 100 && energy >= 5;

            const upgradeLabel = buildUpgradeLabel(s, atMaxLevel, canUpgrade, upgradeCost);
            const decorateLabel = buildDecorateLabel(s, canDecorate);

            const upgradeBtnHtml = atMaxLevel
                ? `<span class="item-meta">${upgradeLabel}</span>`
                : `<button type="button" class="small" ${canUpgrade ? '' : 'disabled'} onclick="Game.upgradeShop()">${upgradeLabel}</button>`;

            const priceButtons = PRICE_OPTIONS.map(({ rate, name }) => {
                const active = priceRate === rate ? 'gold' : 'secondary';
                return `<button type="button" class="small ${active}" onclick="Game.setPriceRate(${rate})">${name} ${rate.toFixed(1)}x</button>`;
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <h2>🏪 店铺经营</h2>
                    <div style="margin-bottom:16px;">
                        <button type="button" class="small gold" onclick="window.openShopWrapper()">🚪 开店营业</button>
                    </div>
                    <div class="grid-2">
                        <div class="item-card">
                            <span class="item-emoji">🏪</span>
                            <span class="item-name">店铺等级 Lv.${shopLevel}</span>
                            <span class="item-desc">等级越高，客流量与顾客预算越高。</span>
                            ${upgradeBtnHtml}
                        </div>
                        <div class="item-card">
                            <span class="item-emoji">🛋️</span>
                            <span class="item-name">装饰度 ${num(s.decoration, 0)}</span>
                            <span class="item-desc">每10点装饰度，每单声望+1。</span>
                            <button type="button" class="small" ${canDecorate ? '' : 'disabled'} onclick="Game.decorateShop()">${decorateLabel}</button>
                        </div>
                    </div>
                    <h3>💰 定价策略</h3>
                    <div class="ing-row" style="gap:8px;">${priceButtons}</div>
                    <p class="muted" style="margin-top:8px;">当前售价 = 基础价 × ${priceRate.toFixed(1)}</p>
                    <h3>🧁 库存蛋糕</h3>
                    ${renderCakes(cakes, priceRate)}
                </div>`;
        };

        /* ==================== 开店包装 ==================== */

        window.openShopWrapper = () => {
            try {
                if (typeof Game.openShop !== 'function') {
                    alert('错误：openShop 函数未定义！');
                    return;
                }
                Game.openShop();
            } catch (e) {
                showError(`开店报错: ${e.message}`);
            }
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            let G = null;
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    G = window.parent.Game;
                }
            } catch (_) {}
            if (!G) G = window.Game || null;

            if (G && G.state && typeof G.initPage === 'function') {
                Game = G;
                window.Game = G;    // onclick 内联属性需要
                try {
                    G.initPage('shop', renderShop);
                } catch (e) {
                    contentEl.innerHTML = `<div style="color:red; padding:20px;">页面初始化失败: ${e.message}</div>`;
                }
                return;
            }

            if (++tries >= MAX_TRIES) {
                contentEl.innerHTML = '<div style="color:red;padding:20px;text-align:center;">❌ 游戏引擎加载超时，请刷新重试</div>';
                return;
            }
            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
