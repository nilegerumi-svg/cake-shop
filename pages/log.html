<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小店日记</title>
    <style>
        body {
            background: #fffaf0; /* 淡淡的暖色区分 */
            padding: 12px 16px;
            margin: 0;
            font-family: 'PingFang SC', sans-serif;
            color: #666;
            font-size: 14px;
        }
        .log-title {
            color: #ff6b81;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
            border-bottom: 1px solid #ffe4e1;
            padding-bottom: 6px;
        }
        .log-list {
            height: calc(100% - 30px); /* 留出标题高度 */
            overflow-y: auto;
        }
        .log-item {
            margin-bottom: 8px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="log-title">📜 小店日记</div>
    <div class="log-list" id="logList"></div>

    <script>
        window.onload = function() {
            // 获取父级页面的 Game 数据
            const Game = window.parent.Game;
            if (!Game) return;

            const s = Game.state;
            let logs = s.logs || JSON.parse(localStorage.getItem('gameLogs')) || [];
            
            const logList = document.getElementById('logList');
            if (logs.length === 0) {
                logList.innerHTML = '<div style="text-align:center; color:#aaa; margin-top:20px;">暂无记录，快去创造故事吧~</div>';
            } else {
                // 倒序显示，最新的在最上面
                logList.innerHTML = logs.slice().reverse().map(log => `<div class="log-item">📝 ${log}</div>`).join('');
            }
        };
    </script>
</body>
</html>
