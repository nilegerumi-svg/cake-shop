<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>档案 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .pf-head { text-align: left; margin: 4px 0 10px; }
  .pf-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .pf-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .sub-tabs { display:flex; gap:8px; margin-bottom:10px; }
  .sub-tab { flex:1; padding:8px; background:#fffdf8; border:1px solid #f0dcc0; border-radius:12px; font-size:13px; font-weight:bold; color:#b08a6a; cursor:pointer; font-family:inherit; }
  .sub-tab.active { background:#e04a63; color:#fff; border-color:#e04a63; }
  .search { width:100%; box-sizing:border-box; padding:10px 14px; border:2px solid #f0dcc0; border-radius:12px; font-size:14px; background:#fffdf8; color:#4a2c17; margin-bottom:10px; }
  .cat-title { display:flex; align-items:center; gap:6px; color:#8a5a44; font-size:14px; font-weight:bold; margin:12px 0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .codex-item { background:#fffdf8; border:1px solid #f0dcc0; border-radius:12px; padding:10px; display:flex; align-items:center; gap:8px; }
  .codex-item .emoji { font-size:22px; }
  .codex-item .name { font-size:13px; color:#4a2c17; font-weight:bold; flex:1; }
  .codex-item .meta { font-size:11px; color:#b08a6a; }
  .codex-list { display:flex; flex-direction:column; gap:8px; }
  .codex-row { background:#fffdf8; border:1px solid #f0dcc0; border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .codex-row .emoji { font-size:22px; }
  .codex-row .body { flex:1; }
  .codex-row .name { font-size:14px; color:#4a2c17; font-weight:bold; }
  .codex-row .sub { font-size:12px; color:#b08a6a; }
  .count-pill { background:#f7ecdc; color:#8a5a44; border-radius:10px; padding:2px 8px; font-size:11px; font-weight:bold; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载图鉴...</div></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() {
    try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {}
    return window.Cake || null;
  }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const CAT_LABEL = {
    meat: '🥩 肉类·水产', vegetable: '🥬 蔬菜', grain: '🌾 谷物', seasoning: '🧂 调味',
    egg: '🥚 蛋类', fruit: '🍎 水果', dairy: '🥛 奶制品', additive: '🧪 辅料', material: '🪵 建材',
  };
  const CAT_ORDER = ['meat','vegetable','grain','seasoning','egg','fruit','dairy','additive','material'];
  let tab = 'ingredient';
  let q = '';

  function render() {
    const Cake = getCake();
    const el = document.getElementById('content');
    if (!el) return;
    if (!Cake || !Cake.INGREDIENTS || !Cake.RECIPES) return;

    const kw = q.trim().toLowerCase();
    const filter = (s) => !kw || String(s).toLowerCase().includes(kw);

    let html = `<div class="pf-head"><h2>👤 档案</h2><p class="muted">食材与食谱图鉴</p></div>`;
    html += `<div class="sub-tabs" role="tablist" aria-label="图鉴分类">
      <button type="button" class="sub-tab ${tab==='ingredient'?'active':''}" data-tab="ingredient" role="tab" aria-selected="${tab==='ingredient'}">🍎 食材（${Object.keys(Cake.INGREDIENTS).length}）</button>
      <button type="button" class="sub-tab ${tab==='recipe'?'active':''}" data-tab="recipe" role="tab" aria-selected="${tab==='recipe'}">📜 食谱（${Object.keys(Cake.RECIPES).length}）</button>
    </div>`;
    html += `<input type="search" class="search" id="search" placeholder="搜索食材/食谱…" aria-label="搜索" value="${esc(q)}">`;

    if (tab === 'ingredient') {
      const groups = {};
      for (const [id, ing] of Object.entries(Cake.INGREDIENTS)) {
        if (!filter(ing.name)) continue;
        const cat = ing.shelfCategory || 'material';
        (groups[cat] = groups[cat] || []).push([id, ing]);
      }
      for (const cat of CAT_ORDER) {
        const items = groups[cat];
        if (!items || !items.length) continue;
        items.sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'zh'));
        html += `<div class="cat-title">${CAT_LABEL[cat] || cat} <span class="count-pill">${items.length}</span></div><div class="grid">`;
        for (const [, ing] of items) {
          html += `<div class="codex-item"><span class="emoji" aria-hidden="true">${ing.emoji || '❓'}</span><span class="name">${esc(ing.name)}</span><span class="meta">¥${ing.price ?? 0}</span></div>`;
        }
        html += `</div>`;
      }
    } else {
      // 食谱：按 skill 分组
      const bakery = [], cook = [];
      for (const [id, r] of Object.entries(Cake.RECIPES)) {
        if (!filter(r.name)) continue;
        (r.skill === 'bakery' ? bakery : cook).push([id, r]);
      }
      const CUISINE = { home:'家常', sichuan:'川菜', cantonese:'粤菜', shandong:'鲁菜', huaiyang:'淮扬', hunan:'湘菜', anhui:'徽菜', fujian:'闽菜', zhejiang:'浙菜' };
      function renderGroup(title, items) {
        if (!items.length) return '';
        items.sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'zh'));
        let h = `<div class="cat-title">${title} <span class="count-pill">${items.length}</span></div><div class="codex-list">`;
        for (const [, r] of items) {
          const tag = r.skill === 'cook' ? (CUISINE[r.cuisine] || r.cuisine || '') : (r.size === 'small' ? '小' : r.size === 'large' ? '大' : '中');
          h += `<div class="codex-row"><span class="emoji" aria-hidden="true">${r.emoji || '🍽️'}</span>
            <span class="body"><span class="name">${esc(r.name)}</span><span class="sub">${esc(tag || '')}</span></span></div>`;
        }
        return h + `</div>`;
      }
      html += renderGroup('🍰 烘焙甜点', bakery);
      // 料理按菜系分组
      const cuisines = {};
      for (const [id, r] of cook) { (cuisines[r.cuisine || 'other'] = cuisines[r.cuisine || 'other'] || []).push([id, r]); }
      const order = Object.keys(cuisines).sort((a, b) => (cuisines[b].length - cuisines[a].length));
      for (const c of order) html += renderGroup('🍲 ' + (CUISINE[c] || (c === 'other' ? '其他' : c)), cuisines[c]);
    }

    el.innerHTML = html;
    const s = document.getElementById('search');
    if (s) { s.focus(); const v = s.value; s.value = ''; s.value = v; }
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; render(); }
  });
  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'search') { q = e.target.value; render(); const s = document.getElementById('search'); if (s) s.focus(); }
  });

  if (window.safePageBoot) {
    window.safePageBoot.waitForCake(() => { render(); },
      { timeout: 15000, required: g => !!(g && g.INGREDIENTS && g.RECIPES), onTimeout: () => '游戏引擎加载超时，请刷新页面' });
  } else if (getCake()) { render(); }
})();
</script>
</body>
</html>
