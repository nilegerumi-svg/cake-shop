<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        #app-loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff0f5; z-index: 99999;
            display: flex; justify-content: center; align-items: center;
            color: #d6336c; font-weight: bold; font-size: 18px;
            transition: opacity 0.3s ease;
        }
        #error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;
            background: rgba(220, 38, 38, 0.95); color: white;
            padding: 10px; font-size: 13px; line-height: 1.4;
            word-break: break-all; pointer-events: none;
            max-height: 40vh; overflow-y: auto; display: none;
        }
    </style>
</head>
<body>
    <!-- 加载遮罩 -->
    <div id="app-loading">🍰 正在准备烘焙你的甜蜜物语...</div>
    
    <!-- 错误浮层 -->
    <div id="error-overlay"></div>

    <!-- 整个游戏外壳都将由 monitor.js 生成到这里面 -->
    <div id="app-root"></div>

    <!-- 🚀 根目录超级监视器入口 -->
    <script type="module" src="monitor.js"></script>
</body>
</html>
