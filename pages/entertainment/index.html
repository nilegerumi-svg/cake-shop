<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>娱乐与外出</title>
    <!-- CSS 路径加一层 ../ -->
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        body { background: transparent; font-family: sans-serif; padding: 16px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); text-align: center; width: 100%; max-width: 340px; }
        
        .energy-box { background: #fff9fa; padding: 10px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffd1dc; font-weight: bold; }
        
        h2 { color: #ff6b81; margin: 0 0 12px 0; font-size: 16px; text-align: left; border-left: 4px solid #ffb6c1; padding-left: 8px; }

        .menu-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: #f0faf8; color: #4a3b3f; border: 1px solid #a8e6cf;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: transform 0.1s; margin-bottom: 12px;
            text-decoration: none; box-sizing: border-box;
        }
        .menu-btn:active { transform: scale(0.98); background: #e0f5f0; }
        .menu-btn.rest { background: #fff0f5; border-color: #ffb6c1; }
        .menu-btn.disabled { background: #f5f5f5; border-color: #ddd; color: #aaa; pointer-events: none; }
        
        .menu-icon { font-size: 18px; }
        .menu-sub { font-size: 12px; color: #888; font-weight: normal; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="energy-box">
            ⚡ 当前体力：<span id="energy">--</span>/100
        </div>

        <h2>🎮 休息区</h2>
        <button id="btnRest" class="menu-btn rest" type="button">
            <div style="text-align: left;">
                <div class="menu-icon">😴 休息一下</div>
                <div class="menu-sub">恢复 40 点体力</div>
            </div>
            <span style="color: #ffb6c1;">▶</span>
        </button>

        <h2 style="margin-top: 24px;">🛴 外出区</h2>
        <!-- 跳转同目录下的 map.html -->
        <a href="map.html" class="menu-btn" id="btnGoMap">
            <div style="text-align: left;">
                <div class="menu-icon">🗺️ 外出散步</div>
                <div class="menu-sub">去不同的地方邂逅不同的人和事</div>
            </div>
            <span style="color: #a8e6cf;">▶</span>
        </a>
    </div>

    <script>
    (() => {
        'use strict';
        const G = window.parent.Game || window.Game;
        const $ = (id) => document.getElementById(id);
        const energyEl = $('energy');
        const btnRest  = $('btnRest');
        const btnGoMap = $('btnGoMap');

        const updateUI = () => {
            if (!G || !G.state) return;
            energyEl.innerText = G.state.energy;
            
            if (G.state.energy >= 100) btnRest.classList.add('disabled');
            else btnRest.classList.remove('disabled');

            if (G.state.energy < 8) {
                btnGoMap.classList.add('disabled');
                btnGoMap.removeAttribute('href');
            } else {
                btnGoMap.classList.remove('disabled');
                btnGoMap.setAttribute('href', 'map.html');
            }
        };

        btnRest.addEventListener('click', () => {
            if (!G || !G.state || G.state.energy >= 100) return;
            G.rest();
            setTimeout(updateUI, 100);
        });

        window.addEventListener('load', () => {
            if (!G || !G.state) {
                $('mainCard').innerHTML = `<h2 style="color:red">⚠️ 数据加载失败</h2><p>请从主页面进入</p>`;
                return;
            }
            updateUI();
        });
    })();
    </script>
</body>
</html>
