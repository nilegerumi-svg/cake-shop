<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>娱乐与外出</title>
    <style>
        body { background: transparent; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; color: #4a3b3f; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.3); text-align: center; width: 100%; max-width: 320px; }
        h2 { color: #ff6b81; margin-top: 20px; margin-bottom: 10px; font-size: 18px; }
        .energy-box { background: #fff9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #ffd1dc; font-weight: bold; }
        button { background: #ff8fa3; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; margin-top: 10px; width: 100%; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #btnWalk { background: #7ec4cf; } 
        
        #walkModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 300px; text-align: center; }
        .modal-content button { background: #a8e6cf; color: #4a3b3f; margin-bottom: 8px; padding: 10px; font-size: 14px; }
        .modal-content button.cancel { background: #eee; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="energy-box">
            ⚡ 当前体力：<span id="energy">--</span>/100
        </div>

        <h2>🎮 休息区</h2>
        <button id="btnRest" onclick="doRest()">休息一下 (+40体力)</button>

        <h2>🛴 外出区</h2>
        <button id="btnWalk" onclick="openWalkModal()">出门散步 (-8体力)</button>
    </div>

    <div id="walkModal">
        <div class="modal-content">
            <h3 style="color: #ff6b81; margin-top: 0;">去哪里散步？</h3>
            <button onclick="doWalk('home')">🏡 家园周围</button>
            <button onclick="doWalk('park')">🌳 街心公园</button>
            <button onclick="doWalk('street')">🛍️ 商业街</button>
            <button onclick="doWalk('river')">🌊 河边</button>
            <button class="cancel" onclick="closeWalkModal()">取消</button>
        </div>
    </div>

    <script>
        var G = window.parent.Game || window.Game;

        function updateUI() {
            if (!G || !G.state) return;
            document.getElementById('energy').innerText = G.state.energy;
            document.getElementById('btnRest').disabled = (G.state.energy >= 100);
            document.getElementById('btnWalk').disabled = (G.state.energy < 8);
        }

        function doRest() {
            if (!G || !G.state) return;
            G.rest(); 
            setTimeout(updateUI, 100); 
        }

        function openWalkModal() {
            if (!G || !G.state) return;
            if (G.state.energy < 8) {
                alert("体力不足 8 点，无法散步啦！");
                return;
            }
            document.getElementById('walkModal').style.display = 'flex';
        }

        function closeWalkModal() {
            document.getElementById('walkModal').style.display = 'none';
        }

        function doWalk(location) {
            if (!G || !G.state) return;
            closeWalkModal();
            G.walk(location); 
            setTimeout(updateUI, 100);
        }

        window.onload = function() {
            if (!G || !G.state) {
                document.getElementById('mainCard').innerHTML = `<h2 style="color:red">⚠️ 数据加载失败</h2><p>请从主页面进入</p>`;
                return;
            }
            updateUI();
        };
    </script>
</body>
</html>
