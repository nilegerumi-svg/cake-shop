<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>城镇</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <style>
        body { background: transparent; padding: 16px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); width: 100%; max-width: 400px; box-sizing: border-box; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px dashed #ffd1dc; padding-bottom: 12px; }
        .header h2 { color: #ff6b81; margin: 0; font-size: 18px; }
        .back-btn { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; padding: 4px 8px; font-weight: bold; }
        .back-btn:active { color: #ff6b81; }

        .energy-badge { background: #fff9fa; padding: 4px 10px; border-radius: 20px; font-size: 13px; border: 1px solid #ffd1dc; font-weight: bold; }

        .loc-list { display: flex; flex-direction: column; gap: 12px; }
        .loc-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #f0faf8; border: 1px solid #a8e6cf; border-radius: 12px;
            padding: 16px; cursor: pointer; transition: all 0.2s;
        }
        .loc-item:active { transform: scale(0.98); background: #e0f5f0; }

        .loc-info { display: flex; align-items: center; gap: 12px; }
        .loc-emoji { font-size: 28px; }
        .loc-text { display: flex; flex-direction: column; text-align: left; }
        .loc-name { font-size: 16px; font-weight: bold; color: #4a3b3f; }
        .loc-desc { font-size: 12px; color: #888; margin-top: 4px; }

        .loc-meta { font-size: 12px; color: #ff8fa3; font-weight: bold; text-align: right; white-space: nowrap; }

        /* 地点内嵌商店徽标 */
        .loc-shop {
            display: inline-block; margin-top: 4px;
            padding: 1px 7px; border-radius: 999px;
            font-size: 11px; font-weight: bold;
            background: #fff5f7; color: #d85c74; border: 1px solid #ffd1dc;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <button class="back-btn" id="btnBack" type="button">◀ 返回地图</button>
            <h2>🏘️ 城镇</h2>
            <div class="energy-badge">⚡<span id="energy">--</span></div>
        </div>

        <div class="loc-list" id="locList">
            <!-- 动态生成的地点卡片 -->
        </div>
    </div>

    <script src="../../boot-safe.js"></script>
    <script type="module">
        // 引擎由父页面异步注入，不能在此同步取用
        let Cake = null;

        const $ = (id) => document.getElementById(id);
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        // 本页固定属于 town 区域
        const REGION_ID = 'town';

        const bindBack = () => {
            const backBtn = $('btnBack');
            if (!backBtn || backBtn.dataset.bound === 'true') return;
            backBtn.dataset.bound = 'true';
            backBtn.onclick = () => {
                window.history.length > 1 ? history.back() : (window.location.href = 'index.html');
            };
        };

        // 渲染地点列表
        const renderList = () => {
            try {
                const state = Cake.store.state;
                const energy = Math.max(0, Math.min(100, num(state.energy, 0)));
                $('energy').innerText = energy;

                // 获取该区域的地点数据
                let locs = null;
                if (typeof Cake.getRegionLocations === 'function') {
                    locs = Cake.getRegionLocations(REGION_ID);
                }
                if (!locs || Object.keys(locs).length === 0) {
                    locs = Cake.REGION_TOWN || null;
                }
                if (!locs || typeof locs !== 'object') locs = null;

                if (!locs || Object.keys(locs).length === 0) {
                    throw new Error('城镇地点数据为空！请检查地点文件的加载');
                }

                let html = '';
                for (const [key, loc] of Object.entries(locs)) {
                    if (!loc) continue;

                    // 该地点是否内嵌商店（到达即可购物）
                    const shop = (typeof Cake.getLocationShop === 'function')
                        ? Cake.getLocationShop(REGION_ID, key)
                        : null;
                    const shopBadge = (shop && shop.items && shop.items.length > 0)
                        ? `<span class="loc-shop">${shop.shop.emoji || '🏪'} 可购物</span>`
                        : '';

                    html += `
                        <div class="loc-item" data-loc="${key}">
                            <div class="loc-info">
                                <span class="loc-emoji">${loc.emoji || '📍'}</span>
                                <div class="loc-text">
                                    <span class="loc-name">${loc.name || key}</span>
                                    <span class="loc-desc">${loc.desc || '未知的区域'}</span>
                                    ${shopBadge}
                                </div>
                            </div>
                            <span class="loc-meta">进入 ▶</span>
                        </div>
                    `;
                }

                const listEl = $('locList');
                listEl.innerHTML = html || '<div style="color:#888; text-align:center;">当前没有可去的地点...</div>';

                // 用事件委托绑定，避免依赖全局函数
                if (!listEl.dataset.bound) {
                    listEl.dataset.bound = 'true';
                    listEl.addEventListener('click', (e) => {
                        const item = e.target.closest('[data-loc]');
                        if (!item) return;
                        goLocation(item.dataset.loc);
                    });
                }

            } catch (err) {
                $('locList').innerHTML = `
                    <div style="color: red; padding: 15px; background: #ffe4e1; border-radius: 10px;">
                        <strong>⚠️ 渲染失败：</strong><br>${err.message || err}
                    </div>`;
            }
        };

        // 跳转到具体的地点页
        // 参数名必须是 id —— location.html 通过 params.get('id') 读取
        const goLocation = (locKey) => {
            window.location.href = `location.html?id=${encodeURIComponent(locKey)}`;
        };
        window.goLocation = goLocation;

        const start = () => {
            bindBack();
            if (typeof Cake.initPage === 'function') {
                Cake.initPage('fun', () => {
                    renderList();
                }, false);
            } else {
                renderList();
            }
        };

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                start();
            }, {
                timeout: 15000,
                required: (game) => !!(game && game.store && game.store.state),
                onTimeout: () => '城镇地图：游戏引擎加载超时，请刷新页面重试。'
            });
        } else {
            Cake = window.parent.Cake || window.Cake;
            if (Cake && Cake.store && Cake.store.state) start();
        }
    </script>
</body>
</html>
