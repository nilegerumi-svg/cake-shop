<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 我的 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script src="../js/core/store.js"></script>
    <script src="../js/data/ingredients.js"></script>
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/bundles.js"></script>
    <script src="../js/data/characters.js"></script>
    <script src="../js/data/events.js"></script>
    <script src="../js/data/shop-config.js"></script>
    <script src="../js/data/achievements.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/modal.js"></script>
    <script src="../js/core/effects.js"></script>
    <script src="../js/core/render.js"></script>
    <script src="../js/actions/bakery.js"></script>
    <script src="../js/actions/shop.js"></script>
    <script src="../js/actions/social.js"></script>
    <script src="../js/actions/system.js"></script>
    <script src="../js/shared.js"></script>
    <script>
    (() => {
        'use strict';

        const contentEl = document.getElementById('content');

        let Game = null;
        let tries = 0;
        const MAX_TRIES = 100;

        const esc = (v) => (Game && typeof Game.escapeHtml === 'function')
            ? Game.escapeHtml(v)
            : String(v == null ? '' : v);

        const num = (v, fallback = 0) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        const renderAchievements = (s, achievements) => (achievements || []).map((a) => {
            const earned = Boolean(s.achievements && s.achievements[a.id]);
            return `<div class="achievement ${earned ? 'earned' : ''}">
                <span class="a-icon">${earned ? '✅' : '🔒'}</span>
                <div>
                    <div style="font-weight:700;">${a.icon || ''} ${a.name || a.id}</div>
                    <div class="muted">${a.desc || ''}</div>
                </div>
            </div>`;
        }).join('');

        const renderProfile = () => {
            const s = Game.state || {};
            const achievements = Game.ACHIEVEMENTS || [];

            const earnedCount = achievements.filter((a) => s.achievements && s.achievements[a.id]).length;
            const total = achievements.length;
            const pct = total > 0 ? Math.round((earnedCount / total) * 100) : 0;

            contentEl.innerHTML = `
                <div class="card">
                    <h2>📊 我的档案</h2>
                    <div class="grid-2">
                        <div class="item-card">
                            <span class="item-emoji">${esc(s.avatar || '👩‍🍳')}</span>
                            <span class="item-name">${esc(s.playerName || '店长')}</span>
                            <span class="item-desc">「${esc(s.shopName || '甜蜜小屋')}」的店长</span>
                            <span class="item-meta">经营第 ${num(s.day, 1)} 天 · Lv.${num(s.shopLevel, 1)} · 装饰度 ${num(s.decoration, 0)}</span>
                        </div>
                        <div class="item-card">
                            <span class="item-emoji">📈</span>
                            <span class="item-name">经营数据</span>
                            <span class="item-desc">余额：${num(s.money, 0)}元<br>累计卖出：${num(s.totalCakes, 0)}个<br>累计收入：${num(s.totalEarned, 0)}元<br>当前声望：${num(s.reputation, 0)}</span>
                        </div>
                    </div>
                    <h3>🏅 成就（${earnedCount}/${total}，${pct}%）</h3>
                    <div class="aff-bar" style="height:8px;margin:0 0 10px;" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
                        <div class="aff-fill" style="width:${pct}%;"></div>
                    </div>
                    <div class="achievement-list">${renderAchievements(s, achievements)}</div>
                    <h3>💾 存档 & 结局</h3>
                    <div class="char-actions" style="gap:10px;margin-top:8px;">
                        <button type="button" class="small" data-action="save">💾 保存游戏</button>
                        <button type="button" class="small secondary" data-action="load">📂 读取存档</button>
                        <button type="button" class="small gold" data-action="ending">🌟 查看结局</button>
                        <button type="button" class="small" data-action="reset">🔄 重新开始</button>
                    </div>
                </div>`;
        };

        /* ==================== 事件委托 ==================== */

        const bindClick = () => {
            const ACTIONS = {
                save:   () => typeof Game.saveGame === 'function' && Game.saveGame(),
                load:   () => {
                    if (confirm('读取存档会回到上次保存的进度，当前未保存的改动会丢失，确定吗？')) {
                        if (typeof Game.loadGame === 'function') Game.loadGame();
                    }
                },
                ending: () => typeof Game.showEnding === 'function' && Game.showEnding(),
                reset:  () => typeof Game.resetGame === 'function' && Game.resetGame(),
            };

            contentEl.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const handler = ACTIONS[btn.dataset.action];
                if (typeof handler === 'function') handler();
            });
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            let G = null;
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    G = window.parent.Game;
                }
            } catch (_) {}
            if (!G) G = window.Game || null;

            if (G && G.state && typeof G.initPage === 'function') {
                Game = G;
                window.Game = G;
                bindClick();
                G.initPage('profile', renderProfile);
                return;
            }

            if (++tries >= MAX_TRIES) {
                contentEl.innerHTML = '<div style="color:red;padding:20px;text-align:center;">❌ 游戏引擎加载超时，请刷新重试</div>';
                return;
            }
            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
