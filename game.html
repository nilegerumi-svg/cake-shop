<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 1. 外层撑满全屏 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
        
        /* 2. 顶部固定 */
        header, nav { flex: 0 0 auto; z-index: 10; }

        /* 3. 主分割容器：上面是功能，下面是日记 */
        .split-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 80px; /* ✨ 给外层的底部按钮留出空间 */
        }

        /* 4. 功能主画框 */
        .main-frame {
            flex: 1; 
            width: 100%;
            border: none;
            background: transparent;
        }

        /* 5. 独立日记画框 */
        .log-frame {
            flex: 0 0 180px; /* 稍微调小一点给上面留空间 */
            width: 100%;
            border: none;
            background: #fff;
            border-top: 2px dashed #ffd1dc;
            box-shadow: 0 -4px 10px rgba(255, 143, 163, 0.1);
        }
        
        iframe { display: block; width: 100%; height: 100%; }

        /* ✨ 外层统一定义底部按钮样式，解决挤压变形 */
        .action-footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            padding: 10px 15px;
            background: linear-gradient(to top, #fff0f5 80%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- 顶部状态栏和导航（由外层 game.html 负责） -->
    <header id="header"></header>
    <nav id="navBar"></nav>

    <!-- 核心嵌套：上下分屏 -->
    <div class="split-container">
        <iframe id="mainFrame" src="pages/home.html" class="main-frame"></iframe>
        <iframe id="logFrame" src="pages/log.html" class="log-frame"></iframe>
    </div>
    
    <!-- ✨ 外层统一接管底部按钮，子页面里的 footer 会被删掉 -->
    <div class="action-footer" id="footer"></div>
</div>

<!-- 所有的 JS 核心文件 -->
<script src="js/core/store.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>
<script src="js/shared.js"></script>

<script>
    // 外层只渲染顶部和底部
    Game.initPage('home', () => {}, true); 

    const mainFrame = document.getElementById('mainFrame');

    // ✨ 核心修复：每次 iframe 加载页面完成后，物理干掉子页面里重复的头、尾
    mainFrame.addEventListener('load', function() {
        try {
            const doc = this.contentWindow.document;
            const h = doc.getElementById('header');
            const n = doc.getElementById('navBar');
            const f = doc.getElementById('footer');
            if (h) h.remove();
            if (n) n.remove();
            if (f) f.remove(); // 删掉子页面的底部按钮，用外层的
        } catch(e) {}
    });

    // 【导航拦截】点击导航切换上方的功能画框
    document.addEventListener('click', function(e) {
        const link = e.target.closest('nav a');
        if (link) {
            const href = link.getAttribute('href');
            if (href && href !== '#' && href !== 'javascript:;') {
                e.preventDefault(); 
                
                let targetUrl = href;
                if (href === 'game.html' || href === 'index.html') {
                    targetUrl = 'pages/home.html';
                } else if (!href.includes('pages/')) {
                    targetUrl = 'pages/' + href;
                }
                mainFrame.src = targetUrl;
            }
        }
    });

    window.refreshDiary = function() {
        const logFrame = document.getElementById('logFrame');
        if (logFrame && logFrame.contentWindow) {
            logFrame.contentWindow.location.reload(); 
        }
    };
</script>
</body>
</html>
