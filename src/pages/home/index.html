<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小楼 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        body {
            background: transparent;
            padding: 12px;
            margin: 0;
            height: auto;
            box-sizing: border-box;
            display: block !important;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: visible;
        }
        .home-head { text-align: left; margin: 4px 0 14px; }
        .home-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 4px; }
        .home-head p { color: #b08a6a; font-size: 13px; margin: 0; }
        .muted { color: #b08a6a; }

        .floor { margin-bottom: 18px; }
        .floor-title {
            display: flex; align-items: center; gap: 6px;
            color: #8a5a44; font-size: 15px; font-weight: bold;
            margin: 0 0 8px;
        }
        .room-grid { display: flex; flex-direction: column; gap: 10px; }

        .room-card {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 14px 16px;
            background: #fffdf8;
            border: 1px solid #f0dcc0;
            border-radius: 16px;
            cursor: pointer; text-align: left;
            font-family: inherit; color: inherit;
            box-shadow: 0 2px 6px rgba(180, 120, 60, 0.06);
            transition: 0.15s;
        }
        .room-card:active { transform: scale(0.99); background: #f7ecdc; }
        .room-icon { font-size: 30px; line-height: 1; }
        .room-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .room-name { font-weight: bold; color: #4a2c17; font-size: 15px; }
        .room-desc { font-size: 12px; color: #b08a6a; }
        .room-arrow { color: #e8c9a4; font-size: 22px; font-weight: bold; }
        .soon { font-size: 10px; color: #b08a6a; background: #f7ecdc; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }

        .render-error { color: #c62828; text-align: center; margin-top: 40px; padding: 16px; }
    </style>
</head>
<body>
    <div id="content">
        <div class="muted text-center" style="margin-top:50px;">⏳ 正在等待引擎加载...</div>
    </div>

    <script src="../../pages/boot-safe.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
