<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/game-shell.css">
    
    <script type="module" src="js/host/monitor/index.js"></script>
    <style>
        .iframe-error-overlay {
            position: absolute; inset: 0; background: rgba(255,240,245,0.95); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #c81e3f; font-family: sans-serif; text-align: center; padding: 20px;
        }
        .iframe-error-overlay h3 { margin: 0 0 10px 0; font-size: 18px; }
        .iframe-error-overlay p { margin: 0; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="loading-title">🍰 甜蜜物语</div>
        <div id="loading-text" class="loading-text">正在准备启动...</div>
        <div class="loading-bar-wrap">
            <div id="loading-bar" class="loading-bar-fill"></div>
        </div>
        <div id="loading-file" class="loading-detail">正在读取：初始化…</div>
        <div id="loading-remain" class="loading-detail">剩余文件：— 个</div>
    </div>

    <div class="app-wrapper" id="app-root">
        <header id="header"></header>
        <nav id="navBar"></nav>
        
        <div class="split-container">
            <div class="log-pane">
                <iframe id="logFrame" src="pages/log/index.html" class="log-frame"></iframe>
            </div>
            <div class="main-pane">
                <iframe id="mainFrame" src="pages/home/index.html" class="main-frame"></iframe>
            </div>
        </div>
        
        <div class="action-footer" id="footer">
            <div class="footer-hint" id="footerHint">💡 前往【🏪 店铺】页面即可开店营业，接待顾客！</div>
            <div class="footer-btns">
                <div class="footer-btn" data-footer-action="sleep">
                    <span class="icon">🛌</span><span>睡觉</span>
                </div>
                <div class="footer-btn" data-footer-action="shop">
                    <span class="icon" id="f-icon-shop">🚪</span><span id="f-text-shop">营业</span>
                </div>
                <div class="footer-btn" data-footer-action="larder">
                    <span class="icon">📦</span><span>食材库</span>
                </div>
                <div class="footer-btn" style="cursor:default;">
                    <span class="icon">📅</span><span class="footer-time" id="f-time">Day 1 08:00</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/host/log-bridge.js"></script>
    <script type="module" src="js/host/game-shell.js"></script>

    <script>
        (function() {
            'use strict';

            document.querySelectorAll('[data-footer-action]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.footerAction;
                    if (typeof window.footerAction === 'function') {
                        window.footerAction(action);
                    }
                });
            });

            // ===== iframe 高度自适应：让嵌套子页面拼成纵向长条，随外壳整页滚动 =====
            // 子页面内容多高，iframe 就多高；外壳整体滚动，子页面内部不再各自滚动。
            // 用 ResizeObserver 观察子页面 body 尺寸变化，替代定时轮询（不暴力刷屏）。
            function autoResizeIframe(iframe) {
                if (!iframe || iframe.dataset.resized) return;
                iframe.dataset.resized = 'true';

                const sync = () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        let h = 0;
                        if (doc && doc.documentElement) {
                            h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
                        }
                        if (h > 0 && iframe.style.height !== h + 'px') {
                            iframe.style.height = h + 'px';
                            // 日记面板收起/展开时同步外层高度（如存在）
                            const pane = iframe.closest && iframe.closest('.log-pane, .main-pane');
                            if (pane && pane.closest) {
                                pane.style.height = 'auto';
                            }
                        }
                    } catch (_) { /* 跨域忽略 */ }
                };

                iframe.addEventListener('load', sync);

                // 同源子页面：用 ResizeObserver 监听内容尺寸变化；跨域则退回 load 同步
                try {
                    const doc = iframe.contentDocument;
                    if (doc && doc.body) {
                        const ro = new ResizeObserver(() => sync());
                        ro.observe(doc.body);
                        if (doc.documentElement) ro.observe(doc.documentElement);
                        iframe.__resizeObserver = ro;
                    }
                } catch (_) { /* 跨域无法观察，仅 load 时同步一次 */ }

                window.addEventListener('resize', sync);
                sync();
            }
            autoResizeIframe(document.getElementById('logFrame'));
            autoResizeIframe(document.getElementById('mainFrame'));

            function checkIframeLoaded(iframeId, pageName) {
                const iframe = document.getElementById(iframeId);
                if (!iframe) return;

                iframe.addEventListener('load', () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        const bodyText = doc.body ? doc.body.innerText.toLowerCase() : '';
                        const titleText = doc.title ? doc.title.toLowerCase() : '';
                        const htmlContent = doc.documentElement ? doc.documentElement.innerHTML.toLowerCase() : '';

                        if (bodyText.includes('404') || titleText.includes('404') || bodyText.includes('file not found')) {
                            showIframeError(iframe, `${pageName} (404 找不到文件)`, iframe.src);
                        } else if (!doc.body || (doc.body.children.length === 0 && htmlContent.length < 200)) {
                            showIframeError(iframe, `${pageName} (内容为空)`, '页面似乎只有空标签，请检查 HTML 结构是否有误。');
                        }
                    } catch (err) {
                        console.warn(`无法读取 ${iframeId} 的内容 (可能跨域)`, err);
                    }
                });
            }

            function showIframeError(iframe, title, detail) {
                const parent = iframe.parentNode;
                if (!parent) return;
                if (parent.querySelector('.iframe-error-overlay')) return;

                const overlay = document.createElement('div');
                overlay.className = 'iframe-error-overlay';
                overlay.innerHTML = `
                    <h3>⚠️ ${title}</h3>
                    <p style="margin-bottom:10px; max-width:100%;">${detail}</p>
                    <button type="button" style="padding:8px 20px; border:none; border-radius:20px; background:#ff8fa3; color:white; font-weight:bold; cursor:pointer;">关闭</button>
                `;
                const closeBtn = overlay.querySelector('button');
                closeBtn.addEventListener('click', () => overlay.remove());
                parent.appendChild(overlay);
            }

            document.addEventListener('DOMContentLoaded', () => {
                checkIframeLoaded('mainFrame', '主页 iframe 加载失败');
                checkIframeLoaded('logFrame', '日志 iframe 加载失败');
            });
        })();
    </script>
</body>
</html>
