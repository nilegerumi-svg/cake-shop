<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娱乐 - 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- 头部卡片 -->
        <div class="card">
            <div class="fun-header">
                <button class="btn-back" onclick="window.location.href='game.html'">⬅ 返回</button>
                <div class="fun-title">🎮 娱乐</div>
                <div style="width: 40px;"></div> <!-- 占位保持居中 -->
            </div>

            <!-- 按钮区 -->
            <button class="fun-action-btn btn-walk" onclick="doWalk()">🚶 出门散步</button>
            <button class="fun-action-btn btn-rest" onclick="doRest()">😴 休息一下</button>

            <!-- 提示信息 -->
            <div class="status-msg" id="status-msg">放松一下，劳逸结合~</div>
        </div>
    </div>

    <!-- 你的脚本 -->
    <script src="js/state.js"></script>
    <script src="js/actions/system.js"></script>
    <script>
        function doWalk() {
            if (typeof Cake !== 'undefined' && Cake.actions && Cake.actions.walk) {
                Cake.actions.walk();
                document.getElementById('status-msg').innerText = "散步完成，体力恢复啦！";
            } else if (typeof walk === 'function') {
                walk();
                document.getElementById('status-msg').innerText = "散步完成，体力恢复啦！";
            }
        }
        function doRest() {
            if (typeof Cake !== 'undefined' && Cake.actions && Cake.actions.rest) {
                Cake.actions.rest();
                document.getElementById('status-msg').innerText = "美美地睡了一觉，体力满满！";
            } else if (typeof rest === 'function') {
                rest();
                document.getElementById('status-msg').innerText = "美美地睡了一觉，体力满满！";
            }
        }
    </script>
</body>
</html>
