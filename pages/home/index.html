<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        /* 子页面高度自然展开：外壳 iframe 会按内容同步高度，整页统一滚动 */
        body {
            background: transparent;
            padding: 16px;
            margin: 0;
            height: auto;
            box-sizing: border-box;
            display: block !important;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: visible;
        }
        .room-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: #fff;
            border-radius: 16px;
            margin-bottom: 15px;
            cursor: pointer;
            border: 1px solid rgba(255, 175, 200, 0.55);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: 0.2s;
        }
        .room-card:active { transform: scale(0.98); background: #fff8fa; }
        .room-left { display: flex; align-items: center; gap: 15px; }
        .room-icon { font-size: 36px; }
        .room-title { font-weight: bold; color: var(--pink-600); font-size: 18px; }
        .room-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .arrow { color: var(--pink-300); font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="content">
        <!-- 这个加载提示如果一直不消失，说明 index.js 报错了，或者没拿到 Cake 引擎 -->
        <div class="muted text-center" style="margin-top:50px;">⏳ 正在等待引擎加载...</div>
    </div>

    <!-- 🚨 检查这里！大概率少写了一个 ../ 或 js/ -->
    <script src="../../pages/boot-safe.js"></script> 
    <script type="module" src="index.js"></script>
</body>
</html>
