<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家具 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .f-head { text-align: left; margin: 4px 0 10px; }
  .f-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .f-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .search { width:100%; box-sizing:border-box; padding:10px 14px; border:2px solid #f0dcc0; border-radius:12px; font-size:14px; background:#fffdf8; color:#4a2c17; margin-bottom:10px; }
  .cat-title { color:#8a5a44; font-size:14px; font-weight:bold; margin:12px 0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .f-card { background:#fffdf8; border:1px solid #f0dcc0; border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:4px; }
  .f-top { display:flex; align-items:center; gap:8px; }
  .f-emoji { font-size:24px; line-height:1; }
  .f-name { font-weight:bold; color:#4a2c17; font-size:13px; }
  .f-desc { font-size:11px; color:#b08a6a; line-height:1.4; }
  .f-meta { font-size:11px; color:#e04a63; font-weight:bold; margin-top:2px; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载家具...</div></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() { try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {} return window.Cake || null; }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const CAT = { table:'🪑 桌椅', storage:'🗄️ 收纳', light:'💡 灯饰', decor:'🎀 装饰', toy:'🧸 玩具', aquarium:'🐠 水族', tablecloth:'🍽️ 桌布', ornament:'🏺 摆件', hanging:'🖼️ 挂饰', aqua_decor:'🌿 水族装饰', appliance:'🔌 电器' };
  let q = '';
  function render() {
    const Cake = getCake(); const el = document.getElementById('content');
    if (!el || !Cake) return;
    const F = Cake.FURNITURE; if (!F) return;
    const kw = q.trim().toLowerCase();
    const groups = {};
    for (const [id, f] of Object.entries(F)) {
      if (kw && !String(f.name || '').toLowerCase().includes(kw)) continue;
      const c = f.category || 'decor'; (groups[c] = groups[c] || []).push(f);
    }
    let html = `<div class="f-head"><h2>🛋️ 家具</h2><p class="muted">共 ${Object.keys(F).length} 件</p></div>`;
    html += `<input type="search" class="search" id="search" placeholder="搜索家具…" aria-label="搜索家具" value="${esc(q)}">`;
    for (const c of Object.keys(CAT).concat(Object.keys(groups).filter(k => !CAT[k]))) {
      const items = groups[c]; if (!items || !items.length) continue;
      items.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh'));
      html += `<div class="cat-title">${CAT[c] || c} <span class="muted">(${items.length})</span></div><div class="grid">`;
      for (const f of items) {
        html += `<div class="f-card"><div class="f-top"><span class="f-emoji" aria-hidden="true">${f.emoji || '🪑'}</span><span class="f-name">${esc(f.name)}</span></div>
          <div class="f-desc">${esc(f.desc || '')}</div><div class="f-meta">💰${f.buyPrice ?? 0} · 装饰 ${f.decor ?? 0}</div></div>`;
      }
      html += `</div>`;
    }
    el.innerHTML = html;
  }
  document.addEventListener('input', (e) => { if (e.target && e.target.id === 'search') { q = e.target.value; render(); const s = document.getElementById('search'); if (s) s.focus(); } });
  if (window.safePageBoot) window.safePageBoot.waitForCake(() => render(), { timeout:15000, required:g=>!!(g&&g.FURNITURE), onTimeout:()=>'家具加载超时' });
  else if (getCake()) render();
})();
</script>
</body>
</html>
