<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>甜蜜物语 - 开始</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe8ee 40%, #fff5f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            color: #4a3b3f;
        }
        .start-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }
        .game-header h1 { color: #ff6b81; font-size: 32px; margin-bottom: 8px; }
        .game-header .subtitle { color: #ff9eaa; font-size: 14px; margin-bottom: 24px; font-weight: bold; }
        .game-intro { background: #fff0f5; padding: 16px; border-radius: 16px; margin-bottom: 24px; }
        .game-intro p { color: #666; font-size: 14px; line-height: 1.8; text-align: left; }
        .game-intro strong { color: #ff6b81; }

        .avatar-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .avatar-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff0f5;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .avatar-option:focus-visible {
            outline: 2px solid #ff8fa3;
            outline-offset: 2px;
        }
        .avatar-option.selected {
            border-color: #ff6b81;
            background: #ffe4e8;
            box-shadow: 0 0 15px rgba(255, 107, 129, 0.4);
            transform: scale(1.1);
        }

        .input-group { text-align: left; margin-bottom: 24px; }
        .input-group label {
            display: block; font-size: 14px; font-weight: bold;
            color: #d85c74; margin-bottom: 8px; margin-top: 16px;
        }
        .input-group label:first-child { margin-top: 0; }
        .input-group input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #ffd1dc; border-radius: 12px;
            font-size: 16px; background: #fafafa; color: #333;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none; border-color: #ff8fa3; background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 143, 163, 0.15);
        }

        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .button-group button {
            width: 100%; padding: 16px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-start { background: #ff8fa3; color: white; box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4); }
        .btn-start:active { transform: scale(0.98); }
        .btn-continue { background: #ffffff; color: #ff8fa3; border: 2px solid #ff8fa3 !important; }
        .btn-continue:active { background: #fff0f5; transform: scale(0.98); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="start-card">
        <div class="game-header">
            <h1>🍰 甜蜜物语</h1>
            <div class="subtitle">✨ 女性向 · 高自由度蛋糕店模拟器 ✨</div>
        </div>

        <div class="game-intro">
            <p>你刚刚接手了街角一间小小的蛋糕店。<br>
            在这里，你可以<strong>自由烘焙每一款蛋糕</strong>、<strong>随心装饰你的店铺</strong>、邂逅温柔的邻居们，甚至——谈一场甜甜的恋爱。💕<br>
            你的故事，由你亲手书写。</p>
        </div>

        <div class="avatar-group" id="avatarGroup" role="radiogroup" aria-label="选择头像">
            <div class="avatar-option selected" role="radio" tabindex="0"  aria-checked="true"  data-avatar="girl1">👧🏻</div>
            <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" data-avatar="girl2">👩🏻</div>
            <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" data-avatar="boy1">👦🏻</div>
            <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" data-avatar="cake">🧁</div>
        </div>

        <div class="input-group">
            <label for="playerName">你的名字</label>
            <input id="playerName" type="text" maxlength="12" placeholder="给自己起个名字吧" value="小甜心" autocomplete="off">
            <label for="shopName">店铺名字</label>
            <input id="shopName" type="text" maxlength="12" placeholder="给蛋糕店起个名字" value="甜蜜小屋" autocomplete="off">
        </div>

        <div class="button-group">
            <button class="btn-start" id="btnStart" type="button">开始新游戏</button>
            <button class="btn-continue" id="btnContinue" type="button" style="display:none;">继续游戏</button>
        </div>
    </div>

    <script src="js/core/store.js"></script>
    <script src="js/core/state.js"></script>

    <script>
    (() => {
        const Cake = window.Cake || {};

        /* ---------------- 常量与 DOM ---------------- */

        const AVATAR_EMOJI = Object.freeze({
            girl1: '👧🏻',
            girl2: '👩🏻',
            boy1:  '👦🏻',
            cake:  '🧁',
        });

        const AVATAR_KEYS = Object.keys(AVATAR_EMOJI);

        const group        = document.getElementById('avatarGroup');
        const options      = [...group.querySelectorAll('.avatar-option')];
        const btnStart     = document.getElementById('btnStart');
        const btnContinue  = document.getElementById('btnContinue');
        const nameInput    = document.getElementById('playerName');
        const shopInput    = document.getElementById('shopName');

        const DEFAULT_PLAYER_NAME = '小甜心';
        const DEFAULT_SHOP_NAME   = '甜蜜小屋';
        const NEXT_PAGE           = 'game.html';

        let selectedKey = 'girl1';

        /* ---------------- 头像选择 ---------------- */

        const select = (opt) => {
            for (const o of options) {
                const on = o === opt;
                o.classList.toggle('selected', on);
                o.setAttribute('aria-checked', String(on));
                o.setAttribute('tabindex', on ? '0' : '-1');
            }
            const { avatar } = opt.dataset;
            selectedKey = avatar;
        };

        const moveFocus = (idx, delta) => {
            const next = options[(idx + delta + options.length) % options.length];
            select(next);
            next.focus();
        };

        options.forEach((opt, idx) => {
            opt.addEventListener('click', () => {
                select(opt);
                opt.focus();
            });

            opt.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowRight':
                    case 'ArrowDown':
                        moveFocus(idx, 1);
                        break;
                    case 'ArrowLeft':
                    case 'ArrowUp':
                        moveFocus(idx, -1);
                        break;
                    case ' ':
                    case 'Enter':
                        select(opt);
                        break;
                    default:
                        return;
                }
                e.preventDefault();
            });
        });

        /* ---------------- 存档检测 ---------------- */

        const hasSave = () => {
            try {
                return typeof Cake.hasSave === 'function' && Cake.hasSave();
            } catch (err) {
                console.warn('检查存档失败:', err);
                return false;
            }
        };

        if (hasSave()) {
            btnContinue.style.display = '';
            btnStart.textContent = '重新开始';
        }

        /* ---------------- 工具函数 ---------------- */

        const readInput = (input, fallback) =>
            (input.value || '').trim().slice(0, 12) || fallback;

        const goToGame = () => {
            location.href = NEXT_PAGE;
        };

        /* ---------------- 开始新游戏 ---------------- */

        btnStart.addEventListener('click', () => {
            if (hasSave() && !confirm('已有存档，重新开始会覆盖当前进度，确定吗？')) return;

            const playerName = readInput(nameInput, DEFAULT_PLAYER_NAME);
            const shopName   = readInput(shopInput, DEFAULT_SHOP_NAME);
            const avatar     = AVATAR_EMOJI[selectedKey] || AVATAR_EMOJI.girl1;

            try {
                if (typeof Cake.defaultState === 'function' && typeof Cake.saveState === 'function') {
                    const state = Cake.defaultState();
                    Object.assign(state, { playerName, shopName, avatar });

                    Cake.store.state = state;
                    Cake.saveState();
                } else {
                    localStorage.setItem('playerName', playerName);
                    localStorage.setItem('shopName', shopName);
                    localStorage.setItem('playerAvatar', selectedKey);

                    if (typeof Cake.SAVE_KEY === 'string') {
                        localStorage.removeItem(Cake.SAVE_KEY);
                    }
                }
            } catch (err) {
                console.error('保存初始状态失败:', err);
            }

            goToGame();
        });

        /* ---------------- 继续游戏 ---------------- */

        btnContinue.addEventListener('click', goToGame);
    })();
    </script>
</body>
</html>
