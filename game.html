<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 1. 外层撑满全屏 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
        
        /* 2. 顶部固定 */
        header, nav { flex: 0 0 auto; z-index: 10; }

        /* 3. 主分割容器：上面是功能，下面是日记 */
        .split-container {
            flex: 1; /* 占满剩余所有空间 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 4. 功能主画框 (占据大部分空间) */
        .main-frame {
            flex: 1; 
            width: 100%;
            border: none;
            background: transparent;
        }

        /* 5. 独立日记画框 (固定高度，在底部) */
        .log-frame {
            flex: 0 0 200px; /* 固定高度 200px，你可以按需调整 */
            width: 100%;
            border: none;
            background: #fff;
            border-top: 2px dashed #ffd1dc; /* 和上方功能区分隔 */
            box-shadow: 0 -4px 10px rgba(255, 143, 163, 0.1);
        }
        
        iframe { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- 顶部状态栏和导航（由 shared.js 渲染） -->
    <header id="header"></header>
    <nav id="navBar"></nav>

    <!-- 核心嵌套：上下分屏 -->
    <div class="split-container">
        <!-- 上屏：功能画框 -->
        <iframe id="mainFrame" src="pages/home.html" class="main-frame"></iframe>
        
        <!-- 下屏：独立日记画框 -->
        <iframe id="logFrame" src="pages/log.html" class="log-frame"></iframe>
    </div>
</div>

<!-- 你所有的 JS 核心文件 -->
<script src="js/core/store.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>
<script src="js/shared.js"></script>

<script>
    Game.initPage('home', () => {}, true); 

    // 【导航拦截】点击导航切换上方的功能画框
    document.addEventListener('click', function(e) {
        const link = e.target.closest('nav a');
        if (link) {
            const href = link.getAttribute('href');
            if (href && href !== '#' && href !== 'javascript:;') {
                e.preventDefault(); 
                
                // 👇【核心修改在这里】处理主页和子页面的路径映射 👇
                let targetUrl = href;
                if (href === 'game.html' || href === 'index.html') {
                    targetUrl = 'pages/home.html';
                } else if (!href.includes('pages/')) {
                    targetUrl = 'pages/' + href;
                }
                // 👆-----------------------------------------👆

                document.getElementById('mainFrame').src = targetUrl;
            }
        }
    });

    // 【暴露全局方法】让子页面（如 home.html）在写日记后，可以调用这个方法刷新下面的日记画框
    window.refreshDiary = function() {
        const logFrame = document.getElementById('logFrame');
        if (logFrame && logFrame.contentWindow) {
            logFrame.contentWindow.location.reload(); 
        }
    };
</script>
</body>
</html>
