<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        header, nav { flex: 0 0 auto; z-index: 10; }
        .split-container {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            padding-bottom: calc(var(--footer-h, 70px) + env(safe-area-inset-bottom));
        }
        .main-frame { flex: 1; width: 100%; border: none; background: transparent; min-height: 240px; }
        .log-frame {
            flex: 0 0 clamp(110px, 22vh, 180px);
            width: 100%; border: none; background: #fff;
            border-top: 2px dashed #ffd1dc;
            box-shadow: 0 -4px 10px rgba(255, 143, 163, 0.1);
        }
        iframe { display: block; width: 100%; height: 100%; }
        .action-footer {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px;
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            background: linear-gradient(to top, #fff0f5 80%, transparent);
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; z-index: 100;
        }
        #error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;
            background: rgba(220, 38, 38, 0.95); color: white;
            padding: 10px; font-size: 13px; line-height: 1.4;
            word-break: break-all; pointer-events: none;
            max-height: 40vh; overflow-y: auto; display: none;
        }
    </style>
</head>
<body>

<div id="error-overlay"></div>

<div class="app-wrapper">
    <header id="header"></header>
    <nav id="navBar"></nav>
    <div class="split-container">
        <iframe id="mainFrame" src="pages/home.html" class="main-frame"></iframe>
        <iframe id="logFrame" src="pages/log.html" class="log-frame"></iframe>
    </div>
    <div class="action-footer" id="footer"></div>
</div>

<!-- 核心与数据 -->
<script src="js/core/store.js"></script>
<script src="js/core/bridge.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>

<!-- 动作模块 -->
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>

<!-- 👇 全新的娱乐与地图模块 👇 -->
<!-- 1. 通用事件池 -->
<script src="js/entertainment/common_events.js"></script>
<!-- 2. 独立地图模块 (注意顺序，index.js 必须在最后) -->
<script src="js/entertainment/map/home.js"></script>
<script src="js/entertainment/map/park.js"></script>
<script src="js/entertainment/map/street.js"></script>
<script src="js/entertainment/map/river.js"></script>
<script src="js/entertainment/map/index.js"></script>
<!-- 3. 核心逻辑 -->
<script src="js/entertainment/rest.js"></script>
<script src="js/entertainment/walk.js"></script>

<!-- 兼容层与状态同步 (只能引入一次) -->
<script src="js/shared.js"></script>


<script>
(() => {
    'use strict';

    /* ==================== 错误悬浮层 ==================== */

    const errorOverlay = document.getElementById('error-overlay');
    const MAX_ERRORS = 20;
    let errorCount = 0;

    const showError = (msg) => {
        if (errorCount >= MAX_ERRORS) return;
        errorCount += 1;
        errorOverlay.style.display = 'block';

        const line = document.createElement('div');
        line.textContent = `🚨 ${msg}`;
        errorOverlay.appendChild(line);

        if (errorCount === MAX_ERRORS) {
            const more = document.createElement('div');
            more.textContent = '（错误过多，已停止显示）';
            errorOverlay.appendChild(more);
        }
    };

    const formatError = (e) => {
        const file = e.filename ? e.filename.split('/').pop() : 'unknown';
        return `${e.message} (${file}:${e.lineno})`;
    };

    window.addEventListener('error', (e) => {
        showError(`主页面: ${formatError(e)}`);
    });

    /* ==================== iframe 引用 ==================== */

    const mainFrame = document.getElementById('mainFrame');
    const logFrame  = document.getElementById('logFrame');
    const footer    = document.getElementById('footer');
    const frames    = [mainFrame, logFrame];

    /* ==================== iframe 内部错误捕获 ==================== */

    const bindErrorCatcher = (iframe, name) => {
        const attach = () => {
            try {
                const win = iframe.contentWindow;
                if (!win || win.__errorBound) return;
                win.__errorBound = true;
                win.addEventListener('error', (e) => {
                    showError(`${name}: ${formatError(e)}`);
                });
            } catch (_) { /* 跨域时忽略 */ }
        };
        iframe.addEventListener('load', attach);
        attach();
    };

    bindErrorCatcher(mainFrame, '主页');
    bindErrorCatcher(logFrame, '日志');

    /* ==================== 页面路由（iframe 内跳转） ==================== */

    const normalizePage = (href) => {
        const t = (href || '').trim().replace(/^\.\//, '');
        if (!t) return null;
        if (/^(https?:)?\/\//.test(t) || /^javascript:/i.test(t)) return null;
        if (t === 'game.html' || t === 'index.html') return 'pages/home.html';
        if (t.startsWith('pages/')) return t;
        return `pages/${t}`;
    };

    const navigateTo = (href) => {
        const target = normalizePage(href);
        if (!target) return false;
        if (mainFrame.getAttribute('src') !== target) mainFrame.src = target;
        return true;
    };

    const bindLinkInterceptor = (doc) => {
        if (!doc || doc.__navBound) return;
        doc.__navBound = true;

        doc.addEventListener('click', (e) => {
            const link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            if (!link || link.target === '_blank') return;

            const href = link.getAttribute('href');
            if (!href || href === '#' || /^javascript:/i.test(href)) return;
            if (!/^[\w./-]+\.html(#.*)?$/.test(href)) return;

            if (navigateTo(href)) e.preventDefault();
        });
    };

    bindLinkInterceptor(document);

    for (const f of frames) {
        f.addEventListener('load', () => {
            try { bindLinkInterceptor(f.contentDocument); } catch (_) { /* ignore */ }
        });
    }

    /* ==================== 跨 iframe 状态同步 ==================== */

    const handleStateChanged = (sourceId) => {
        const Cake = window.Cake;
        if (!Cake || !Cake.store) return;

        try {
            if (typeof Cake.loadStateFromStorage === 'function') {
                const loaded = Cake.loadStateFromStorage();
                if (loaded) Cake.store.state = loaded;
            }
        } catch (err) {
            console.warn('[host] load state failed', err);
        }

        try {
            if (typeof Cake.renderHeader === 'function') Cake.renderHeader();
            if (typeof Cake.renderNav === 'function') Cake.renderNav();
            if (typeof Cake.renderFooter === 'function') Cake.renderFooter();
        } catch (err) {
            console.warn('[host] render failed', err);
        }

        const msg = { type: 'state-sync', sourceId };
        for (const f of frames) {
            try { f.contentWindow.postMessage(msg, '*'); } catch (_) { /* ignore */ }
        }
    };

    const registerBroadcaster = () => {
        const bridge = window.Cake && window.Cake.bridge;
        if (bridge && typeof bridge.setHostBroadcaster === 'function') {
            bridge.setHostBroadcaster(handleStateChanged);
            return true;
        }
        return false;
    };

    if (!registerBroadcaster()) {
        document.addEventListener('DOMContentLoaded', registerBroadcaster);
    }

    /* ==================== footer 高度 → CSS 变量 ==================== */

    if (footer && window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
            document.documentElement.style.setProperty(
                '--footer-h', `${footer.offsetHeight}px`
            );
        });
        ro.observe(footer);
    }

    /* ==================== 首屏渲染 ==================== */

    try {
        const Cake = window.Cake;
        if (Cake && Cake.store && typeof Cake.loadStateFromStorage === 'function') {
            const freshState = Cake.loadStateFromStorage();
            if (freshState) Cake.store.state = freshState;
        }

        const initializer =
            (window.Cake && window.Cake.initPage) ||
            (window.Game && window.Game.initPage);

        if (typeof initializer === 'function') {
            initializer('home', () => {}, false);
        } else {
            showError('首屏渲染失败: 未找到 initPage 方法，请检查 render.js 或 shared.js 是否加载成功。');
        }
    } catch (err) {
        showError(`首屏渲染失败: ${err.message}`);
    }
})();
</script>
</body>
</html>
