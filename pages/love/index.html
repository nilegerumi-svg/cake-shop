<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 缘分 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .char-card {
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px;
            padding: 15px; background: #fff; border-radius: 12px; border: 1px solid var(--pink-100);
        }
        .char-card:active { transform: scale(0.98); background: #fff8fa; }
        .char-emoji { font-size: 40px; }
        .char-info { flex: 1; }
        .char-name { font-weight: bold; font-size: 16px; color: var(--text-main); }
        .char-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="card">
            <h2>💕 缘分相遇</h2>
            <p class="muted" style="margin-bottom: 15px;">通过经营和散步邂逅的人，去看看他们吧。</p>
            <div class="grid-2" id="content"></div>
        </div>
    </div>

    <!-- 引擎等待器（与配方页/采购页一致） -->
    <script src="../boot-safe.js"></script>
    <script type="module">
        // 引擎由父页面异步注入，不能在此同步取用
        let Cake = null;

        const affLevel = (aff) => {
            if (aff >= 100) return '💖 挚爱';
            if (aff >= 80) return '💗 心动';
            if (aff >= 60) return '💞 亲密';
            if (aff >= 40) return '🤝 朋友';
            if (aff >= 20) return '👋 相识';
            return '🤍 陌生';
        };

        const renderHub = () => {
            const state = Cake.store.state;
            const characters = Cake.CHARACTERS || {};
            const charState = state.characters || {};
            const contentEl = document.getElementById('content');

            contentEl.innerHTML = Object.entries(characters).map(([cid, char]) => {
                const cs = charState[cid] || { met: false, affection: 0 };

                if (!cs.met) {
                    return `
                    <div class="char-card" style="opacity:0.6; cursor:not-allowed;">
                        <div class="char-emoji">❓</div>
                        <div class="char-info">
                            <div class="char-name">???</div>
                            <div class="char-desc">🔒 尚未相遇</div>
                        </div>
                    </div>`;
                }

                const aff = Math.max(0, Math.min(100, cs.affection || 0));
                return `
                    <div class="char-card" data-cid="${cid}">
                        <div class="char-emoji">${char.emoji}</div>
                        <div class="char-info">
                            <div class="char-name">${char.name}</div>
                            <div class="char-desc" style="color:var(--pink-600); font-weight:bold;">
                                ${affLevel(aff)} ${aff}/100
                            </div>
                            <div class="aff-bar" style="height:4px; margin-top:6px;">
                                <div class="aff-fill" style="width:${aff}%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 事件委托绑定，避免依赖全局函数
            if (!contentEl.dataset.bound) {
                contentEl.dataset.bound = 'true';
                contentEl.addEventListener('click', (e) => {
                    const card = e.target.closest('[data-cid]');
                    if (!card) return;
                    window.location.href = `detail.html?id=${encodeURIComponent(card.dataset.cid)}`;
                });
            }
        };

        const start = () => {
            if (typeof Cake.initPage === 'function') {
                Cake.initPage('love', renderHub, false);
            } else {
                renderHub();
            }
        };

        if (window.safePageBoot && typeof window.safePageBoot.waitForCake === 'function') {
            window.safePageBoot.waitForCake((readyCake) => {
                Cake = readyCake;
                start();
            }, {
                timeout: 15000,
                // 需等角色数据到位，否则列表恒为空
                required: (game) => !!(game && game.store && game.store.state && game.CHARACTERS),
                onTimeout: () => '缘分：游戏引擎或角色数据加载超时，请刷新页面重试。'
            });
        } else {
            Cake = window.parent.Cake || window.Cake;
            if (Cake && Cake.store && Cake.store.state) start();
        }
    </script>
</body>
</html>
