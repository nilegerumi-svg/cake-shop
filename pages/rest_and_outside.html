<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娱乐</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style> body { background: transparent; padding: 16px; margin: 0; } </style>
</head>
<body>
<div id="content"></div>
<script>
    window.onload = function() {
        const Cake = window.parent.Cake;
        if (!Cake) return;

        function render() {
            const s = Cake.store.state;
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>🎮 娱乐</h2>
                    <p class="muted">精力 ${s.energy}/100</p>
                    <div class="char-actions" style="margin-top:16px;">
                        <button class="small" onclick="parent.Cake.rest(); parent.Cake.refreshPage(); render();">😴 休息 (+精力)</button>
                        <button class="small secondary" onclick="parent.Cake.walk(); parent.Cake.refreshPage(); render();">🚶‍♀️ 散步 (+精力)</button>
                    </div>
                </div>`;
        }
        render();
    };
</script>
</body>
</html>
