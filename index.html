<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜物语 - 开始</title>
    <style>
        /* 基础设置与粉嫩背景 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe8ee 40%, #fff5f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #4a3b3f;
        }

        /* 主卡片容器 */
        .start-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        /* 标题区域 */
        .game-header h1 {
            color: #ff6b81;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .game-header .subtitle {
            color: #ff9eaa;
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: bold;
        }

        /* 简介区域 */
        .game-intro {
            background: #fff0f5;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .game-intro p {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            text-align: left;
        }
        .game-intro strong {
            color: #ff6b81;
        }

        /* 输入框区域 */
        .input-group {
            text-align: left;
            margin-bottom: 30px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #d85c74;
            margin-bottom: 8px;
            margin-top: 16px;
        }
        .input-group label:first-child {
            margin-top: 0;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ffd1dc;
            border-radius: 12px;
            font-size: 16px;
            background: #fafafa;
            color: #333;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: #ff8fa3;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 143, 163, 0.15);
        }

        /* 按钮区域 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .button-group button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-start {
            background: #ff8fa3;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
        }
        .btn-start:active {
            transform: scale(0.98);
        }
        .btn-continue {
            background: #ffffff;
            color: #ff8fa3;
            border: 2px solid #ff8fa3 !important;
        }
        .btn-continue:active {
            background: #fff0f5;
            transform: scale(0.98);
        }

        /* 淡入动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="start-card">
        <!-- 标题区 -->
        <div class="game-header">
            <h1>🍰 甜蜜物语</h1>
            <div class="subtitle">✨ 女性向 · 高自由度蛋糕店模拟器 ✨</div>
        </div>

        <!-- 简介区 -->
        <div class="game-intro">
            <p>你刚刚接手了街角一间小小的蛋糕店。<br>
            在这里，你可以<strong>自由烘焙每一款蛋糕</strong>、<strong>随心装饰你的店铺</strong>、邂逅温柔的邻居们，甚至——谈一场甜甜的恋爱。💕<br>
            你的故事，由你亲手书写。</p>
        </div>

        <!-- 输入区 -->
        <div class="input-group">
            <label>👩‍🍳 你的名字（默认：小甜）</label>
            <input type="text" placeholder="请输入你的名字" value="小甜">
            
            <label>🏪 蛋糕店的名字（默认：甜蜜物语）</label>
            <input type="text" placeholder="请输入店铺名字" value="甜蜜物语">
        </div>

        <!-- 按钮区 -->
        <div class="button-group">
            <button class="btn-start">☀️ 开启甜蜜之旅</button>
            <button class="btn-continue">📖 继续游戏</button>
        </div>
    </div>

</body>
</html>
