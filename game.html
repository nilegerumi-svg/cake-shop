<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 1. 外层容器，撑满全屏 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
        
        /* 2. 顶部栏和导航栏固定 */
        header, nav { flex: 0 0 auto; z-index: 10; }

        /* 3. 核心画框：用 iframe 装子页面 */
        .iframe-container {
            flex: 1; /* 占据剩余所有空间 */
            width: 100%;
            border: none;
            background: transparent;
            /* 防止内容被底部悬浮按钮挡住，可以留点底边距 */
            padding-bottom: 10px; 
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- 顶部状态和导航（由 shared.js 渲染） -->
    <header id="header"></header>
    <nav id="navBar"></nav>

    <!-- 画框：默认加载主页 -->
    <iframe id="mainFrame" src="pages/home.html" class="iframe-container"></iframe>
</div>

<!-- 引入所有基础 JS -->
<script src="js/core/store.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>
<script src="js/shared.js"></script>

<script>
    // 初始化主框架
    Game.initPage('home', () => {}, true); 

    // 【关键逻辑】：拦截导航栏点击，阻止整页跳转，改为替换 iframe 的内容
    document.addEventListener('click', function(e) {
        const link = e.target.closest('nav a');
        if (link) {
            const href = link.getAttribute('href');
            // 如果链接有效且不是空链接
            if (href && href !== '#' && href !== 'javascript:;') {
                e.preventDefault(); // 阻止浏览器整页刷新跳转
                
                // 如果原链接是 bake.html，拼成 pages/bake.html
                let targetUrl = href;
                if (!href.includes('pages/')) {
                    targetUrl = 'pages/' + href;
                }
                
                // 切换画框里的内容
                document.getElementById('mainFrame').src = targetUrl;
            }
        }
    });
</script>
</body>
</html>
