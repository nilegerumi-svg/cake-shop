<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>城镇</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <style>
        body { background: transparent; font-family: sans-serif; padding: 16px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); width: 100%; max-width: 400px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px dashed #ffd1dc; padding-bottom: 12px; }
        .header h2 { color: #ff6b81; margin: 0; font-size: 18px; }
        .back-btn { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; padding: 4px 8px; font-weight: bold; }
        .back-btn:active { color: #ff6b81; }

        .energy-badge { background: #fff9fa; padding: 4px 10px; border-radius: 20px; font-size: 13px; border: 1px solid #ffd1dc; font-weight: bold; }

        .loc-list { display: flex; flex-direction: column; gap: 12px; }
        .loc-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #f0faf8; border: 1px solid #a8e6cf; border-radius: 12px;
            padding: 16px; cursor: pointer; transition: all 0.2s;
        }
        .loc-item:active { transform: scale(0.98); background: #e0f5f0; }

        .loc-info { display: flex; align-items: center; gap: 12px; }
        .loc-emoji { font-size: 28px; }
        .loc-text { display: flex; flex-direction: column; text-align: left; }
        .loc-name { font-size: 16px; font-weight: bold; color: #4a3b3f; }
        .loc-desc { font-size: 12px; color: #888; margin-top: 4px; }

        .loc-meta { font-size: 12px; color: #ff8fa3; font-weight: bold; text-align: right; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <button class="back-btn" id="btnBack" type="button">◀ 返回地图</button>
            <h2>🏘️ 城镇</h2>
            <div class="energy-badge">⚡<span id="energy">--</span></div>
        </div>

        <div class="loc-list" id="locList">
            <!-- 动态生成的地点卡片 -->
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        const $ = (id) => document.getElementById(id);
        const locListEl = $('locList');
        const energyEl  = $('energy');

        let Cake = null;
        let tries = 0;
        const MAX_TRIES = 100;      // 100 × 100ms = 10s

        const REGION_ID = 'town';   // 本页对应的区域 id

        const num = (v, fallback = 0) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        const getCake = () => {
            try {
                if (window.parent && window.parent !== window && window.parent.Cake) {
                    return window.parent.Cake;
                }
            } catch (_) { /* 跨域 */ }
            return window.Cake || null;
        };

        const navigateTo = (fullPath, relativeFallback) => {
            try {
                if (window.parent && window.parent !== window &&
                    window.parent.HostRouter &&
                    typeof window.parent.HostRouter.navigateTo === 'function') {
                    window.parent.HostRouter.navigateTo(fullPath);
                    return;
                }
            } catch (_) { /* 跨域或未定义 */ }
            window.location.href = relativeFallback || fullPath;
        };

        /* ==================== 返回总地图 ==================== */

        const goBack = () => {
            navigateTo('pages/entertainment/map/index.html', 'index.html');
        };

        /* ==================== 渲染地点列表 ==================== */

        const renderList = () => {
            try {
                const state = Cake && Cake.store && Cake.store.state;
                if (!state) throw new Error('无法读取当前游戏状态');

                const energy = Math.max(0, Math.min(100, num(state.energy, 0)));
                if (energyEl) energyEl.innerText = energy;

                const locs = (typeof Cake.getRegionLocations === 'function')
                    ? Cake.getRegionLocations(REGION_ID)
                    : Cake.REGION_TOWN;

                if (!locs || Object.keys(locs).length === 0) {
                    throw new Error('城镇地点数据为空！请检查地点文件的加载');
                }

                let html = '';
                for (const [key, loc] of Object.entries(locs)) {
                    if (!loc) continue;

                    html += `
                        <div class="loc-item" data-loc="${key}">
                            <div class="loc-info">
                                <span class="loc-emoji">${loc.emoji || '📍'}</span>
                                <div class="loc-text">
                                    <span class="loc-name">${loc.name || key}</span>
                                    <span class="loc-desc">${loc.desc || '未知的区域'}</span>
                                </div>
                            </div>
                            <span class="loc-meta">进入 ▶</span>
                        </div>
                    `;
                }

                if (html === '') {
                    html = '<div style="color:#888; text-align:center;">当前没有可去的地点...</div>';
                }
                locListEl.innerHTML = html;

            } catch (err) {
                locListEl.innerHTML = `
                    <div style="color: red; padding: 15px; background: #ffe4e1; border-radius: 10px;">
                        <strong>⚠️ 渲染失败：</strong><br>${err.message || err}
                    </div>`;
            }
        };

        /* ==================== 事件绑定 ==================== */

        const bindClick = () => {
            const btnBack = $('btnBack');
            if (btnBack && !btnBack.dataset.bound) {
                btnBack.dataset.bound = 'true';
                btnBack.addEventListener('click', goBack);
            }

            if (locListEl && !locListEl.dataset.bound) {
                locListEl.dataset.bound = 'true';
                locListEl.addEventListener('click', (e) => {
                    const item = e.target.closest('.loc-item');
                    if (!item) return;

                    const locKey = item.dataset.loc;

                    // ⭐ 进入「地点详情页」，而不是直接散步
                    navigateTo(
                        `pages/entertainment/map/location.html?region=${REGION_ID}&loc=${locKey}`,
                        `location.html?region=${REGION_ID}&loc=${locKey}`
                    );
                });
            }
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            const engine = getCake();

            if (engine && engine.store && engine.store.state) {
                Cake = engine;
                window.Cake = engine;
                bindClick();
                renderList();
                return;
            }

            if (++tries >= MAX_TRIES) {
                if (locListEl) {
                    locListEl.innerHTML = `
                        <div style="color: red; padding: 15px; background: #ffe4e1; border-radius: 10px;">
                            <strong>⚠️ 无法连接游戏引擎：</strong><br>父页面 Cake 未就绪，请刷新重试。
                        </div>`;
                }
                return;
            }

            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
