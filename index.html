<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>甜蜜物语 - 开始</title>
    <style>
        /* 暖奶油/棕烘焙主题（对齐新版设计语言） */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #fff8ef 0%, #f7ecdc 40%, #fffdf8 100%); min-height: 100vh; min-height: 100dvh; color: #4a2c17; }
        #app-root { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .start-card { background: #fffdf8; width: 100%; max-width: 500px; padding: 40px 30px; border-radius: 24px; border: 1px solid #f0dcc0; box-shadow: 0 10px 30px rgba(180, 120, 60, 0.20); text-align: center; animation: fadeInUp 0.6s ease-out; }
        .game-header h1 { color: #b3304a; font-size: 32px; margin-bottom: 8px; }
        .game-header .subtitle { color: #b08a6a; font-size: 14px; margin-bottom: 24px; font-weight: bold; }
        .game-intro { background: #f7ecdc; padding: 16px; border-radius: 16px; margin-bottom: 24px; }
        .game-intro p { color: #6b4226; font-size: 14px; line-height: 1.8; text-align: left; }
        .game-intro strong { color: #e04a63; }
        .avatar-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; background: #f7ecdc; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; transition: all 0.2s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
        .avatar-option:focus-visible { outline: 3px solid #e04a63; outline-offset: 2px; }
        .avatar-option.selected { border-color: #e04a63; background: #ffe9ef; box-shadow: 0 0 15px rgba(224, 74, 99, 0.35); transform: scale(1.1); }
        .input-group { text-align: left; margin-bottom: 16px; }
        .input-group label { display: block; font-size: 14px; font-weight: bold; color: #8a5a44; margin-bottom: 8px; margin-top: 16px; }
        .input-group label:first-child { margin-top: 0; }
        .input-group input { width: 100%; padding: 14px 16px; border: 2px solid #f0dcc0; border-radius: 12px; font-size: 16px; background: #fffdf8; color: #4a2c17; transition: all 0.3s ease; }
        .input-group input:focus { outline: none; border-color: #e04a63; background: #fff; box-shadow: 0 0 0 4px rgba(224, 74, 99, 0.15); }
        .form-error { display: none; margin-bottom: 12px; padding: 10px 14px; background: #fdecea; border: 1px solid #e6a5a5; border-radius: 10px; color: #c62828; font-size: 13px; line-height: 1.5; text-align: left; }
        .form-error.show { display: block; }
        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .button-group button { width: 100%; padding: 16px; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        .btn-start { background: #e04a63; color: white; box-shadow: 0 4px 15px rgba(224, 74, 99, 0.4); }
        .btn-start:active { transform: scale(0.98); }
        .btn-continue { background: #fffdf8; color: #e04a63; border: 2px solid #e04a63 !important; }
        .btn-continue:active { background: #f7ecdc; transform: scale(0.98); }
        .btn-start:focus-visible, .btn-continue:focus-visible { outline: 3px solid #b3304a; outline-offset: 2px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #app-loading { position: fixed; inset: 0; z-index: 9998; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: linear-gradient(135deg, #fff8ef 0%, #f7ecdc 40%, #fffdf8 100%); color: #4a2c17; transition: opacity .3s ease; }
        #loading-bar-wrap { width: 220px; height: 8px; background: rgba(224, 74, 99, .18); border-radius: 999px; overflow: hidden; }
        #loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #e04a63, #b3304a); transition: width .25s ease; }
        #loading-text { font: 14px/1.5 system-ui, sans-serif; color: #8a5a44; }
    </style>
</head>
<body>

    <div id="app-root" aria-busy="true">
        <main class="start-card">
            <div class="game-header">
                <h1>🍰 甜蜜物语</h1>
                <div class="subtitle">✨ 女性向 · 高自由度蛋糕店模拟器 ✨</div>
            </div>
            <div class="game-intro">
                <p>你刚刚接手了街角一间小小的蛋糕店。<br>
                在这里，你可以<strong>自由烘焙每一款蛋糕</strong>、<strong>随心装饰你的店铺</strong>、邂逅温柔的邻居们，甚至——谈一场甜甜的恋爱。💕<br>
                你的故事，由你亲手书写。</p>
            </div>
            <div class="avatar-group" id="avatarGroup" role="radiogroup" aria-label="选择头像">
                <div class="avatar-option selected" role="radio" tabindex="0"  aria-checked="true"  aria-label="女生（马尾）" data-avatar="girl1">👧🏻</div>
                <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" aria-label="女生（短发）" data-avatar="girl2">👩🏻</div>
                <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" aria-label="男生" data-avatar="boy1">👦🏻</div>
                <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" aria-label="蛋糕吉祥物" data-avatar="cake">🧁</div>
            </div>
            <div class="input-group">
                <label for="playerName">你的名字</label>
                <input id="playerName" type="text" maxlength="12" placeholder="给自己起个名字吧" value="小甜心" autocomplete="off" enterkeyhint="done">
                <label for="shopName">店铺名字</label>
                <input id="shopName" type="text" maxlength="12" placeholder="给蛋糕店起个名字" value="甜蜜小屋" autocomplete="off" enterkeyhint="done">
            </div>
            <div class="form-error" id="formError" role="alert" aria-live="assertive"></div>
            <div class="button-group">
                <button class="btn-start" id="btnStart" type="button">开始新游戏</button>
                <button class="btn-continue" id="btnContinue" type="button" style="display:none;">继续游戏</button>
            </div>
        </main>
    </div>

    <div id="app-loading" role="status" aria-live="polite" aria-label="应用加载中">
        <div id="loading-text">初始化中…</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>

    <!-- 兜底脚本：错误捕获 / 超时 / 无 JS 降级 -->
    <script>
    (function () {
        'use strict';
        var LOADING_TIMEOUT = 10000;
        var SOFT_COMPLETE_DELAY = 3000;
        var LOADING_FADE = 300;

        var loadingEl   = document.getElementById('app-loading');
        var loadingBar  = document.getElementById('loading-bar');
        var loadingText = document.getElementById('loading-text');
        var rootEl      = document.getElementById('app-root');

        var isLoaded = false, isFailed = false;

        function hideError() {}
        function showError(msg) { console.error(msg); }
        function clearTimers() {}

        window.appLoadingProgress = function (pct, text) {
            if (isLoaded) return;
            var p = Math.max(0, Math.min(100, Number(pct) || 0));
            if (loadingBar) loadingBar.style.width = p + '%';
            if (loadingText && text) loadingText.textContent = text;
        };
        window.appLoadingComplete = function () {
            if (isLoaded) return;
            isLoaded = true;
            if (loadingBar) loadingBar.style.width = '100%';
            if (loadingEl) {
                loadingEl.style.opacity = '0';
                setTimeout(function () { loadingEl.style.display = 'none'; }, LOADING_FADE);
            }
            if (rootEl) rootEl.setAttribute('aria-busy', 'false');
        };
        
        setTimeout(function () {
            if (document.querySelector('.start-card')) {
                window.appLoadingComplete();
            }
        }, SOFT_COMPLETE_DELAY);
    })();
    </script>

    <!-- 👈 极简加载：不引入任何游戏核心引擎，只加载页面路由 -->
    <script type="module" src="js/pages/index.js"></script>

</body>
</html>
