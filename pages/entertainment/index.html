<script>
(() => {
    'use strict';
    
    const $ = (id) => document.getElementById(id);
    const energyEl = $('energy');
    const btnRest  = $('btnRest');
    const btnGoMap = $('btnGoMap');

    const updateUI = () => {
        const G = window.parent.Game || window.Game;
        if (!G || !G.state) return;
        
        energyEl.innerText = G.state.energy;
        
        if (G.state.energy >= 100) btnRest.classList.add('disabled');
        else btnRest.classList.remove('disabled');

        if (G.state.energy < 8) btnGoMap.classList.add('disabled');
        else btnGoMap.classList.remove('disabled');
    };

    btnRest.addEventListener('click', () => {
        const G = window.parent.Game || window.Game;
        if (!G || !G.state || G.state.energy >= 100) return;
        G.rest(); 
        setTimeout(updateUI, 100);
    });

    // 🌟 核心修复：调用父页面的统一路由，绝不使用 window.location.href
    btnGoMap.addEventListener('click', (e) => {
        e.preventDefault();
        
        const G = window.parent.Game || window.Game;
        if (!G || !G.state || G.state.energy < 8) return;
        
        if (window.parent.HostRouter && window.parent.HostRouter.navigateTo) {
            window.parent.HostRouter.navigateTo('pages/entertainment/map.html');
        } else {
            // 如果父页面没有提供，说明拦截器没写好，利用正常的 a 标签 href 跳转
            window.location.href = 'map.html'; 
        }
    });

    setInterval(updateUI, 500);
})();
</script>
