<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; font-family: sans-serif; }
        #app-loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff0f5; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            color: #d6336c; font-weight: bold; font-size: 18px;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- 初始加载动画 -->
    <div id="app-loading">🍰 正在烘焙你的甜蜜物语...</div>

    <!-- 所有的结构（header, nav, iframe）都将由 JS 动态生成 -->
    <div id="app-root"></div>

    <!-- 🚀 唯一启动入口 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
