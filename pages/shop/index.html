<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺经营</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 16px;
            color: var(--text-main);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .shop-shell {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .shop-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .shop-status {
            margin-bottom: 12px;
            min-height: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .shop-status.error {
            color: #d9363e;
            font-weight: bold;
        }

        .shop-status.success {
            color: #1f9d67;
            font-weight: bold;
        }

        .shop-card {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(255, 186, 205, 0.6);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 14px rgba(255, 144, 170, 0.08);
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .shelf-item {
            padding: 12px;
            border: 1px solid var(--pink-100);
            border-radius: 12px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 150px;
        }

        .shelf-item .emoji {
            font-size: 28px;
            text-align: center;
        }

        .shelf-item .name {
            font-weight: 700;
            text-align: center;
            color: var(--pink-600);
        }

        .shelf-item .meta {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .shelf-item .actions {
            margin-top: auto;
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .small-btn {
            border: none;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            background: var(--pink-100);
            color: var(--pink-700);
            transition: 0.2s;
        }

        .small-btn:hover {
            filter: brightness(0.98);
        }

        .small-btn.primary {
            background: var(--pink-500);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 28px 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="shop-shell">
        <div class="shop-header">
            <h2>🏪 店铺经营</h2>
            <button id="toggleShopBtn" class="small-btn primary" type="button">加载中...</button>
        </div>

        <div id="shopStatus" class="shop-status">⏳ 正在加载店铺数据...</div>

        <div id="shop-shelf" class="shop-card">
            <div class="empty-state">正在等待引擎加载...</div>
        </div>
    </div>

    <script src="../boot-safe.js"></script>
    <script type="module" src="../../js/actions/shop/index.js"></script>

    <!-- 页面渲染逻辑（已拆分到独立文件，减小 HTML 体积） -->
    <script src="page.js"></script>
</body>
</html>
