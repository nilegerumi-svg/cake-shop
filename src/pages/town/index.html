<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小镇 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .town-head { text-align: left; margin: 4px 0 10px; }
  .town-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .town-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .map {
    position: relative; width: 100%; height: 360px;
    background: linear-gradient(160deg, #fdf3e3 0%, #f7ecdc 60%, #f2e4cf 100%);
    border: 1px solid #f0dcc0; border-radius: 18px; overflow: hidden;
  }
  .map-marker {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: #fffdf8; border: 1px solid #f0dcc0; border-radius: 12px;
    padding: 4px 6px; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 6px rgba(180,120,60,.12);
  }
  .map-marker:active, .map-marker.active { background: #ffe9ef; border-color: #e04a63; }
  .map-marker .mk-emoji { font-size: 20px; line-height: 1; }
  .map-marker .mk-label { font-size: 9px; color: #6b4226; font-weight: bold; white-space: nowrap; }
  .detail { margin-top: 12px; background: #fffdf8; border: 1px solid #f0dcc0; border-radius: 16px; padding: 14px 16px; }
  .detail h3 { color: #4a2c17; font-size: 16px; margin: 0 0 4px; }
  .detail .tag { color: #e04a63; font-size: 12px; font-weight: bold; }
  .detail .desc { color: #6b4226; font-size: 13px; line-height: 1.6; margin: 8px 0; }
  .detail .go { background: #e04a63; color: #fff; border: none; border-radius: 20px; padding: 9px 20px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
  .zone-title { color: #8a5a44; font-size: 13px; font-weight: bold; margin: 10px 0 6px; }
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #4a2c17; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载小镇地图...</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() {
    try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {}
    return window.Cake || null;
  }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function pick(arr) { return Array.isArray(arr) && arr.length ? arr[Math.floor(Math.random() * arr.length)] : ''; }
  function toast(msg) {
    const t = document.getElementById('toast');
    if (!t) return; t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t.__timer); t.__timer = setTimeout(() => { t.style.opacity = '0'; }, 2000);
  }
  let selected = null;

  function render() {
    const Cake = getCake();
    const el = document.getElementById('content');
    if (!el) return;
    const locs = Cake?.WORLD_LOCATIONS;
    if (!locs) return;
    const state = Cake.store.state;

    let html = `<div class="town-head"><h2>🏘️ 小镇地图</h2><p class="muted">第 ${state.time?.day || 1} 天 · ⚡ ${state.energy ?? 0}/${state.maxEnergy ?? 100} · 点击地点查看</p></div>`;
    html += `<div class="map" id="map" role="group" aria-label="小镇地图">`;
    for (const [id, l] of Object.entries(locs)) {
      const x = l.x || (10 + Math.random() * 80) + '%';
      const y = l.y || (10 + Math.random() * 80) + '%';
      html += `<button type="button" class="map-marker" data-loc="${esc(id)}" style="left:${x};top:${y};" aria-label="${esc(l.name)} ${esc(l.tag || '')}">
        <span class="mk-emoji" aria-hidden="true">${l.emoji || '📍'}</span><span class="mk-label">${esc(l.name)}</span>
      </button>`;
    }
    html += `</div>`;
    html += `<div class="detail" id="detail"><div class="muted">👆 点击地图上的地点查看详情</div></div>`;
    el.innerHTML = html;
  }

  function showDetail(id) {
    const Cake = getCake();
    const loc = Cake?.WORLD_LOCATIONS?.[id];
    const d = document.getElementById('detail');
    if (!loc || !d) return;
    selected = id;
    d.innerHTML = `<h3>${loc.emoji || '📍'} ${esc(loc.name)}</h3>
      <div class="tag">${esc(loc.tag || '')} · ${loc.zone === 'private' ? '私人区域' : '公共区域'}</div>
      <div class="desc">${esc(loc.desc || '')}</div>
      <button type="button" class="go" data-visit="${esc(id)}">🚶 前往</button>`;
    document.querySelectorAll('.map-marker').forEach(b => b.classList.toggle('active', b.dataset.loc === id));
  }

  document.addEventListener('click', (e) => {
    const mk = e.target.closest('[data-loc]');
    if (mk) { showDetail(mk.dataset.loc); return; }
    const go = e.target.closest('[data-visit]');
    if (!go) return;
    const Cake = getCake();
    const loc = Cake?.WORLD_LOCATIONS?.[go.dataset.visit];
    if (!loc) return;
    if ((Cake.store.state.energy ?? 0) < 3) { toast('⚡ 精力不足，去休息一下吧'); return; }
    Cake.store.state.energy = Math.max(0, (Cake.store.state.energy ?? 0) - 3);
    Cake.addLog?.(`${loc.emoji || '📍'} 你来到了【${loc.name}】：${loc.desc || ''}`);
    if (Cake.refreshPage) Cake.refreshPage();
    toast('👣 你来到了' + loc.name);
    render();
  });

  if (window.safePageBoot) {
    window.safePageBoot.waitForCake(() => { render(); if (typeof getCake().initPage === 'function') getCake().initPage('town', render, false); },
      { timeout: 15000, required: g => !!(g && g.store?.state && g.WORLD_LOCATIONS), onTimeout: () => '游戏引擎加载超时，请刷新页面' });
  } else if (getCake()) { render(); }
})();
</script>
</body>
</html>
