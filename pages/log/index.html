<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小店日记</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        background: #fffaf0;
        color: #666;
        font-size: 14px;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .log-header {
        flex: 0 0 auto;
        padding: 10px 14px 8px;
        background: #fffaf0;
        border-bottom: 1px solid #ffe4e1;
    }
    .log-title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
    }
    .log-title {
        color: #ff6b81;
        font-weight: bold;
        font-size: 15px;
    }
    .log-count {
        color: #c99;
        font-size: 12px;
        white-space: nowrap;
    }
    .log-search {
        width: 100%;
        margin-top: 8px;
        padding: 6px 12px;
        border: 1px solid #ffe0e4;
        border-radius: 999px;
        background: #fff;
        color: #555;
        font-size: 13px;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
    }
    .log-search:focus {
        border-color: #ffb3c1;
        box-shadow: 0 0 0 3px rgba(255, 107, 129, .12);
    }

    .log-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 14px 28px;
        overscroll-behavior: contain;
    }
    .day-group { margin-bottom: 14px; }
    .day-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 0;
        color: #ff6b81;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
    }
    .day-head .day-count {
        color: #c99;
        font-weight: normal;
        font-size: 11px;
    }
    .day-head .day-arrow {
        margin-left: auto;
        color: #c99;
        font-size: 12px;
    }
    .day-body {
        margin-left: 4px;
        padding-left: 10px;
        border-left: 2px solid #ffe4e1;
    }
    .log-entry {
        margin: 6px 0;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
    }
    .log-entry mark {
        background: #ffe08a;
        color: inherit;
        border-radius: 2px;
        padding: 0 1px;
    }
    .empty {
        text-align: center;
        color: #bbb;
        margin-top: 30px;
        line-height: 1.8;
    }

    .load-more {
        display: block;
        width: 100%;
        margin: 10px 0 0;
        padding: 7px;
        border: 1px dashed #ffd0d8;
        border-radius: 8px;
        background: #fff;
        color: #ff8fa3;
        font-size: 12px;
        cursor: pointer;
    }
    .load-more:hover { background: #fff5f7; }
    .load-more[hidden] { display: none; }

    .jump-btn {
        position: fixed;
        right: 14px;
        bottom: 14px;
        padding: 5px 12px;
        border: none;
        border-radius: 999px;
        background: #ff6b81;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(255, 107, 129, .35);
        opacity: .92;
        display: none;
    }
    .jump-btn.show { display: block; }
    .jump-btn:active { transform: scale(.97); }

    /* 运行时日志（来自父页面 console 镜像） */
    .runtime-group {
        margin-bottom: 14px;
        border: 1px dashed #ffd0d8;
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
    }
    .runtime-head {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #c97a8a;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
    }
    .runtime-head .runtime-count {
        color: #c99;
        font-weight: normal;
        font-size: 11px;
    }
    .runtime-head .runtime-arrow {
        margin-left: auto;
        color: #c99;
        font-size: 12px;
    }
    .runtime-clear {
        margin-left: 8px;
        padding: 2px 8px;
        border: 1px solid #ffd0d8;
        border-radius: 999px;
        background: #fff5f7;
        color: #ff6b81;
        font-size: 11px;
        cursor: pointer;
    }
    .runtime-clear:hover { background: #ffe4e8; }
    .runtime-body {
        margin-top: 6px;
        max-height: 160px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
    }
    .runtime-body.hidden { display: none; }
    .runtime-entry {
        padding: 2px 0;
        border-bottom: 1px solid #fff0f2;
        word-break: break-word;
    }
    .runtime-entry.info  { color: #4a7a8a; }
    .runtime-entry.warn  { color: #b07a00; background: #fffbea; }
    .runtime-entry.error { color: #c81e3f; background: #fff0f5; }
</style>
</head>
<body>
    <div class="log-header">
        <div class="log-title-row">
            <span class="log-title">📜 小店日记</span>
            <span class="log-count" id="logCount">共 0 条</span>
        </div>
        <input id="logSearch" class="log-search" type="search"
               placeholder="搜索日记内容或天数…" autocomplete="off">
    </div>

    <div class="log-list" id="logList">
        <div id="runtimeBody"></div>
        <div id="listBody"></div>
        <button id="loadMore" class="load-more" type="button" hidden>加载更早的日记</button>
    </div>

    <button id="jumpBtn" class="jump-btn" type="button">有新日记 ↑</button>

<script>
(() => {
    'use strict';

    const PAGE = 200;
    const TOP_THRESHOLD = 24;
    const RETRY_MAX = 100;
    const SEARCH_DEBOUNCE = 120;
    const RUNTIME_MAX = 500;
    const RUNTIME_DISPLAY_MAX = 100;

    const logList = document.getElementById('logList');
    const listBody = document.getElementById('listBody');
    const runtimeBody = document.getElementById('runtimeBody');
    const countEl = document.getElementById('logCount');
    const searchInput = document.getElementById('logSearch');
    const loadMoreBtn = document.getElementById('loadMore');
    const jumpBtn = document.getElementById('jumpBtn');

    const state = {
        logs: [],
        sig: null,
        query: '',
        collapsed: new Set(),
        groups: [],
        nextIndex: 0,
        pendingNew: false,
        runtimeLogs: [],
        runtimeCollapsed: false
    };

    const el = (tag, cls) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        return node;
    };

    function getCake() {
        try {
            const p = window.parent;
            if (!p || p === window) return window.Cake || null;
            return p.Cake || null;
        } catch (e) {
            return window.Cake || null;
        }
    }

    function getStore() {
        const Cake = getCake();
        return Cake && Cake.store ? Cake.store : null;
    }

    function getLogs() {
        const store = getStore();
        const logs = store && store.state ? store.state.log : null;
        return Array.isArray(logs) ? logs : [];
    }

    function signature(logs) {
        if (!logs.length) return '0';
        const last = logs[logs.length - 1];
        if (!last) return logs.length + '|?';
        return logs.length + '|' + (last.day == null ? '' : last.day) +
               '|' + (last.text == null ? '' : last.text);
    }

    function compareDay(a, b) {
        const na = Number(a);
        const nb = Number(b);
        const va = !isNaN(na);
        const vb = !isNaN(nb);
        if (va && vb) return nb - na;
        if (va) return -1;
        if (vb) return 1;
        return String(b).localeCompare(String(a), 'zh-Hans-CN');
    }

    function appendHighlighted(parent, text, query) {
        const q = query.trim();
        if (!q) {
            parent.appendChild(document.createTextNode(text));
            return;
        }
        const lowerText = text.toLowerCase();
        const lowerQ = q.toLowerCase();
        const len = lowerQ.length;
        let from = 0;
        let idx;
        while ((idx = lowerText.indexOf(lowerQ, from)) !== -1) {
            if (idx > from) {
                parent.appendChild(document.createTextNode(text.slice(from, idx)));
            }
            const mark = document.createElement('mark');
            mark.textContent = text.slice(idx, idx + len);
            parent.appendChild(mark);
            from = idx + len;
        }
        if (from < text.length) {
            parent.appendChild(document.createTextNode(text.slice(from)));
        }
    }

    function buildGroups(logs, query) {
        const q = query.trim().toLowerCase();
        const map = new Map();

        for (let i = 0; i < logs.length; i++) {
            const item = logs[i];
            if (!item) continue;

            const text = item.text == null ? '' : String(item.text);
            const day = item.day;

            if (q) {
                const hitText = text.toLowerCase().indexOf(q) !== -1;
                const hitDay = String(day == null ? '' : day).toLowerCase().indexOf(q) !== -1;
                if (!hitText && !hitDay) continue;
            }

            const key = String(day == null ? '' : day);
            let arr = map.get(key);
            if (!arr) {
                arr = [];
                map.set(key, arr);
            }
            arr.push({ day: day, text: text, index: i });
        }

        const keys = Array.from(map.keys());
        keys.sort(compareDay);

        return keys.map((key) => {
            const items = map.get(key);
            items.sort((a, b) => b.index - a.index);
            return { day: items[0].day, key: key, items: items };
        });
    }

    function renderGroup(group) {
        const wrap = el('div', 'day-group');

        const head = el('div', 'day-head');
        const title = el('span');
        title.textContent = '第' + (group.day == null ? '?' : group.day) + '天';

        const cnt = el('span', 'day-count');
        cnt.textContent = group.items.length + ' 条';

        const arrow = el('span', 'day-arrow');

        head.append(title, cnt, arrow);

        const body = el('div', 'day-body');
        for (let i = 0; i < group.items.length; i++) {
            const row = el('div', 'log-entry');
            appendHighlighted(row, group.items[i].text, state.query);
            body.appendChild(row);
        }

        const isCollapsed = !state.query.trim() && state.collapsed.has(group.key);
        body.hidden = isCollapsed;
        arrow.textContent = isCollapsed ? '▸' : '▾';

        head.addEventListener('click', () => {
            const willCollapse = !body.hidden;
            body.hidden = willCollapse;
            arrow.textContent = willCollapse ? '▸' : '▾';
            if (state.query.trim()) return;
            if (willCollapse) state.collapsed.add(group.key);
            else state.collapsed.delete(group.key);
        });

        wrap.append(head, body);
        return wrap;
    }

    function renderGroups(fromIndex, limit) {
        const groups = state.groups;
        const frag = document.createDocumentFragment();
        let count = 0;
        let i = fromIndex;

        while (i < groups.length && count < limit) {
            frag.appendChild(renderGroup(groups[i]));
            count += groups[i].items.length;
            i++;
        }

        return { frag: frag, nextIndex: i };
    }

    function updateCount() {
        const total = state.logs.length;
        if (state.query.trim()) {
            let matched = 0;
            for (let i = 0; i < state.groups.length; i++) {
                matched += state.groups[i].items.length;
            }
            countEl.textContent = '匹配 ' + matched + ' / 共 ' + total + ' 条';
        } else {
            countEl.textContent = '共 ' + total + ' 条';
        }
    }

    function updateLoadMore() {
        loadMoreBtn.hidden = state.nextIndex >= state.groups.length;
    }

    function showEmpty(msg) {
        const box = el('div', 'empty');
        box.textContent = msg;
        listBody.replaceChildren(box);
        loadMoreBtn.hidden = true;
    }

    function rebuild(opts) {
        const toTop = !!(opts && opts.toTop);

        state.groups = buildGroups(state.logs, state.query);
        state.nextIndex = 0;

        if (state.groups.length === 0) {
            showEmpty(state.query.trim() ? '没有匹配的日记～' : '暂无记录，快去创造故事吧～');
            updateCount();
            if (toTop) logList.scrollTop = 0;
            return;
        }

        const result = renderGroups(0, PAGE);
        state.nextIndex = result.nextIndex;
        listBody.replaceChildren(result.frag);

        updateLoadMore();
        updateCount();
        if (toTop) logList.scrollTop = 0;
    }

    function appendMore() {
        if (state.nextIndex >= state.groups.length) return;
        const result = renderGroups(state.nextIndex, PAGE);
        listBody.appendChild(result.frag);
        state.nextIndex = result.nextIndex;
        updateLoadMore();
    }

    /* ---------------- 运行时日志（来自父页面 console 镜像） ---------------- */

    function renderRuntime() {
        if (!runtimeBody) return;
        runtimeBody.replaceChildren();

        const logs = state.runtimeLogs;
        if (logs.length === 0) return;

        const wrap = el('div', 'runtime-group');

        const head = el('div', 'runtime-head');
        const title = el('span');
        title.textContent = '🛠️ 系统日志';

        const cnt = el('span', 'runtime-count');
        cnt.textContent = logs.length + ' 条';

        const clearBtn = el('button', 'runtime-clear');
        clearBtn.type = 'button';
        clearBtn.textContent = '清空';
        clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            state.runtimeLogs = [];
            renderRuntime();
        });

        const arrow = el('span', 'runtime-arrow');
        arrow.textContent = state.runtimeCollapsed ? '▸' : '▾';

        head.append(title, cnt, clearBtn, arrow);

        const body = el('div', 'runtime-body');
        if (state.runtimeCollapsed) body.classList.add('hidden');

        const start = Math.max(0, logs.length - RUNTIME_DISPLAY_MAX);
        for (let i = start; i < logs.length; i++) {
            const item = logs[i];
            const row = el('div', 'runtime-entry ' + (item.level || 'info'));
            const t = new Date(item.time || Date.now());
            const hh = String(t.getHours()).padStart(2, '0');
            const mm = String(t.getMinutes()).padStart(2, '0');
            const ss = String(t.getSeconds()).padStart(2, '0');
            row.textContent = `[${hh}:${mm}:${ss}] [${(item.level || 'info').toUpperCase()}] ${item.msg}`;
            body.appendChild(row);
        }

        head.addEventListener('click', () => {
            state.runtimeCollapsed = !state.runtimeCollapsed;
            body.classList.toggle('hidden', state.runtimeCollapsed);
            arrow.textContent = state.runtimeCollapsed ? '▸' : '▾';
        });

        wrap.append(head, body);
        runtimeBody.appendChild(wrap);
    }

    window.addEventListener('message', (e) => {
        if (e.origin !== location.origin) return;
        if (!e.data || typeof e.data !== 'object') return;

        if (e.data.type === 'log') {
            state.runtimeLogs.push({
                level: e.data.level || 'info',
                msg: String(e.data.msg == null ? '' : e.data.msg),
                time: e.data.time || Date.now()
            });
            if (state.runtimeLogs.length > RUNTIME_MAX) {
                state.runtimeLogs.splice(0, state.runtimeLogs.length - RUNTIME_MAX);
            }
            renderRuntime();
        } else if (e.data.type === 'clear') {
            state.runtimeLogs = [];
            renderRuntime();
        }
    });

    /* ---------------- 数据刷新 ---------------- */

    function isNearTop() {
        return logList.scrollTop <= TOP_THRESHOLD;
    }

    function hideJump() {
        state.pendingNew = false;
        jumpBtn.classList.remove('show');
    }

    function refresh(force) {
        const logs = getLogs();
        const sig = signature(logs);

        if (!force && sig === state.sig) return;

        const firstLoad = state.sig === null;
        state.logs = logs;
        state.sig = sig;

        if (force || firstLoad || isNearTop()) {
            hideJump();
            rebuild({ toTop: true });
        } else {
            state.pendingNew = true;
            jumpBtn.classList.add('show');
        }
    }

    /* ---------------- 事件 ---------------- */

    logList.addEventListener('scroll', () => {
        if (state.pendingNew && isNearTop()) {
            hideJump();
            rebuild({ toTop: true });
        }
    }, { passive: true });

    jumpBtn.addEventListener('click', () => {
        refresh(true);
    });

    loadMoreBtn.addEventListener('click', appendMore);

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const logs = getLogs();
            state.logs = logs;
            state.sig = signature(logs);

            state.query = searchInput.value;
            hideJump();
            rebuild({ toTop: true });
        }, SEARCH_DEBOUNCE);
    });

    // 放宽 storage 监听：不依赖硬编码 SAVE_KEY，refresh 内部有签名短路
    window.addEventListener('storage', (e) => {
        if (e.storageArea && e.storageArea !== window.localStorage) return;
        refresh(false);
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh(false);
    });

    window.__cakeShopRefresh = function () {
        refresh(true);
    };

    /* ---------------- 启动 ---------------- */

    (function boot() {
        let attempts = 0;

        (function tryConnect() {
            const store = getStore();
            if (store && store.state) {
                refresh(true);
                renderRuntime();
                return;
            }
            if (++attempts > RETRY_MAX) {
                showEmpty('无法连接到商店数据');
                return;
            }
            setTimeout(tryConnect, 100);
        })();
    })();
})();
</script>
</body>
</html>
