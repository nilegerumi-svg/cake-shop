<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 缘分 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .char-card {
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px;
            padding: 15px; background: #fff; border-radius: 12px; border: 1px solid var(--pink-100);
        }
        .char-card:active { transform: scale(0.98); background: #fff8fa; }
        .char-emoji { font-size: 40px; }
        .char-info { flex: 1; }
        .char-name { font-weight: bold; font-size: 16px; color: var(--text-main); }
        .char-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="card">
            <h2>💕 缘分相遇</h2>
            <p class="muted" style="margin-bottom: 15px;">通过经营和散步邂逅的人，去看看他们吧。</p>
            <div class="grid-2" id="content"></div>
        </div>
    </div>

    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;

        const affLevel = (aff) => {
            if (aff >= 100) return '💖 挚爱';
            if (aff >= 80) return '💗 心动';
            if (aff >= 60) return '💞 亲密';
            if (aff >= 40) return '🤝 朋友';
            if (aff >= 20) return '👋 相识';
            return '🤍 陌生';
        };

        const renderHub = () => {
            const state = Cake.store.state;
            const characters = Cake.CHARACTERS || {};
            const charState = state.characters || {};

            document.getElementById('content').innerHTML = Object.entries(characters).map(([cid, char]) => {
                const cs = charState[cid] || { met: false, affection: 0 };
                
                if (!cs.met) {
                    return `
                    <div class="char-card" style="opacity:0.6; cursor:not-allowed;">
                        <div class="char-emoji">❓</div>
                        <div class="char-info">
                            <div class="char-name">???</div>
                            <div class="char-desc">🔒 尚未相遇</div>
                        </div>
                    </div>`;
                }

                const aff = Math.max(0, Math.min(100, cs.affection || 0));
                return `
                    <div class="char-card" onclick="goDetail('${cid}')">
                        <div class="char-emoji">${char.emoji}</div>
                        <div class="char-info">
                            <div class="char-name">${char.name}</div>
                            <div class="char-desc" style="color:var(--pink-600); font-weight:bold;">
                                ${affLevel(aff)} ${aff}/100
                            </div>
                            <div class="aff-bar" style="height:4px; margin-top:6px;">
                                <div class="aff-fill" style="width:${aff}%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.goDetail = (cid) => {
            window.location.href = `detail.html?id=${cid}`;
        };

        if (typeof Cake.initPage === 'function') Cake.initPage('love', renderHub, false);
    </script>
</body>
</html>
