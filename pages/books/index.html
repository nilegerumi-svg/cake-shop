<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>书房 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .b-head { text-align: left; margin: 4px 0 10px; }
  .b-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .b-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .search { width:100%; box-sizing:border-box; padding:10px 14px; border:2px solid #f0dcc0; border-radius:12px; font-size:14px; background:#fffdf8; color:#4a2c17; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; }
  .b-card { background:#fffdf8; border:1px solid #f0dcc0; border-radius:14px; padding:10px 12px; display:flex; gap:10px; }
  .b-emoji { font-size:26px; line-height:1; }
  .b-body { flex:1; min-width:0; }
  .b-name { font-weight:bold; color:#4a2c17; font-size:14px; }
  .b-desc { font-size:12px; color:#b08a6a; margin-top:2px; }
  .b-recipes { font-size:11px; color:#e04a63; margin-top:4px; font-weight:bold; }
  .b-meta { font-size:11px; color:#b08a6a; margin-top:2px; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载书籍...</div></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() { try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {} return window.Cake || null; }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let q = '';
  function render() {
    const Cake = getCake(); const el = document.getElementById('content');
    if (!el || !Cake) return;
    const B = Cake.BOOKS; if (!B) return;
    const kw = q.trim().toLowerCase();
    const items = Object.values(B).filter(b => !kw || String(b.name || '').toLowerCase().includes(kw))
      .sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh'));
    let html = `<div class="b-head"><h2>📚 书房</h2><p class="muted">共 ${Object.keys(B).length} 本书 · 阅读解锁食谱</p></div>`;
    html += `<input type="search" class="search" id="search" placeholder="搜索书籍…" aria-label="搜索书籍" value="${esc(q)}">`;
    html += `<div class="grid">`;
    if (items.length === 0) html += `<div class="muted">没有找到匹配的书籍</div>`;
    for (const b of items) {
      const recs = (b.recipes || []).map(id => Cake.RECIPES?.[id]?.name || id).join('、');
      html += `<div class="b-card"><span class="b-emoji" aria-hidden="true">${b.emoji || '📖'}</span>
        <span class="b-body"><span class="b-name">${esc(b.name)}</span><span class="b-desc">${esc(b.desc || '')}</span>
        ${recs ? `<span class="b-recipes">📜 解锁：${esc(recs)}</span>` : ''}
        <span class="b-meta">${b.library ? '🏛️ 图书馆借阅' : '🛒 商店购买'} · 💰${b.price ?? 0} · 知识+${b.knowledgeGain ?? 0}</span></span></div>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  }
  document.addEventListener('input', (e) => { if (e.target && e.target.id === 'search') { q = e.target.value; render(); const s = document.getElementById('search'); if (s) s.focus(); } });
  if (window.safePageBoot) window.safePageBoot.waitForCake(() => render(), { timeout:15000, required:g=>!!(g&&g.BOOKS), onTimeout:()=>'书籍加载超时' });
  else if (getCake()) render();
})();
</script>
</body>
</html>
