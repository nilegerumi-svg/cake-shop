<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff0f5; }
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        header, nav { flex: 0 0 auto; z-index: 10; }
        .split-container {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            padding-bottom: calc(var(--footer-h, 70px) + env(safe-area-inset-bottom));
        }
        .main-frame { flex: 1; width: 100%; border: none; background: transparent; min-height: 240px; }
        .log-frame {
            flex: 0 0 clamp(110px, 22vh, 180px);
            width: 100%; border: none; background: #fff;
            border-top: 2px dashed #ffd1dc;
            box-shadow: 0 -4px 10px rgba(255, 143, 163, 0.1);
        }
        iframe { display: block; width: 100%; height: 100%; }
        .action-footer {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px;
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            background: linear-gradient(to top, #fff0f5 80%, transparent);
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; z-index: 100;
        }
        #error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;
            background: rgba(220, 38, 38, 0.95); color: white;
            padding: 10px; font-size: 13px; line-height: 1.4;
            word-break: break-all; pointer-events: none;
            max-height: 40vh; overflow-y: auto; display: none;
        }
        
        /* 🌟 初始加载动画 */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff0f5; z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #d6336c; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>

<div id="error-overlay"></div>

<div class="app-wrapper">
    <header id="header"></header>
    <nav id="navBar"></nav>
    <div class="split-container" style="position: relative;">
        <!-- 🌟 1. 初始清空 src，防止子页面抢跑 -->
        <iframe id="mainFrame" src="about:blank" class="main-frame"></iframe>
        <div id="loading-overlay">🍰 正在准备烘焙引擎...</div>
        
        <iframe id="logFrame" src="pages/log.html" class="log-frame"></iframe>
    </div>
    <div class="action-footer" id="footer"></div>
</div>

<script type="module">
    // 1. 导入核心引擎
    import './js/main.js';

    // 🌟 2. 延迟加载主页（控制优先级）
    // 给 main.js 一点点时间初始化全局状态，然后再塞入真实 src
    setTimeout(() => {
        const mainFrame = document.getElementById('mainFrame');
        const loading = document.getElementById('loading-overlay');
        
        // 此时主引擎已经挂载完毕，可以安全加载 home.html 了
        mainFrame.src = 'pages/home.html';
        
        // 页面加载完成后，隐藏 Loading 遮罩
        mainFrame.onload = () => {
            if (loading) loading.style.display = 'none';
        };
    }, 200); // 等待 200 毫秒确保 Game 对象已生成
</script>

</body>
</html>
