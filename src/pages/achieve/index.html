<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>成就 · 甜蜜物语</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: transparent; padding: 12px; margin: 0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .muted { color: #b08a6a; }
  .ach-head { text-align: left; margin: 4px 0 10px; }
  .ach-head h2 { color: #4a2c17; font-size: 20px; margin: 0 0 2px; }
  .ach-head p { color: #b08a6a; font-size: 13px; margin: 0; }
  .sub-tabs { display:flex; gap:8px; margin-bottom:10px; }
  .sub-tab { flex:1; padding:8px; background:#fffdf8; border:1px solid #f0dcc0; border-radius:12px; font-size:13px; font-weight:bold; color:#b08a6a; cursor:pointer; font-family:inherit; }
  .sub-tab.active { background:#e04a63; color:#fff; border-color:#e04a63; }
  .cat-title { color:#8a5a44; font-size:14px; font-weight:bold; margin:12px 0 8px; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; }
  .ach-card { background:#fffdf8; border:1px solid #f0dcc0; border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .ach-emoji { font-size:26px; line-height:1; }
  .ach-body { flex:1; min-width:0; }
  .ach-name { font-weight:bold; color:#4a2c17; font-size:14px; }
  .ach-desc { font-size:12px; color:#b08a6a; margin-top:2px; }
  .ach-reward { font-size:11px; color:#e04a63; margin-top:3px; font-weight:bold; }
  .count-pill { background:#f7ecdc; color:#8a5a44; border-radius:10px; padding:2px 8px; font-size:11px; font-weight:bold; margin-left:6px; }
</style>
</head>
<body>
<div id="content"><div class="muted" style="margin-top:40px;text-align:center;">⏳ 正在加载成就...</div></div>

<script src="../../pages/boot-safe.js"></script>
<script>
(() => {
  'use strict';
  function getCake() {
    try { if (window.parent && window.parent !== window && window.parent.Cake) return window.parent.Cake; } catch (_) {}
    return window.Cake || null;
  }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function rewardText(Cake, rewards) {
    if (!Array.isArray(rewards)) return '';
    const parts = rewards.map(r => {
      if (r.type === 'coins') return '💰 ' + r.amount;
      if (r.type === 'ingredient') { const ing = Cake.INGREDIENTS?.[r.ingId]; return (ing?.emoji || '📦') + ' ' + (ing?.name || r.ingId) + '×' + r.amount; }
      return r.type + ' ' + (r.amount || '');
    });
    return parts.join(' · ');
  }
  let tab = 'ach';

  function render() {
    const Cake = getCake();
    const el = document.getElementById('content');
    if (!el) return;
    const ACH = Cake?.ACHIEVEMENTS_NEW;
    const MS = Cake?.MILESTONES_NEW;
    if (!ACH) return;
    const na = Object.keys(ACH).length, nm = MS ? Object.keys(MS).length : 0;

    let html = `<div class="ach-head"><h2>🏆 成就</h2><p class="muted">烘焙成就与里程碑</p></div>`;
    html += `<div class="sub-tabs" role="tablist" aria-label="成就分类">
      <button type="button" class="sub-tab ${tab==='ach'?'active':''}" data-tab="ach" role="tab" aria-selected="${tab==='ach'}">🏅 成就（${na}）</button>
      <button type="button" class="sub-tab ${tab==='ms'?'active':''}" data-tab="ms" role="tab" aria-selected="${tab==='ms'}">🎖️ 里程碑（${nm}）</button>
    </div>`;

    if (tab === 'ach') {
      const CATS = { bake: '🍰 烘焙', shop: '🏪 经营', town: '🏘️ 小镇', fate: '💕 缘分' };
      const groups = {};
      for (const a of Object.values(ACH)) { (groups[a.category || 'other'] = groups[a.category || 'other'] || []).push(a); }
      for (const c of Object.keys(CATS).concat(Object.keys(groups).filter(k => !CATS[k]))) {
        const list = groups[c];
        if (!list || !list.length) continue;
        html += `<div class="cat-title">${CATS[c] || c} <span class="count-pill">${list.length}</span></div><div class="grid">`;
        for (const a of list) {
          html += `<div class="ach-card"><span class="ach-emoji" aria-hidden="true">${a.emoji || '🏅'}</span>
            <span class="ach-body"><span class="ach-name">${esc(a.name)}</span><span class="ach-desc">${esc(a.desc || '')}</span></span></div>`;
        }
        html += `</div>`;
      }
    } else {
      html += `<div class="cat-title">🎖️ 里程碑 <span class="count-pill">${nm}</span></div><div class="grid">`;
      for (const m of Object.values(MS || {})) {
        html += `<div class="ach-card"><span class="ach-emoji" aria-hidden="true">${m.emoji || '🎖️'}</span>
          <span class="ach-body"><span class="ach-name">${esc(m.name)}</span><span class="ach-desc">${esc(m.desc || '')}</span>
          <span class="ach-reward">🎁 ${esc(rewardText(Cake, m.rewards))}</span></span></div>`;
      }
      html += `</div>`;
    }
    el.innerHTML = html;
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; render(); }
  });

  if (window.safePageBoot) {
    window.safePageBoot.waitForCake(() => { render(); if (typeof getCake().initPage === 'function') getCake().initPage('achieve', render, false); },
      { timeout: 15000, required: g => !!(g && g.ACHIEVEMENTS_NEW), onTimeout: () => '游戏引擎加载超时，请刷新页面' });
  } else if (getCake()) { render(); }
})();
</script>
</body>
</html>
