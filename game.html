<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/game-shell.css">

    <script type="module" src="js/host/monitor/index.js"></script>
    <style>
        .iframe-error-overlay {
            position: absolute; inset: 0; background: rgba(255,248,239,0.97); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #c62828; font-family: sans-serif; text-align: center; padding: 20px;
        }
        .iframe-error-overlay h3 { margin: 0 0 10px 0; font-size: 18px; }
        .iframe-error-overlay p { margin: 0; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>
    <h1 class="sr-only">甜蜜物语 - 游戏主界面</h1>

    <div id="app-loading" role="status" aria-live="polite" aria-label="游戏加载中">
        <div class="loading-title">🍰 甜蜜物语</div>
        <div id="loading-text" class="loading-text">正在准备启动...</div>
        <div class="loading-bar-wrap">
            <div id="loading-bar" class="loading-bar-fill"></div>
        </div>
        <div id="loading-file" class="loading-detail">正在读取：初始化…</div>
        <div id="loading-remain" class="loading-detail">剩余文件：— 个</div>
    </div>

    <div class="app-wrapper">
        <header id="header" class="app-header" role="banner"></header>

        <main class="main-pane" role="main">
            <iframe id="mainFrame" title="游戏内容" src="pages/home/index.html" class="main-frame"></iframe>
        </main>

        <nav id="tabBar" class="tab-bar" role="navigation" aria-label="主标签"></nav>
    </div>

    <script src="js/host/log-bridge.js"></script>
    <script src="js/host/a11y-mode.js"></script>
    <script type="module" src="js/host/game-shell.js"></script>

    <script>
        (function() {
            'use strict';

            // ===== iframe 高度自适应：子页面拼成纵向长条，随外壳整页滚动 =====
            function autoResizeIframe(iframe) {
                if (!iframe || iframe.dataset.resized) return;
                iframe.dataset.resized = 'true';

                let scheduled = false;
                const sync = () => {
                    scheduled = false;
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        let h = 0;
                        if (doc && doc.documentElement) {
                            h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
                        }
                        if (h > 0) iframe.style.height = h + 'px';
                    } catch (_) {}
                };
                const scheduleSync = () => {
                    if (scheduled) return;
                    scheduled = true;
                    requestAnimationFrame(sync);
                };
                iframe.addEventListener('load', scheduleSync);
                try {
                    const doc = iframe.contentDocument;
                    if (doc && doc.body) {
                        const ro = new ResizeObserver(() => scheduleSync());
                        ro.observe(doc.body);
                        if (doc.documentElement) ro.observe(doc.documentElement);
                        iframe.__resizeObserver = ro;
                    }
                } catch (_) {}
                window.addEventListener('resize', scheduleSync);
                scheduleSync();
            }
            autoResizeIframe(document.getElementById('mainFrame'));

            function checkIframeLoaded(iframeId, pageName) {
                const iframe = document.getElementById(iframeId);
                if (!iframe) return;
                iframe.addEventListener('load', () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        const bodyText = doc.body ? doc.body.innerText.toLowerCase() : '';
                        const titleText = doc.title ? doc.title.toLowerCase() : '';
                        const htmlContent = doc.documentElement ? doc.documentElement.innerHTML.toLowerCase() : '';
                        if (bodyText.includes('404') || titleText.includes('404') || bodyText.includes('file not found')) {
                            showIframeError(iframe, `${pageName} (404 找不到文件)`, iframe.src);
                        } else if (!doc.body || (doc.body.children.length === 0 && htmlContent.length < 200)) {
                            showIframeError(iframe, `${pageName} (内容为空)`, '页面似乎只有空标签，请检查 HTML 结构是否有误。');
                        }
                    } catch (err) {
                        console.warn(`无法读取 ${iframeId} 的内容`, err);
                    }
                });
            }
            function showIframeError(iframe, title, detail) {
                const parent = iframe.parentNode;
                if (!parent) return;
                if (parent.querySelector('.iframe-error-overlay')) return;
                const overlay = document.createElement('div');
                overlay.className = 'iframe-error-overlay';
                overlay.innerHTML = `<h3>⚠️ ${title}</h3><p style="margin-bottom:10px;max-width:100%;">${detail}</p>
                    <button type="button" style="padding:8px 20px;border:none;border-radius:20px;background:#e04a63;color:white;font-weight:bold;cursor:pointer;">关闭</button>`;
                overlay.querySelector('button').addEventListener('click', () => overlay.remove());
                parent.appendChild(overlay);
            }
            document.addEventListener('DOMContentLoaded', () => {
                checkIframeLoaded('mainFrame', '主页 iframe 加载失败');
            });
        })();
    </script>
</body>
</html>
