<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 经营策略</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--pink-600); cursor: pointer; font-weight: bold; }
        .rate-btn { flex: 1; padding: 8px 0; border: 1px solid var(--pink-200); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-muted); transition: 0.2s; }
        .rate-btn.active { background: var(--pink-400); color: #fff; border-color: var(--pink-400); font-weight: bold; box-shadow: 0 2px 8px rgba(255,143,163,0.3); }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="back-btn" onclick="history.back()">← 返回店铺</div>
        <div class="content" id="content"></div>
    </div>
    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        const render = () => {
            const state = Cake.store.state;
            const shop = state.shop;
            const priceRate = num(shop.priceRate, 1.0);
            const cleanliness = num(shop.stats.cleanliness, 100);

            const RATES = [
                { val: 0.8, label: '亲民' },
                { val: 1.0, label: '标准' },
                { val: 1.2, label: '精品' },
                { val: 1.5, label: '奢华' }
            ];

            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h3>🧹 店铺卫生</h3>
                    <p class="muted" style="margin-bottom:10px;">卫生度影响顾客进店概率，每日自然下降。</p>
                    <div style="font-size:24px; font-weight:bold; color:var(--pink-600); text-align:center; margin-bottom:10px;">${cleanliness}%</div>
                    <button class="small gold" style="width:100%; padding:10px;" ${cleanliness >= 100 ? 'disabled' : ''} onclick="Cake.cleanShop()">
                        ${cleanliness >= 100 ? '✨ 已经很干净了' : '开始打扫 (耗时30分钟)'}
                    </button>
                </div>

                <div class="card">
                    <h3>📈 定价策略</h3>
                    <p class="muted" style="margin-bottom:10px;">定价越高，单笔利润越大，但顾客购买意愿会降低。</p>
                    <div style="display:flex; gap:8px;">
                        ${RATES.map(r => `
                            <button class="rate-btn ${priceRate === r.val ? 'active' : ''}" onclick="setRate(${r.val})">
                                ${r.label}<br>${r.val}x
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        window.setRate = (val) => {
            Cake.store.state.shop.priceRate = val;
            Cake.saveState();
            render(); // 局部刷新
            if (Cake.emit) Cake.emit('refresh_ui'); // 通知全局
        };

        if (typeof Cake.initPage === 'function') Cake.initPage('shop', render, false);
    </script>
</body>
</html>
