<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的应用</title>
    <style>
        /* loading 屏：monitor.js 就绪后会自动淡出并隐藏 */
        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #1b1b2f;
            color: #fff;
            transition: opacity .3s;
        }
        #loading-bar-wrap {
            width: 220px; height: 8px;
            background: rgba(255,255,255,.15);
            border-radius: 999px; overflow: hidden;
        }
        #loading-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg,#ff6b81,#ffa502);
            transition: width .25s;
        }
        #loading-text { font: 14px/1.5 system-ui; }
    </style>
</head>
<body>
    <!-- 应用外壳挂载点：monitor.js 会把 header/nav/iframe/footer 动态塞进来 -->
    <div id="app-root"></div>

    <!-- loading 屏（必须含 loading-text / loading-bar 两个 id） -->
    <div id="app-loading">
        <div id="loading-text">初始化中…</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>

    <script src="js/monitor.js"></script>
</body>
</html>
