<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 烘焙 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script src="../js/core/store.js"></script>
    <script src="../js/data/ingredients.js"></script>
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/bundles.js"></script>
    <script src="../js/data/characters.js"></script>
    <script src="../js/data/events.js"></script>
    <script src="../js/data/shop-config.js"></script>
    <script src="../js/data/achievements.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/modal.js"></script>
    <script src="../js/core/effects.js"></script>
    <script src="../js/core/render.js"></script>
    <script src="../js/actions/bakery.js"></script>
    <script src="../js/actions/shop.js"></script>
    <script src="../js/actions/social.js"></script>
    <script src="../js/actions/system.js"></script>
    <script src="../js/shared.js"></script>
    <script>
    (() => {
        'use strict';

        const contentEl = document.getElementById('content');
        const ENERGY_PER_BAKE = 20;
        const MAX_BATCH = 5;

        let Game = null;
        let tries = 0;
        const MAX_TRIES = 100;

        /* ==================== 单个配方卡片 ==================== */

        const renderRecipeCard = (name, recipe, state) => {
            const ingredients = state.ingredients || {};
            const cakes = state.cakes || {};
            const energy = Number(state.energy) || 0;
            const ing = recipe.ing || {};
            const ingKeys = Object.keys(ing);

            const lackIng = ingKeys.some((k) => (ingredients[k] || 0) < ing[k]);
            const lackEnergy = energy < ENERGY_PER_BAKE;
            const canBake = !lackIng && !lackEnergy;

            const maxByEnergy = Math.floor(energy / ENERGY_PER_BAKE);
            const maxByIng = ingKeys.length > 0
                ? Math.min(...ingKeys.map((k) => Math.floor((ingredients[k] || 0) / ing[k])))
                : Infinity;
            const batchCount = Math.min(MAX_BATCH, maxByEnergy, maxByIng);
            const canBatch = batchCount >= 2;

            const label = canBake
                ? '🔥 烘焙'
                : (lackEnergy && lackIng
                    ? '⚡🌾 精力与食材不足'
                    : (lackEnergy ? '⚡ 精力不足' : '🌾 食材不足'));

            const stock = cakes[name] || 0;

            const batchBtn = canBatch
                ? `<button type="button" class="small secondary"
                       data-bake="${name}" data-count="${batchCount}">🔥 批量×${batchCount}</button>`
                : '';

            return `<div class="item-card">
                <span class="item-emoji">${recipe.emoji || '🍰'}</span>
                <span class="item-name">${name} <span class="muted">（库存 ${stock}）</span></span>
                <span class="item-desc">${recipe.desc || ''}</span>
                <div class="ing-row">${Game.ingredientTags(ing)}</div>
                <span class="item-meta">基础价 ${recipe.price}元 · 声望+${recipe.rep}</span>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button type="button" class="small"
                        ${canBake ? '' : 'disabled'}
                        data-bake="${name}">${label}</button>
                    ${batchBtn}
                </div>
            </div>`;
        };

        /* ==================== 食材库存 ==================== */

        const renderIngredientStock = (ingredients) =>
            Object.entries(Game.INGREDIENTS || {}).map(([key, item]) => {
                const count = ingredients[key] || 0;
                return `<span class="ing-tag ${count > 0 ? 'ok' : 'lack'}">${item.emoji}${item.name} ×${count}</span>`;
            }).join('');

        /* ==================== 烘焙页渲染 ==================== */

        const renderBake = () => {
            const state = Game.state || {};
            const recipes = state.recipes || {};
            const ingredients = state.ingredients || {};

            const unlocked = Object.keys(recipes)
                .filter((name) => Game.RECIPES && Game.RECIPES[name]);

            const cardsHtml = unlocked.length === 0
                ? '<p class="muted">还没有解锁任何配方，先去「配方」页研发吧！</p>'
                : unlocked.map((name) => renderRecipeCard(name, Game.RECIPES[name], state)).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <h2>🎂 烘焙蛋糕</h2>
                    <p class="muted">每次烘焙消耗 <b>${ENERGY_PER_BAKE}</b> 精力。点击烘焙制作 1 个蛋糕用于售卖或送礼。</p>
                    <div class="grid-2" style="margin-top:12px;">${cardsHtml}</div>
                    <h3>📦 当前食材</h3>
                    <div class="ing-row">${renderIngredientStock(ingredients)}</div>
                </div>`;
        };

        /* ==================== 事件委托 ==================== */

        const bindClick = () => {
            contentEl.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-bake]');
                if (!btn || btn.disabled) return;

                const { bake: name, count } = btn.dataset;
                if (count !== undefined) {
                    Game.bakeCake(name, Number(count));
                } else {
                    Game.bakeCake(name);
                }
            });
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            let G = null;
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    G = window.parent.Game;
                }
            } catch (_) { /* 跨域 */ }
            if (!G) G = window.Game || null;

            if (G && G.state && typeof G.initPage === 'function') {
                Game = G;
                window.Game = G;          // 内联 onclick 等场景可用
                bindClick();
                G.initPage('bake', renderBake);
                return;
            }

            if (++tries >= MAX_TRIES) {
                contentEl.innerHTML = '<div style="color:red;padding:20px;text-align:center;">❌ 游戏引擎加载超时，请刷新重试</div>';
                return;
            }
            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
