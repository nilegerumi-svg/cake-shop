<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/game-shell.css">
    
    <!-- 👈 把监视器作为模块提前引入，接管全站错误 -->
    <script type="module" src="js/host/monitor/index.js"></script>
</head>
<body>
    <div id="app-loading">
        <div class="loading-title">🍰 甜蜜物语</div>
        <div id="loading-text" class="loading-text">正在准备启动...</div>
        <div class="loading-bar-wrap">
            <div id="loading-bar" class="loading-bar-fill"></div>
        </div>
    </div>

    <div class="app-wrapper" id="app-root">
        <header id="header"></header>
        <nav id="navBar"></nav>
        
        <div class="split-container">
            <iframe id="mainFrame" src="pages/home/index.html" class="main-frame"></iframe>
            <iframe id="logFrame" src="pages/log/index.html" class="log-frame"></iframe>
        </div>
        
        <div class="action-footer" id="footer">
            <div class="footer-btn" onclick="window.footerAction('sleep')">
                <span class="icon">🛌</span><span>睡觉</span>
            </div>
            <div class="footer-btn" onclick="window.footerAction('shop')">
                <span class="icon" id="f-icon-shop">🚪</span><span id="f-text-shop">营业</span>
            </div>
            <div class="footer-btn" style="cursor:default;">
                <span class="icon">📅</span><span class="footer-time" id="f-time">Day 1 08:00</span>
            </div>
        </div>
    </div>

    <!-- 日志桥接（必须尽早执行以劫持 console） -->
    <script src="js/host/log-bridge.js"></script>
    
    <!-- 底栏交互逻辑 -->
    <script type="module" src="js/host/game-shell.js"></script>
</body>
</html>
