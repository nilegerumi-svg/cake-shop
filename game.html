<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 甜蜜物语</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 1. 重置布局，去掉所有的侧边栏限制 */
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #fff0f5;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 2. 顶部和导航栏保持原样 */
        header, nav {
            flex: 0 0 auto;
            z-index: 10;
        }

        /* 3. 核心：嵌套用的 iframe 画框 */
        .iframe-container {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
            /* 防止内容被底部的悬浮按钮挡住，给个底边距 */
            padding-bottom: 20px; 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 顶部状态栏和导航（由 shared.js 自动渲染） -->
    <header id="header"></header>
    <nav id="navBar"></nav>

    <!-- 内容画框：默认加载 pages/home.html -->
    <iframe id="mainFrame" src="pages/home.html" class="iframe-container"></iframe>

    <!-- 底部操作区 -->
    <div class="action-footer" id="footer"></div>
</div>

<!-- 保留你所有的基础 JS -->
<script src="js/core/store.js"></script>
<script src="js/data/ingredients.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/bundles.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/shop-config.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/effects.js"></script>
<script src="js/core/render.js"></script>
<script src="js/actions/bakery.js"></script>
<script src="js/actions/shop.js"></script>
<script src="js/actions/social.js"></script>
<script src="js/actions/system.js"></script>
<script src="js/shared.js"></script>

<script>
    // 初始化主框架
    Game.initPage('home', () => {}, true); 

    // 拦截导航栏的点击，让页面在 iframe 里切换，而不是整个网页刷新
    document.addEventListener('click', function(e) {
        // 如果点击的是导航里的链接
        if (e.target.closest('nav a')) {
            const link = e.target.closest('nav a');
            const href = link.getAttribute('href');
            
            // 如果链接是 # 或者是空的，就不管
            if (href && href !== '#') {
                e.preventDefault(); // 阻止整个页面跳转
                
                // 修改画框的地址，如果是外部页面，就加上 pages/ 前缀
                let targetUrl = href;
                if (!href.includes('pages/')) {
                    targetUrl = 'pages/' + href;
                }
                document.getElementById('mainFrame').src = targetUrl;
            }
        }
    });
</script>
</body>
</html>
