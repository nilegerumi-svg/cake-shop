<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的应用</title>
    <style>
        /* loading 屏：monitor.js 就绪后会自动淡出并隐藏 */
        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #1b1b2f;
            color: #fff;
            transition: opacity .3s;
        }
        #loading-bar-wrap {
            width: 220px; height: 8px;
            background: rgba(255,255,255,.15);
            border-radius: 999px; overflow: hidden;
        }
        #loading-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg,#ff6b81,#ffa502);
            transition: width .25s;
        }
        #loading-text { font: 14px/1.5 system-ui; }

        /* 加载失败提示样式 */
        #loading-error {
            display: none;
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(255,107,129,.2);
            border: 1px solid #ff6b81;
            border-radius: 6px;
            color: #ffb8c6;
            font: 13px/1.5 system-ui;
            text-align: center;
        }
        #loading-error.show { display: block; }
        #loading-retry {
            margin-top: 8px;
            padding: 6px 16px;
            background: transparent;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font: 13px system-ui;
        }
        #loading-retry:hover { background: rgba(255,255,255,.1); }

        /* 无 JS 降级提示 */
        .noscript-warning {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1b1b2f;
            color: #fff;
            font: 16px/1.6 system-ui;
            text-align: center;
            padding: 20px;
        }

        /* 尊重用户浅色模式偏好 */
        @media (prefers-color-scheme: light) {
            #app-loading {
                background: #f5f5fa;
                color: #1b1b2f;
            }
            #loading-bar-wrap { background: rgba(0,0,0,.1); }
            #loading-error {
                background: rgba(255,107,129,.1);
                color: #c81e3f;
            }
            #loading-retry {
                border-color: rgba(0,0,0,.3);
                color: #1b1b2f;
            }
        }
    </style>
</head>
<body>
    <!-- 应用外壳挂载点 -->
    <div id="app-root" aria-busy="true"></div>

    <!-- loading 屏 -->
    <div id="app-loading" role="status" aria-label="应用加载中">
        <div id="loading-text">初始化中…</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
        <!-- 加载失败提示（默认隐藏） -->
        <div id="loading-error" role="alert">
            <span id="loading-error-message">加载超时，请检查网络后重试</span>
            <br>
            <button id="loading-retry" onclick="location.reload()">重新加载</button>
        </div>
    </div>

    <!-- JS 被禁用时的降级提示 -->
    <noscript>
        <div class="noscript-warning">
            您的浏览器已禁用 JavaScript，无法运行本应用。<br>
            请启用 JavaScript 后刷新页面。
        </div>
    </noscript>

    <!-- 加载超时与错误兜底：必须先于 monitor.js 注册，确保能捕获其加载失败 -->
    <script>
        (function() {
            'use strict';

            var LOADING_TIMEOUT = 15000; // 15秒超时
            var loadingEl = document.getElementById('app-loading');
            var errorEl = document.getElementById('loading-error');
            var errorMessageEl = document.getElementById('loading-error-message');
            var rootEl = document.getElementById('app-root');
            var isLoaded = false;
            var isFailed = false;
            var timeoutId = null;

            // 隐藏错误提示
            function hideError() {
                if (errorEl) {
                    errorEl.classList.remove('show');
                }
            }

            // 显示错误提示（带自定义消息）
            function showError(message) {
                if (errorMessageEl && message) {
                    errorMessageEl.textContent = message;
                }
                if (errorEl) {
                    errorEl.classList.add('show');
                }
            }

            // 清理超时定时器
            function clearTimer() {
                if (timeoutId !== null) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
            }

            // 标记加载完成（供 monitor.js 调用）
            // 修复：允许从 failed 状态恢复，只要尚未成功加载
            window.appLoadingComplete = function() {
                if (isLoaded) return; // 已加载则忽略重复调用

                // 从失败状态恢复：重置标志、隐藏错误、清理定时器
                if (isFailed) {
                    isFailed = false;
                    hideError();
                }

                isLoaded = true;
                clearTimer();

                if (loadingEl) {
                    loadingEl.style.opacity = '0';
                    setTimeout(function() {
                        loadingEl.style.display = 'none';
                    }, 300);
                }
                if (rootEl) {
                    rootEl.setAttribute('aria-busy', 'false');
                }
            };

            // 标记加载失败（供 monitor.js 在捕获到错误时调用，可选）
            // 修复：失败后仍允许后续恢复成功
            window.appLoadingFail = function(message) {
                if (isLoaded || isFailed) return;

                isFailed = true;
                clearTimer();
                showError(message || '应用加载失败，请刷新重试');
            };

            // 超时检测：15秒后如果还没加载完成，显示错误提示
            // 修复：超时后仍允许后续恢复成功（不永久锁死）
            timeoutId = setTimeout(function() {
                if (!isLoaded && !isFailed) {
                    isFailed = true;
                    showError('加载超时，请检查网络后重试');
                }
            }, LOADING_TIMEOUT);

            // 全局错误捕获：只捕获资源加载错误，忽略运行时错误避免误报
            // 修复：此脚本先于 monitor.js 执行，确保能捕获其加载失败
            window.addEventListener('error', function(e) {
                // 只处理资源加载失败（target 是元素），忽略 JS 运行时错误
                if (e.target && e.target !== window && e.target.tagName) {
                    // 如果是 monitor.js 加载失败，标记失败
                    if (e.target.tagName === 'SCRIPT' && e.target.src.indexOf('monitor.js') !== -1) {
                        if (window.appLoadingFail) {
                            window.appLoadingFail('核心脚本加载失败，请刷新重试');
                        }
                    }
                }
            }, true); // 使用捕获阶段，确保能接收到资源错误

            // 暴露清理函数（兼容旧代码）
            window.clearLoadingTimeout = clearTimer;
        })();
    </script>

    <!-- 使用 defer 确保 DOM 就绪后执行，减少竞态 -->
    <script src="js/monitor.js" defer></script>
</body>
</html>
