<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>娱乐与外出</title>
    <style>
        body { background: transparent; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); text-align: center; width: 100%; max-width: 340px; }
        h2 { color: #ff6b81; margin-top: 20px; margin-bottom: 10px; font-size: 18px; }
        
        .energy-box { background: #fff9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #ffd1dc; font-weight: bold; }
        
        /* 主按钮通用样式 */
        button { background: #ff8fa3; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; margin-top: 10px; width: 100%; cursor: pointer; font-weight: bold; transition: transform 0.1s, background 0.2s; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #btnWalk { background: #7ec4cf; }

        /* 内联展开的地点选择区 */
        #walkOptions {
            display: none; /* 默认隐藏 */
            grid-template-columns: 1fr 1fr; /* 2x2 网格 */
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ffd1dc;
            animation: slideDown 0.2s ease-out forwards;
        }
        
        /* 地点小按钮 */
        #walkOptions button {
            background: #a8e6cf; 
            color: #4a3b3f; 
            margin-top: 0; 
            padding: 10px; 
            font-size: 14px; 
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(168, 230, 207, 0.3);
        }
        
        /* 取消按钮横跨两列 */
        #walkOptions button.cancel { 
            background: #f0f0f0; 
            color: #888; 
            grid-column: span 2; 
            margin-top: 4px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="energy-box">
            ⚡ 当前体力：<span id="energy">--</span>/100
        </div>

        <h2>🎮 休息区</h2>
        <button id="btnRest" type="button">休息一下</button>

        <h2>🛴 外出区</h2>
        <button id="btnWalk" type="button">出门散步</button>
        
        <!-- 地点选择区直接嵌在卡片里，不再用弹窗 -->
        <div id="walkOptions">
            <button type="button" data-location="home">🏡 家园周围</button>
            <button type="button" data-location="park">🌳 街心公园</button>
            <button type="button" data-location="street">🛍️ 商业街</button>
            <button type="button" data-location="river">🌊 河边</button>
            <button type="button" class="cancel" id="btnCancelWalk">取消</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        const G = window.parent.Game || window.Game;
        const $ = (id) => document.getElementById(id);

        const energyEl   = $('energy');
        const btnRest    = $('btnRest');
        const btnWalk    = $('btnWalk');
        const mainCard   = $('mainCard');
        const walkOptions = $('walkOptions');
        const btnCancel  = $('btnCancelWalk');

        const updateUI = () => {
            if (!G || !G.state) return;
            energyEl.innerText = G.state.energy;
            btnRest.disabled = G.state.energy >= 100;
            btnWalk.disabled = G.state.energy < 8;
            
            // 如果体力低于散步要求，自动收起地点选项
            if (G.state.energy < 8) {
                walkOptions.style.display = 'none';
            }
        };

        const doRest = () => {
            if (!G || !G.state) return;
            G.rest();
            setTimeout(updateUI, 100);
        };

        const toggleWalkOptions = () => {
            if (!G || !G.state) return;
            if (G.state.energy < 8) {
                alert('体力不足 8 点，无法散步啦！');
                return;
            }
            
            // 切换显示状态（丝滑展开/收起）
            const isHidden = walkOptions.style.display !== 'grid';
            walkOptions.style.display = isHidden ? 'grid' : 'none';
        };

        const doWalk = (location) => {
            if (!G || !G.state) return;
            walkOptions.style.display = 'none'; // 选完立刻收起
            G.walk(location);
            setTimeout(updateUI, 100);
        };

        /* ---------------- 事件绑定 ---------------- */

        btnRest.addEventListener('click', doRest);
        btnWalk.addEventListener('click', toggleWalkOptions);
        btnCancel.addEventListener('click', () => { walkOptions.style.display = 'none'; });

        walkOptions.querySelectorAll('[data-location]').forEach((btn) => {
            btn.addEventListener('click', () => doWalk(btn.dataset.location));
        });

        /* ---------------- 页面加载 ---------------- */

        window.addEventListener('load', () => {
            if (!G || !G.state) {
                mainCard.innerHTML = `<h2 style="color:red">⚠️ 数据加载失败</h2><p>请从主页面进入</p>`;
                return;
            }
            updateUI();
        });
    })();
    </script>
</body>
</html>
