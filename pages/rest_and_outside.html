<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>娱乐与外出</title>
    <style>
        body { background: transparent; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; color: #4a3b3f; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.3); text-align: center; width: 100%; max-width: 320px; }
        h2 { color: #ff6b81; margin-top: 20px; margin-bottom: 10px; font-size: 18px; }
        .energy-box { background: #fff9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #ffd1dc; font-weight: bold; }
        button { background: #ff8fa3; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; margin-top: 10px; width: 100%; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #btnWalk { background: #7ec4cf; }

        #walkModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 300px; text-align: center; }
        .modal-content button { background: #a8e6cf; color: #4a3b3f; margin-bottom: 8px; padding: 10px; font-size: 14px; }
        .modal-content button.cancel { background: #eee; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="energy-box">
            ⚡ 当前体力：<span id="energy">--</span>/100
        </div>

        <h2>🎮 休息区</h2>
        <button id="btnRest" type="button">休息一下</button>

        <h2>🛴 外出区</h2>
        <button id="btnWalk" type="button">出门散步</button>
    </div>

    <div id="walkModal">
        <div class="modal-content">
            <h3 style="color: #ff6b81; margin-top: 0;">去哪里散步？</h3>
            <button type="button" data-location="home">🏡 家园周围</button>
            <button type="button" data-location="park">🌳 街心公园</button>
            <button type="button" data-location="street">🛍️ 商业街</button>
            <button type="button" data-location="river">🌊 河边</button>
            <button type="button" class="cancel" id="btnCancelWalk">取消</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        const G = window.parent.Game || window.Game;
        const $ = (id) => document.getElementById(id);

        const energyEl   = $('energy');
        const btnRest    = $('btnRest');
        const btnWalk    = $('btnWalk');
        const mainCard   = $('mainCard');
        const walkModal  = $('walkModal');

        const updateUI = () => {
            if (!G || !G.state) return;
            energyEl.innerText = G.state.energy;
            btnRest.disabled = G.state.energy >= 100;
            btnWalk.disabled = G.state.energy < 8;
        };

        const doRest = () => {
            if (!G || !G.state) return;
            G.rest();
            setTimeout(updateUI, 100);
        };

        const openWalkModal = () => {
            if (!G || !G.state) return;
            if (G.state.energy < 8) {
                alert('体力不足 8 点，无法散步啦！');
                return;
            }
            walkModal.style.display = 'flex';
        };

        const closeWalkModal = () => {
            walkModal.style.display = 'none';
        };

        const doWalk = (location) => {
            if (!G || !G.state) return;
            closeWalkModal();
            G.walk(location);
            setTimeout(updateUI, 100);
        };

        /* ---------------- 事件绑定 ---------------- */

        btnRest.addEventListener('click', doRest);
        btnWalk.addEventListener('click', openWalkModal);

        walkModal.querySelectorAll('[data-location]').forEach((btn) => {
            btn.addEventListener('click', () => doWalk(btn.dataset.location));
        });

        $('btnCancelWalk').addEventListener('click', closeWalkModal);

        /* ---------------- 页面加载 ---------------- */

        window.addEventListener('load', () => {
            if (!G || !G.state) {
                mainCard.innerHTML = `<h2 style="color:red">⚠️ 数据加载失败</h2><p>请从主页面进入</p>`;
                return;
            }
            updateUI();
        });
    })();
    </script>
</body>
</html>
