<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 店铺大厅 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .nav-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #fff; border-radius: 12px; margin-bottom: 12px; cursor: pointer; border: 1px solid var(--pink-100); transition: 0.2s; }
        .nav-card:active { transform: scale(0.98); background: #fff8fa; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-icon { font-size: 28px; }
        .nav-title { font-weight: bold; color: var(--pink-600); font-size: 15px; }
        .nav-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .arrow { color: var(--pink-300); font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        const render = () => {
            const state = Cake.store.state;
            const shop = state.shop;
            const isOpen = shop.isOpen;
            
            // 统计
            let totalFoods = 0;
            for (const key in state.foods) {
                totalFoods += (state.foods[key].perfect || 0) + (state.foods[key].good || 0) + (state.foods[key].normal || 0);
            }

            document.getElementById('content').innerHTML = `
                <div class="card text-center" style="text-align: center;">
                    <h2>🏪 ${shop.name}</h2>
                    <div style="display:flex; justify-content:center; gap:15px; margin: 10px 0; font-weight:bold;">
                        <span>🧹 卫生: ${num(shop.stats.cleanliness, 100)}%</span>
                        <span>⭐ 声望: ${num(shop.stats.reputation, 0)}</span>
                    </div>

                    <button id="btn-toggle" class="small ${isOpen ? 'secondary' : 'gold'}" style="width: 80%; font-size: 16px; padding: 15px; margin-top: 15px;">
                        ${isOpen ? '🔕 打烊休息' : '🚪 开门营业'}
                    </button>
                </div>

                <h3>📂 经营管理</h3>
                <div class="nav-card" onclick="go('manage.html')">
                    <div class="nav-left">
                        <span class="nav-icon">📈</span>
                        <div>
                            <div class="nav-title">经营策略</div>
                            <div class="nav-desc">调整定价、打扫卫生</div>
                        </div>
                    </div>
                    <span class="arrow">→</span>
                </div>

                <div class="nav-card" onclick="go('shelf.html')">
                    <div class="nav-left">
                        <span class="nav-icon">🍰</span>
                        <div>
                            <div class="nav-title">成品货架</div>
                            <div class="nav-desc">当前存货 ${totalFoods} 个</div>
                        </div>
                    </div>
                    <span class="arrow">→</span>
                </div>
            `;

            document.getElementById('btn-toggle').onclick = () => {
                const res = Cake.toggleShopStatus();
                if (res && res.success === false) alert(res.message);
            };
        };

        window.go = (page) => window.location.href = page;
        if (typeof Cake.initPage === 'function') Cake.initPage('shop', render, false);
    </script>
</body>
</html>
