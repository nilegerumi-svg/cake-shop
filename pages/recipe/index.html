<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 配方 · 甜蜜物语</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>
    <script src="../js/core/store.js"></script>
    <script src="../js/data/ingredients.js"></script>
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/bundles.js"></script>
    <script src="../js/data/characters.js"></script>
    <script src="../js/data/events.js"></script>
    <script src="../js/data/shop-config.js"></script>
    <script src="../js/data/achievements.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/modal.js"></script>
    <script src="../js/core/effects.js"></script>
    <script src="../js/core/render.js"></script>
    <script src="../js/actions/bakery.js"></script>
    <script src="../js/actions/shop.js"></script>
    <script src="../js/actions/social.js"></script>
    <script src="../js/actions/system.js"></script>
    <script src="../js/shared.js"></script>
    <script>
    (() => {
        'use strict';

        const contentEl = document.getElementById('content');

        let Game = null;
        let tries = 0;
        const MAX_TRIES = 100;

        const num = (v, fallback = 0) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        const renderRecipe = () => {
            const s = Game.state || {};
            const recipesAll = Game.RECIPES || {};
            const unlockedMap = s.recipes || {};

            const cards = Object.entries(recipesAll).map(([name, recipe]) => {
                const unlocked = !!unlockedMap[name];
                const need = recipe.unlock || { money: 0, rep: 0, shop: 1 };
                const needShop = num(need.shop, 1);
                const money = num(s.money, 0);
                const rep = num(s.reputation, 0);
                const shopLevel = num(s.shopLevel, 1);
                const energy = num(s.energy, 0);

                const canResearch =
                    !unlocked &&
                    money >= need.money &&
                    rep >= need.rep &&
                    shopLevel >= needShop &&
                    energy >= 15;

                return `<div class="item-card" style="${unlocked ? 'border-color:#ffd54f;background:#fffde7;' : ''}">
                    <span class="item-emoji">${recipe.emoji || '🍰'}</span>
                    <span class="item-name">${name} ${unlocked ? '✅ 已解锁' : '🔒 未解锁'}</span>
                    <span class="item-desc">${recipe.desc || ''}</span>
                    <div class="ing-row">${Game.ingredientTags(recipe.ing || {})}</div>
                    <span class="item-meta">售价 ${recipe.price}元 · 声望+${recipe.rep}</span>
                    ${unlocked ? '<span class="item-meta" style="color:#388e3c;">已掌握配方</span>' : `
                        <div class="ing-row" style="margin-top:2px;">
                            <span class="ing-tag ${money >= need.money ? 'ok' : 'lack'}">💰 ${need.money}元</span>
                            <span class="ing-tag ${rep >= need.rep ? 'ok' : 'lack'}">⭐ 声望${need.rep}</span>
                            <span class="ing-tag ${shopLevel >= needShop ? 'ok' : 'lack'}">🏪 Lv.${needShop}</span>
                            <span class="ing-tag ${energy >= 15 ? 'ok' : 'lack'}">⚡ 15精力</span>
                        </div>
                        <button type="button" class="small" ${canResearch ? '' : 'disabled'} data-recipe="${name}">${canResearch ? '🔬 研发配方' : '❌ 条件不足'}</button>
                    `}
                </div>`;
            }).join('');

            contentEl.innerHTML = `
                <div class="card">
                    <h2>📖 配方图鉴</h2>
                    <p class="muted">研发新配方消耗 15 精力，需要满足金钱、声望与店铺等级条件。</p>
                    <div class="grid-2" style="margin-top:12px;">${cards}</div>
                </div>`;
        };

        /* ==================== 事件委托 ==================== */

        const bindClick = () => {
            contentEl.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-recipe]');
                if (!btn || btn.disabled) return;
                Game.researchRecipe(btn.dataset.recipe);
            });
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            let G = null;
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    G = window.parent.Game;
                }
            } catch (_) {}
            if (!G) G = window.Game || null;

            if (G && G.state && typeof G.initPage === 'function') {
                Game = G;
                window.Game = G;
                bindClick();
                G.initPage('recipe', renderRecipe);
                return;
            }

            if (++tries >= MAX_TRIES) {
                contentEl.innerHTML = '<div style="color:red;padding:20px;text-align:center;">❌ 游戏引擎加载超时，请刷新重试</div>';
                return;
            }
            setTimeout(boot, 100);
        };

        boot();
    })();
    </script>
</body>
</html>
