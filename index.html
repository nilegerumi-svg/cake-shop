<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>甜蜜物语 - 开始</title>
    <style>
        /* ============ 基础重置 ============ */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe8ee 40%, #fff5f7 100%);
            min-height: 100vh;
            min-height: 100dvh;
            color: #4a3b3f;
        }

        #app-root {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        /* ============ 开始卡片 ============ */
        .start-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }
        .game-header h1 { color: #ff6b81; font-size: 32px; margin-bottom: 8px; }
        .game-header .subtitle { color: #ff9eaa; font-size: 14px; margin-bottom: 24px; font-weight: bold; }
        .game-intro { background: #fff0f5; padding: 16px; border-radius: 16px; margin-bottom: 24px; }
        .game-intro p { color: #666; font-size: 14px; line-height: 1.8; text-align: left; }
        .game-intro strong { color: #ff6b81; }

        .avatar-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
        .avatar-option {
            width: 60px; height: 60px; border-radius: 50%; background: #fff0f5;
            border: 3px solid transparent; display: flex; align-items: center;
            justify-content: center; font-size: 30px; cursor: pointer;
            transition: all 0.2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .avatar-option:focus-visible { outline: 2px solid #ff8fa3; outline-offset: 2px; }
        .avatar-option.selected {
            border-color: #ff6b81; background: #ffe4e8;
            box-shadow: 0 0 15px rgba(255, 107, 129, 0.4); transform: scale(1.1);
        }

        .input-group { text-align: left; margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 14px; font-weight: bold;
            color: #d85c74; margin-bottom: 8px; margin-top: 16px;
        }
        .input-group label:first-child { margin-top: 0; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #ffd1dc;
            border-radius: 12px; font-size: 16px; background: #fafafa; color: #333;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none; border-color: #ff8fa3; background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 143, 163, 0.15);
        }

        .form-error {
            display: none;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: #fff0f5;
            border: 1px solid #ffb8c6;
            border-radius: 10px;
            color: #c81e3f;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
        }
        .form-error.show { display: block; }

        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .button-group button {
            width: 100%; padding: 16px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; -webkit-tap-highlight-color: transparent;
        }
        .btn-start { background: #ff8fa3; color: white; box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4); }
        .btn-start:active { transform: scale(0.98); }
        .btn-continue { background: #ffffff; color: #ff8fa3; border: 2px solid #ff8fa3 !important; }
        .btn-continue:active { background: #fff0f5; transform: scale(0.98); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ loading 屏 ============ */
        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
            background: linear-gradient(135deg, #fff0f5 0%, #ffe8ee 40%, #fff5f7 100%);
            color: #4a3b3f;
            transition: opacity .3s ease;
        }
        #loading-bar-wrap {
            width: 220px; height: 8px;
            background: rgba(255, 143, 163, .2);
            border-radius: 999px; overflow: hidden;
        }
        #loading-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff8fa3, #ff6b81);
            transition: width .25s ease;
        }
        #loading-text {
            font: 14px/1.5 system-ui, sans-serif;
            color: #d85c74;
        }

        #loading-error {
            display: none;
            margin-top: 12px;
            padding: 8px 16px;
            background: #fff0f5;
            border: 1px solid #ffb8c6;
            border-radius: 6px;
            color: #c81e3f;
            font: 13px/1.5 system-ui, sans-serif;
            text-align: center;
            max-width: 80vw;
        }
        #loading-error.show { display: block; }
        #loading-retry {
            margin-top: 8px;
            padding: 6px 16px;
            background: transparent;
            border: 1px solid rgba(200, 30, 63, .4);
            border-radius: 4px;
            color: #c81e3f;
            cursor: pointer;
            font: 13px system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #loading-retry:hover { background: rgba(255, 143, 163, .12); }

        /* ============ 无 JS 降级 ============ */
        .noscript-warning {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff0f5;
            color: #4a3b3f;
            font: 16px/1.6 system-ui, sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
         应用挂载点（开始页）
         - 静态 UI 直接写在 HTML 中，首屏不依赖 JS 也能渲染
         - js/pages/index.js 负责绑定交互 / 读写存档 / 关闭 loading
    ============================================================ -->
    <div id="app-root" aria-busy="true">
        <main class="start-card">
            <div class="game-header">
                <h1>🍰 甜蜜物语</h1>
                <div class="subtitle">✨ 女性向 · 高自由度蛋糕店模拟器 ✨</div>
            </div>

            <div class="game-intro">
                <p>你刚刚接手了街角一间小小的蛋糕店。<br>
                在这里，你可以<strong>自由烘焙每一款蛋糕</strong>、<strong>随心装饰你的店铺</strong>、邂逅温柔的邻居们，甚至——谈一场甜甜的恋爱。💕<br>
                你的故事，由你亲手书写。</p>
            </div>

            <div class="avatar-group" id="avatarGroup" role="radiogroup" aria-label="选择头像">
                <div class="avatar-option selected" role="radio" tabindex="0"  aria-checked="true"  data-avatar="girl1">👧🏻</div>
                <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" data-avatar="girl2">👩🏻</div>
                <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" data-avatar="boy1">👦🏻</div>
                <div class="avatar-option"          role="radio" tabindex="-1" aria-checked="false" data-avatar="cake">🧁</div>
            </div>

            <div class="input-group">
                <label for="playerName">你的名字</label>
                <input id="playerName" type="text" maxlength="12" placeholder="给自己起个名字吧"
                       value="小甜心" autocomplete="off" enterkeyhint="done">
                <label for="shopName">店铺名字</label>
                <input id="shopName" type="text" maxlength="12" placeholder="给蛋糕店起个名字"
                       value="甜蜜小屋" autocomplete="off" enterkeyhint="done">
            </div>

            <div class="form-error" id="formError" role="alert" aria-live="assertive"></div>

            <div class="button-group">
                <button class="btn-start" id="btnStart" type="button">开始新游戏</button>
                <button class="btn-continue" id="btnContinue" type="button" style="display:none;">继续游戏</button>
            </div>
        </main>
    </div>

    <!-- loading 屏 -->
    <div id="app-loading" role="status" aria-live="polite" aria-label="应用加载中">
        <div id="loading-text">初始化中…</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
        <div id="loading-error" role="alert">
            <span id="loading-error-message">加载超时，请检查网络后重试</span>
            <br>
            <button id="loading-retry" type="button">重新加载</button>
        </div>
    </div>

    <noscript>
        <div class="noscript-warning">
            您的浏览器已禁用 JavaScript，无法运行本应用。<br>
            请启用 JavaScript 后刷新页面。
        </div>
    </noscript>

    <!-- ============================================================
         兜底脚本：必须在所有应用脚本之前执行
         - 错误捕获（资源加载失败 / 同步脚本异常 / 未处理 Promise）
         - 超时兜底
         - 暴露 appLoadingComplete / appLoadingFail / appLoadingProgress
         - MutationObserver 自动完成（防 index.js 忘调）
         - 软兜底：3s 内未收到完成信号且静态开始页已就绪 → 自动完成
    ============================================================ -->
    <script>
    (function () {
        'use strict';

        var LOADING_TIMEOUT     = 10000; // 10s 硬超时
        var SOFT_COMPLETE_DELAY = 3000;  // 3s 软兜底
        var LOADING_FADE        = 300;
        var AUTO_COMPLETE_DELAY = 1000;

        var loadingEl   = document.getElementById('app-loading');
        var loadingBar  = document.getElementById('loading-bar');
        var loadingText = document.getElementById('loading-text');
        var errorEl     = document.getElementById('loading-error');
        var errorMsgEl  = document.getElementById('loading-error-message');
        var retryBtn    = document.getElementById('loading-retry');
        var rootEl      = document.getElementById('app-root');

        var isLoaded  = false;
        var isFailed  = false;
        var timeoutId = null;
        var softTimer = null;

        function hideError() {
            if (errorEl) errorEl.classList.remove('show');
        }

        function showError(message) {
            if (errorMsgEl && message) errorMsgEl.textContent = message;
            if (errorEl) errorEl.classList.add('show');
            if (rootEl) rootEl.setAttribute('aria-busy', 'false');
        }

        function clearTimers() {
            if (timeoutId !== null) { clearTimeout(timeoutId); timeoutId = null; }
            if (softTimer !== null) { clearTimeout(softTimer); softTimer = null; }
        }

        // ---------- 对外 API ----------
        window.appLoadingProgress = function (pct, text) {
            if (isLoaded) return;
            var p = Number(pct);
            if (!isFinite(p)) p = 0;
            p = Math.max(0, Math.min(100, p));
            if (loadingBar) loadingBar.style.width = p + '%';
            if (loadingText && text) loadingText.textContent = text;
        };

        window.appLoadingComplete = function () {
            if (isLoaded) return;
            if (isFailed) { isFailed = false; hideError(); }
            isLoaded = true;
            clearTimers();

            if (loadingBar) loadingBar.style.width = '100%';
            if (loadingEl) {
                loadingEl.style.opacity = '0';
                setTimeout(function () {
                    loadingEl.style.display = 'none';
                    loadingEl.setAttribute('aria-hidden', 'true');
                }, LOADING_FADE);
            }
            if (rootEl) rootEl.setAttribute('aria-busy', 'false');
        };

        window.appLoadingFail = function (message) {
            if (isLoaded) return;
            if (isFailed) {
                if (message) showError(message);
                return;
            }
            isFailed = true;
            clearTimers();
            showError(message || '应用加载失败，请刷新重试');
        };

        // 硬超时兜底
        timeoutId = setTimeout(function () {
            timeoutId = null;
            if (!isLoaded && !isFailed) {
                isFailed = true;
                showError('加载超时，请检查网络后重试');
            }
        }, LOADING_TIMEOUT);

        // 软兜底：静态开始页已经在 DOM 里了，如果 3s 内没收到完成信号，
        // 也先让开始页可见（"继续游戏"按钮的显隐可能稍后由 index.js 补上）
        softTimer = setTimeout(function () {
            softTimer = null;
            if (isLoaded || isFailed) return;
            if (document.querySelector('.start-card')) {
                console.warn('[Fallback] 开始页 3s 内未收到完成信号，自动完成加载');
                window.appLoadingComplete();
            }
        }, SOFT_COMPLETE_DELAY);

        // ---------- 错误捕获 ----------
        function srcOf(el) {
            return (el && ((el.getAttribute && el.getAttribute('src')) || el.src)) || '';
        }

        // 兼容完整路径与子路径
        function isCriticalScript(src) {
            return /(?:^|\/)(?:store|state|index)(?:\.min)?\.js(?:\?|$)/.test(src);
        }

        window.addEventListener('error', function (e) {
            var target = e.target;

            if (target && target !== window && target.tagName === 'SCRIPT') {
                var src = srcOf(target);
                if (isCriticalScript(src)) {
                    window.appLoadingFail('核心脚本加载失败，请刷新重试');
                }
                return;
            }

            if ((!target || target === window) && e.filename && isCriticalScript(e.filename)) {
                if (!isLoaded) window.appLoadingFail('页面初始化失败，请刷新重试');
            }
        }, true);

        window.addEventListener('unhandledrejection', function () {
            if (!isLoaded && !isFailed) {
                window.appLoadingFail('页面初始化失败，请刷新重试');
            }
        });

        if (retryBtn) {
            retryBtn.addEventListener('click', function () { window.location.reload(); });
        }

        // ---------- MutationObserver 自动完成 ----------
        if (rootEl && typeof MutationObserver !== 'undefined') {
            var armed = false;
            var mo = new MutationObserver(function () {
                if (armed || isLoaded || isFailed) return;
                armed = true;
                setTimeout(function () {
                    mo.disconnect();
                    window.appLoadingComplete();
                }, AUTO_COMPLETE_DELAY);
            });
            mo.observe(rootEl, { childList: true, subtree: true });
        }

        window.clearLoadingTimeout = clearTimers;
    })();
    </script>

    <!-- ============================================================
         应用脚本（开始页，不加载 monitor.js！）
         执行顺序：store.js → state.js → pages/index.js
         注意：pages/index.js 必须在初始化完成后调用 window.appLoadingComplete()
    ============================================================ -->
    <script src="js/core/store.js"></script>
    <script src="js/core/state.js"></script>
    <script type="module" src="js/pages/index.js"></script>

</body>
</html>
