<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小店日记</title>
    <!-- 全局样式（提供 --pink-* 变量与整体风格） -->
    <link rel="stylesheet" href="../../css/styles.css">
    <!-- 引入拆出去的样式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="log-header">
        <div class="log-title-row">
            <span class="log-title">📜 小店日记</span>
            <span class="log-count" id="logCount">共 0 条</span>
            <button id="logCollapse" class="log-collapse-btn" type="button" aria-expanded="false" title="折叠到最近 3 条">收起 ▾</button>
        </div>
        <input id="logSearch" class="log-search" type="search"
               placeholder="搜索日记内容或天数…" autocomplete="off">
    </div>

    <div class="log-list" id="logList">
        <!-- 系统日志容器 -->
        <div id="runtimeBody"></div>
        <!-- 玩家日记容器 -->
        <div id="listBody"></div>
        <button id="loadMore" class="load-more" type="button" hidden>加载更早的日记</button>
    </div>

    <button id="jumpBtn" class="jump-btn" type="button">有新日记 ↑</button>

    <!-- 引入拆分后的两个逻辑模块 -->
    <script src="system.js"></script>
    <script src="player.js"></script>
</body>
</html>
