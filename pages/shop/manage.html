<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 经营策略</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--pink-600); cursor: pointer; font-weight: bold; }
        .rate-btn { flex: 1; padding: 8px 0; border: 1px solid var(--pink-200); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-muted); transition: 0.2s; }
        .rate-btn.active { background: var(--pink-400); color: #fff; border-color: var(--pink-400); font-weight: bold; box-shadow: 0 2px 8px rgba(255,143,163,0.3); }
        .fatal-error { background: #ff4d4f; color: white; padding: 20px; border-radius: 10px; font-family: monospace; font-size: 14px; word-break: break-all; margin: 20px; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <button type="button" class="back-btn" id="backBtn">← 返回店铺</button>
        <div class="content" id="content">
            <div class="muted text-center" style="margin-top:50px;">⏳ 正在加载经营数据...</div>
        </div>
    </div>

    <script src="../boot-safe.js"></script>
    <script type="module">
        let Cake = null;

        function showFatalError(msg) {
            window.safePageBoot?.showFatalError(msg, 'content');
        }

        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        const render = () => {
            try {
                const state = Cake.store.state;
                const shop = state.shop || {};
                const priceRate = num(shop.priceRate, 1.0);
                const cleanliness = num(shop.stats?.cleanliness, 100);

                const RATES = [
                    { val: 0.8, label: '亲民' },
                    { val: 1.0, label: '标准' },
                    { val: 1.2, label: '精品' },
                    { val: 1.5, label: '奢华' }
                ];

                document.getElementById('content').innerHTML = `
                    <div class="card">
                        <h3>🧹 店铺卫生</h3>
                        <p class="muted" style="margin-bottom:10px;">卫生度影响顾客进店概率，每日自然下降。</p>
                        <div style="font-size:24px; font-weight:bold; color:var(--pink-600); text-align:center; margin-bottom:10px;">${cleanliness}%</div>
                        <button id="btn-clean" class="small gold" style="width:100%; padding:10px;" ${cleanliness >= 100 ? 'disabled' : ''}>
                            ${cleanliness >= 100 ? '✨ 已经很干净了' : '开始打扫 (耗时30分钟)'}
                        </button>
                    </div>

                    <div class="card">
                        <h3>📈 定价策略</h3>
                        <p class="muted" style="margin-bottom:10px;">定价越高，单笔利润越大，但顾客购买意愿会降低。</p>
                        <div style="display:flex; gap:8px;">
                            ${RATES.map(r => `
                                <button class="rate-btn ${priceRate === r.val ? 'active' : ''}" data-rate="${r.val}">
                                    ${r.label}<br>${r.val}x
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                document.getElementById('btn-clean').addEventListener('click', () => {
                    try {
                        if (typeof Cake.cleanShop === 'function') {
                            const res = Cake.cleanShop();
                            if (res && res.success === false) {
                                alert(res.message);
                            } else {
                                render();
                            }
                        } else {
                            alert('打扫功能未加载');
                        }
                    } catch (e) {
                        console.error(e);
                        alert('打扫时发生错误: ' + e.message);
                    }
                });

                document.querySelectorAll('[data-rate]').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        window.setRate(Number(btn.dataset.rate));
                    });
                });
            } catch (err) {
                console.error('❌ [Manage] 渲染崩溃:', err);
                showFatalError(`渲染过程发生异常：<br>${err.message}`);
            }
        };

        window.setRate = (val) => {
            try {
                Cake.store.state.shop.priceRate = val;
                if (Cake.saveState) Cake.saveState();
                render();
                if (Cake.emit) Cake.emit('refresh_ui');
            } catch (e) {
                console.error('设置定价失败:', e);
                alert('设置定价失败: ' + e.message);
            }
        };

        function renderPage() {
            if (typeof Cake.initPage === 'function') {
                Cake.initPage('shop', render, false);
            } else {
                render();
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => history.back());

        window.safePageBoot.waitForCake((readyCake) => {
            Cake = readyCake;
            renderPage();
        }, {
            timeout: 15000,
            required: (game) => !!(game && game.store && game.store.state),
            onTimeout: () => '游戏引擎加载超时！请刷新页面。'
        });
    </script>
</body>
</html>
