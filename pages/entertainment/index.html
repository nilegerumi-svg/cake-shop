<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>娱乐与外出</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        body { background: transparent; font-family: sans-serif; padding: 16px; display: flex; justify-content: center; color: #4a3b3f; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(255,182,193,0.2); text-align: center; width: 100%; max-width: 340px; }
        .energy-box { background: #fff9fa; padding: 10px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffd1dc; font-weight: bold; }
        h2 { color: #ff6b81; margin: 0 0 12px 0; font-size: 16px; text-align: left; border-left: 4px solid #ffb6c1; padding-left: 8px; }
        .menu-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: #f0faf8; color: #4a3b3f; border: 1px solid #a8e6cf;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: transform 0.1s; margin-bottom: 12px;
            text-decoration: none; box-sizing: border-box;
        }
        .menu-btn:active { transform: scale(0.98); background: #e0f5f0; }
        .menu-btn.rest { background: #fff0f5; border-color: #ffb6c1; }
        .menu-btn.disabled { background: #f5f5f5; border-color: #ddd; color: #aaa; pointer-events: none; }
        .menu-icon { font-size: 18px; }
        .menu-sub { font-size: 12px; color: #888; font-weight: normal; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="energy-box">⚡ 当前体力：<span id="energy">--</span>/100</div>
        <h2>🎮 休息区</h2>
        <button id="btnRest" class="menu-btn rest" type="button">
            <div style="text-align: left;">
                <div class="menu-icon">😴 休息一下</div>
                <div class="menu-sub">恢复体力，耗时 1 小时</div>
            </div>
            <span style="color: #ffb6c1;">▶</span>
        </button>
        <h2 style="margin-top: 24px;">🛴 外出区</h2>
        <button id="btnGoMap" class="menu-btn" type="button">
            <div style="text-align: left;">
                <div class="menu-icon">🗺️ 外出散步</div>
                <div class="menu-sub">去不同的地方邂逅不同的人和事</div>
            </div>
            <span style="color: #a8e6cf;">▶</span>
        </button>
    </div>

    <script>
    (() => {
        'use strict';

        const $ = (id) => document.getElementById(id);

        let G = null;
        let tries = 0;
        const MAX_TRIES = 100;      // 100 × 100ms = 10s
        const UI_INTERVAL = 500;
        let uiTimer = null;

        const num = (v, fallback = 0) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        const getEngine = () => {
            try {
                if (window.parent && window.parent !== window && window.parent.Game) {
                    return window.parent.Game;
                }
            } catch (_) { /* 跨域 */ }
            return window.Game || null;
        };

        /* ==================== UI 刷新 ==================== */

        const updateUI = () => {
            const s = G && G.state;
            if (!s) return;

            const energy = Math.max(0, Math.min(100, num(s.energy, 0)));
            const energyEl = $('energy');
            if (energyEl) energyEl.innerText = energy;

            const btnRest = $('btnRest');
            if (btnRest) btnRest.classList.toggle('disabled', energy >= 100);

            const btnGoMap = $('btnGoMap');
            if (btnGoMap) btnGoMap.classList.toggle('disabled', energy < 8);
        };

        const startUiLoop = () => {
            if (uiTimer) return;
            updateUI();
            uiTimer = setInterval(updateUI, UI_INTERVAL);
        };

        const stopUiLoop = () => {
            if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
        };

        /* ==================== 事件绑定 ==================== */

        const bindClick = () => {
            const btnRest = $('btnRest');
            if (btnRest && !btnRest.dataset.bound) {
                btnRest.dataset.bound = 'true';
                btnRest.addEventListener('click', () => {
                    // 动态取一次，防止 G 引用过期
                    const engine = G || getEngine();
                    if (!engine || !engine.state) return;
                    if (num(engine.state.energy, 0) >= 100) return;

                    try {
                        if (typeof engine.rest !== 'function') throw new Error('找不到 G.rest 方法');
                        engine.rest();
                        setTimeout(updateUI, 100);
                    } catch (err) {
                        alert('❌ 休息报错：\n' + (err && err.message || err));
                    }
                });
            }

            const btnGoMap = $('btnGoMap');
            if (btnGoMap && !btnGoMap.dataset.bound) {
                btnGoMap.dataset.bound = 'true';
                btnGoMap.addEventListener('click', (e) => {
                    e.preventDefault();
                    const engine = G || getEngine();
                    if (!engine || !engine.state) return;
                    if (num(engine.state.energy, 0) < 8) return;

                    // 优先走宿主路由，保证导航高亮与 iframe 内导航一致
                    try {
                        if (window.parent && window.parent !== window &&
                            window.parent.HostRouter &&
                            typeof window.parent.HostRouter.navigateTo === 'function') {
                            window.parent.HostRouter.navigateTo('pages/entertainment/map.html');
                            return;
                        }
                    } catch (_) { /* 跨域或未定义，走兜底 */ }

                    window.location.href = 'map.html';
                });
            }
        };

        /* ==================== 启动 ==================== */

        const boot = () => {
            const engine = getEngine();

            if (engine && engine.state) {
                G = engine;
                window.Game = engine;
                bindClick();
                startUiLoop();
                return;
            }

            if (++tries >= MAX_TRIES) {
                const box = $('energy');
                if (box) box.innerText = '--';
                console.error('❌ [娱乐页] 等待父页面 Game 超时');
                return;
            }

            setTimeout(boot, 100);
        };

        // 页面隐藏时暂停轮询，避免 iframe 切走后空转
        window.addEventListener('pagehide', stopUiLoop);

        boot();
    })();
    </script>
</body>
</html>
