<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 我的 · 甜蜜物语</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .nav-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px; background: #fff; border-radius: 12px;
            margin-bottom: 12px; cursor: pointer; border: 1px solid var(--pink-100);
            transition: 0.2s;
        }
        .nav-card:active { transform: scale(0.98); background: #fff8fa; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-icon { font-size: 28px; }
        .nav-title { font-weight: bold; color: var(--pink-600); font-size: 15px; }
        .nav-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .arrow { color: var(--pink-300); font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-body" style="padding-top: 10px;">
        <div class="content" id="content"></div>
    </div>

    <script type="module">
        const Cake = window.parent.Cake || window.Cake;
        if (!Cake) return;

        const contentEl = document.getElementById('content');
        const esc = Cake.escapeHtml || ((v) => String(v ?? ''));
        const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;

        const renderProfile = () => {
            const s = Cake.store.state;
            const shopName = s.shop?.name || '甜蜜小屋';
            const day = num(s.time?.day, 1);
            const money = num(s.money, 0);
            const reputation = num(s.shop?.stats?.reputation, 0);
            const shopLevel = num(s.shopLevel, 1); 
            const decoration = num(s.decoration, 0);
            const totalCakes = num(s.totalCakes, 0);
            const totalEarned = num(s.totalEarned, 0);
            
            // 统计数据
            const achCount = (Cake.ACHIEVEMENTS || []).filter(a => s.achievements && s.achievements[a.id]).length;
            const toolCount = Object.keys(s.tools || {}).filter(id => s.tools[id].owned).length;
            const invCount = (s.inventory || []).length;

            contentEl.innerHTML = `
                <div class="card">
                    <h2>📊 我的档案</h2>
                    <div class="grid-2" style="margin-bottom: 20px;">
                        <div class="item-card">
                            <span class="item-emoji">${esc(s.avatar || '👩‍🍳')}</span>
                            <span class="item-name">${esc(s.playerName || '店长')}</span>
                            <span class="item-desc">「${esc(shopName)}」的店长</span>
                            <span class="item-meta">经营第 ${day} 天</span>
                        </div>
                        <div class="item-card">
                            <span class="item-emoji">📈</span>
                            <span class="item-name">经营数据</span>
                            <span class="item-desc">余额：${money}元<br>累计卖出：${totalCakes}个<br>累计收入：${totalEarned}元<br>声望：${reputation}</span>
                        </div>
                    </div>

                    <!-- 个人中心导航 -->
                    <h3>📂 我的收藏与资产</h3>
                    
                    <div class="nav-card" onclick="go('achievements.html')">
                        <div class="nav-left">
                            <span class="nav-icon">🏅</span>
                            <div>
                                <div class="nav-title">成就殿堂</div>
                                <div class="nav-desc">已解锁 ${achCount} 个成就</div>
                            </div>
                        </div>
                        <span class="arrow">→</span>
                    </div>

                    <div class="nav-card" onclick="go('tools.html')">
                        <div class="nav-left">
                            <span class="nav-icon">🛠️</span>
                            <div>
                                <div class="nav-title">工具库</div>
                                <div class="nav-desc">已拥有 ${toolCount} 件工具</div>
                            </div>
                        </div>
                        <span class="arrow">→</span>
                    </div>

                    <div class="nav-card" onclick="go('inventory.html')">
                        <div class="nav-left">
                            <span class="nav-icon">🎒</span>
                            <div>
                                <div class="nav-title">食材仓库</div>
                                <div class="nav-desc">当前储存 ${invCount} 份食材</div>
                            </div>
                        </div>
                        <span class="arrow">→</span>
                    </div>

                    <h3>💾 系统操作</h3>
                    <div class="char-actions" style="gap:10px;margin-top:8px;">
                        <button type="button" class="small" onclick="Cake.saveState(); alert('✅ 游戏已保存！')">💾 保存游戏</button>
                        <button type="button" class="small secondary" onclick="resetGame()">🔄 重新开始</button>
                    </div>
                </div>`;
        };

        // 内部跳转（iframe 内跳转）
        window.go = (page) => {
            window.location.href = page;
        };

        window.resetGame = () => {
            if (confirm('⚠️ 确定要重新开始吗？这会清空当前所有进度！')) {
                localStorage.removeItem(Cake.store.SAVE_KEY || 'cake_shop_save');
                window.parent.location.href = '../../index.html';
            }
        };

        if (typeof Cake.initPage === 'function') {
            Cake.initPage('profile', () => renderProfile(), false);
        }
    </script>
</body>
</html>
